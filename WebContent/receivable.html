<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目应收</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .status-tag { padding:2px 8px; border-radius:10px; font-size:12px; color:#fff;}
        .st-DRAFT { background:#909399;}
        .st-AUDIT { background:#e6a23c;}
        .st-FINAL { background:#67c23a;}
        .st-REJECTED { background:#f56c6c;}
        .calc-detail { font-size:13px; line-height:1.8; }
        .calc-detail h4 { color:#409eff; margin:16px 0 10px 0; font-size:15px; border-bottom:1px solid #e9ecef; padding-bottom:8px; }
        .calc-detail .data-box { background:#f8f9fa; padding:12px 16px; border-radius:6px; margin:10px 0; }
        .calc-detail .rule-row { margin:8px 0; padding-left:16px; border-left:3px solid #409eff; }
        .calc-detail .result-row { background:#ecf5ff; padding:12px 16px; border-radius:6px; margin-top:16px; }
        .calc-detail .group-section { margin:16px 0; padding:16px; background:#fafafa; border-radius:8px; }
        .calc-detail .formula { color:#67c23a; font-weight:500; }
        .calc-detail .highlight { color:#409eff; font-weight:600; }

        /* 应收编辑弹窗两列布局 */
        .r-form-grid { display: grid; grid-template-columns: 220px 1fr; gap: 12px 20px; }
        .r-form-grid .form-item { margin-bottom: 0; }
        .r-form-grid .form-item.col-full { grid-column: 1 / -1; margin-top: 4px; }
        .r-form-grid label { width: 110px; flex-shrink: 0; }
        /* 依据考核应收样式：不可编辑、居左显示、突出 */
        .assess-amount-display {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: #ecf5ff;
            color: #409eff;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
            box-sizing: border-box;
        }
        /* 明细考核表格加宽 */
        .r-assess-wrap {
            width: 100%;
            overflow-x: auto;
        }
        .r-assess-wrap table {
            width: 100%;
            min-width: 900px;
            table-layout: fixed;
        }
        .r-assess-wrap col.c-type { width: 160px; }
        .r-assess-wrap col.c-remark { width: 200px; }
        .r-assess-wrap col.c-target { width: 110px; }
        .r-assess-wrap col.c-actual { width: 110px; }
        .r-assess-wrap col.c-reward { width: 130px; }
        .r-assess-wrap col.c-attach { width: 230px; }
        .r-assess-wrap col.c-op { width: 100px; }
        .r-assess-wrap td, .r-assess-wrap th {
            padding: 6px 8px;
            word-break: break-all;
            vertical-align: top;
        }
        /* 附件行内显示 */
        .attach-inline-box { border:1px solid #ebeef5; border-radius:4px; padding:4px; background:#fafafa; min-height: 28px;}
        .attach-inline-list { margin-bottom:4px; min-height:20px;}
        .attach-inline-item { display:inline-flex; align-items:center; gap:2px; padding:2px 6px; background:#fff; border:1px solid #e4e7ed; border-radius:4px; margin:0 2px 2px 0; font-size:11px;}
        .attach-inline-item .name { max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
        .attach-inline-item a.name { color:#409eff; text-decoration:none; cursor:pointer;}
        .attach-inline-item a.name:hover { text-decoration:underline;}
        .attach-inline-item .del { color:#f56c6c; cursor:pointer;}
        .attach-inline-upload { margin-top:2px;}
        .attach-inline-upload .btn { padding: 1px 6px; font-size: 11px;}
        /* 备注全宽 */
        .remark-full {
            width: 100% !important;
            min-height: 80px;
            resize: vertical;
        }
        /* 输入框尺寸收窄 */
        .narrow-input input, .narrow-input select {
            width: 100%;
        }
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;" onclick="$('#loadingOverlay').hide();">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:32px 48px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div style="font-size:32px;margin-bottom:16px;">⏳</div>
        <div id="loadingText" style="font-size:16px;color:#333;">正在计算...</div>
        <div style="margin-top:16px;color:#999;font-size:12px;">点击任意位置关闭</div>
    </div>
</div>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <input type="hidden" id="selProject">
    <input id="txtProject" readonly placeholder="请选择项目" style="width:300px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <select id="selStage">
        <option value="">全部阶段</option>
        <option value="全年">全年合计</option>
        <option value="阶段一">阶段一</option>
        <option value="阶段二">阶段二</option>
        <option value="阶段三">阶段三</option>
        <option value="阶段四">阶段四</option>
    </select>
    <select id="selStatus">
        <option value="">全部状态</option>
        <option value="DRAFT">草稿</option>
        <option value="AUDIT">待终稿</option>
        <option value="FINAL">已终稿</option>
        <option value="REJECTED">已驳回</option>
    </select>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">+ 新增应收</button>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn" id="btnExport">导出Excel</button>
    <span style="flex:1;"></span>
    <span style="color:#909399; font-size:12px;">应收确认后，关联阶段的上游流向将自动置为终版不可修改</span>
</div>

<div class="table-wrap">
    <table>
        <thead><tr>
            <th>阶段</th><th>依据规模应收</th><th>依据考核应收</th><th>合计应收</th>
            <th>税率</th><th>无税金额</th><th>系统估算</th><th>状态</th><th>填报人</th><th>填报时间</th>
            <th>审核人</th><th>审核时间</th><th>备注</th><th width="160">操作</th>
        </tr></thead>
        <tbody id="body"></tbody>
    </table>
</div>

<!-- 加宽到 1050px，使用两列布局 -->
<div class="modal-mask" id="modalR">
    <div class="modal" style="width:1050px;">
        <div class="modal-header" id="modalRTitle">新增应收<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalR')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="r_id">
            <input type="hidden" id="r_projectId">
            <div class="r-form-grid">
                <!-- 左列：阶段（窄） -->
                <div class="form-item narrow-input"><label>阶段 *</label>
                    <select id="r_stage">
                        <option value="全年合计">全年合计</option>
                        <option value="阶段一">阶段一</option>
                        <option value="阶段二">阶段二</option>
                        <option value="阶段三">阶段三</option>
                        <option value="阶段四">阶段四</option>
                    </select>
                </div>
                <!-- 右列：项目（编辑模式下禁用选择） -->
                <div class="form-item"><label>项目 *</label>
                    <div style="display:flex; gap:8px;">
                        <input id="r_txtProject" readonly placeholder="请选择项目" style="flex:1; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
                        <button class="btn" id="r_btnSelProj" type="button">选择项目</button>
                    </div>
                </div>
                <!-- 金额、税率、无税金额同一行 -->
                <div class="form-item col-full">
                    <div style="display:flex; gap:20px; align-items:flex-end;">
                        <div class="form-item narrow-input" style="flex:1; margin:0;"><label>依据规模应收(元)</label><input id="r_scaleAmount" type="number" step="0.01"></div>
                        <div class="form-item narrow-input" style="flex:1; margin:0;"><label>系统估算(元) <span style="cursor:pointer;color:#409eff;display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border:1px solid #409eff;border-radius:50%;font-size:12px;" id="btnCalcEstimate" title="点击计算">?</span></label><input id="r_estimateAmount" type="number" step="0.01" readonly></div>
                        <div class="form-item" style="flex:1; margin:0;"><label>依据考核应收(元)</label>
                            <div id="r_assessAmountDisplay" class="assess-amount-display">0.00</div>
                            <input type="hidden" id="r_assessAmount">
                        </div>
                        <div class="form-item narrow-input" style="flex:0.6; margin:0;"><label>税率(%)</label><input id="r_taxRate" type="number" step="0.01" placeholder="如13"></div>
                        <div class="form-item" style="flex:1; margin:0;"><label>无税金额(元)</label>
                            <div id="r_taxExcludedAmount" class="assess-amount-display" style="background:#f0f9eb;color:#67c23a;">0.00</div>
                        </div>
                    </div>
                </div>

                <!-- 依据考核明细应收（全宽，加宽表格） -->
                <div class="form-item col-full">
                    <label style="display:block; margin-bottom:6px;">依据考核应收明细</label>
                    <div class="r-assess-wrap">
                        <table class="table-nowrap" id="r_assessTable" style="font-size:13px;">
                            <colgroup>
                                <col class="c-type">
                                <col class="c-remark">
                                <col class="c-target">
                                <col class="c-actual">
                                <col class="c-reward">
                                <col class="c-attach">
                                <col class="c-op">
                            </colgroup>
                            <thead><tr>
                                <th>考核项目</th><th>备注说明</th><th>目标</th><th>达成</th><th>奖惩金额</th><th>附件</th><th>操作</th>
                            </tr></thead>
                            <tbody id="r_assessBody"></tbody>
                        </table>
                        <button class="btn btn-sm" id="r_addAssessRow" type="button" style="margin-top:6px;">+ 添加行</button>
                    </div>
                </div>

                <!-- 备注单行 -->
                <div class="form-item col-full">
                    <label style="display:inline-block; width:90px;">备注</label>
                    <input id="r_remark" type="text" placeholder="请输入备注" style="width: calc(100% - 100px); padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
                </div>
            </div>
            <p style="color:#888; font-size:12px; margin-top:12px;">新增/修改后，状态为草稿（DRAFT），待运营人员审核后变为已终稿（FINAL）。考核明细附件需先保存应收记录后再上传。</p>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalR')">取消</button>
            <button class="btn btn-primary" id="btnSaveR">保存</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="modalEstimateDetail">
    <div class="modal" style="width:850px; max-height:85vh; overflow:hidden;">
        <div class="modal-header">估算应收计算明细<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalEstimateDetail')">×</span></div>
        <div class="modal-body" style="max-height:65vh; overflow-y:auto;">
            <div id="estimateDetailContent" class="calc-detail"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="RB.closeModal('modalEstimateDetail')">确认</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/rebate-calc.js"></script>
<script src="js/project-selector.js"></script>
<script>
    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    var editingId = null;
    var curProject = null;
    var currentProjectData = null;
    // 每行的附件缓存：key = tr临时id或assessItemId，value = AttachFile数组
    var rRowAttachs = {};
    var rRowTempSeq = 0;

    $(function () {
        $('#loadingOverlay').hide();
        
        RB.checkLogin(function () { 
            loadYears();
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#selProject',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { load(); }
            });
            RB.bindProjectSelector({
                trigger: '#r_btnSelProj, #r_txtProject',
                display: '#r_txtProject',
                hidden: '#r_projectId',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { $('#r_estimateAmount').val(''); }
            });
        });

        $('#selStage').on('change', load);
        $('#selStatus').on('change', load);
        $('#btnSearch').on('click', load);
        $('#btnRefresh').on('click', load);
        $('#btnExport').on('click', exportReceivable);
        $('#btnAdd').on('click', function () { RB.withPerm('receivable:edit', openAdd, '权限不足，无法编辑应收'); });
        $('#btnSaveR').on('click', function() { RB.withPerm('receivable:edit', saveR, '权限不足，无法编辑应收'); });
        $('#btnCalcEstimate').on('click', function() {
            var pid = $('#r_projectId').val(), stage = $('#r_stage').val();
            if (!pid || !stage) {
                RB.toast('请先选择项目和阶段', 'error');
                return;
            }
            tryLoadEstimate();
        });
        
        $('#r_stage').on('change', function() {
            $('#r_estimateAmount').val('');
        });
        $('#r_scaleAmount, #r_taxRate').on('input change', refreshTaxExcludedAmount);
        $('#r_addAssessRow').on('click', function() { addRAssessRow(null); });
    });

    function escAttr(v) { return (v == null ? '' : String(v)).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    function refreshAssessTotal() {
        var items = collectRAssessItems(true);
        var total = 0;
        for (var i = 0; i < items.length; i++) {
            total += Number(items[i].rewardAmount || 0);
        }
        $('#r_assessAmountDisplay').text(Number(total || 0).toFixed(2));
        $('#r_assessAmount').val(total);
        refreshTaxExcludedAmount();
    }

    function refreshTaxExcludedAmount() {
        var scale = Number($('#r_scaleAmount').val() || 0);
        var assess = Number($('#r_assessAmount').val() || 0);
        var total = scale + assess;
        var rate = Number($('#r_taxRate').val() || 0);
        var ex = rate > 0 ? total / (1 + rate / 100) : total;
        $('#r_taxExcludedAmount').text(Number(ex || 0).toFixed(2));
    }

    function addRAssessRow(data) {
        var itemTypes = [
            {value: 'STAFF_COUNT', label: '作业人数'},
            {value: 'VISIT_COUNT', label: '拜访次数'},
            {value: 'MEETING', label: '会议场次'},
            {value: 'EDUCATING', label: '学术活动'},
            {value: 'TECH_RULE', label: '合规培训'},
            {value: 'TECH_PROD', label: '产品培训'},
            {value: 'TESTING', label: '月度考试'},
            {value: 'SUPP_FILE', label: '支持文件'},
            {value: 'INCUST_CNT', label: '准入家数'},
            {value: 'OTHER', label: '其它'}
        ];
        var typeOpts = '';
        for (var i = 0; i < itemTypes.length; i++) {
            var sel = data && data.itemType === itemTypes[i].value ? ' selected' : '';
            typeOpts += '<option value="' + itemTypes[i].value + '"' + sel + '>' + itemTypes[i].label + '</option>';
        }
        var esc = escAttr;
        var tempId = '_tmp_' + (++rRowTempSeq);
        var rowKey = data && data.id ? String(data.id) : tempId;
        if (!rRowAttachs[rowKey]) rRowAttachs[rowKey] = data && data.attachFiles ? data.attachFiles.slice() : [];

        var tr = '<tr data-rowkey="' + esc(rowKey) + '" data-tmpid="' + esc(tempId) + '" data-itemid="' + esc(data && data.id ? data.id : '') + '">' +
            '<td><select class="r-assess-type" style="width:100%;padding:4px 6px;">' + typeOpts + '</select></td>' +
            '<td><input type="text" class="r-assess-remark" value="' + esc(data && data.remark) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="r-assess-target" value="' + esc(data && data.targetValue) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="r-assess-actual" value="' + esc(data && data.actualValue) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="r-assess-reward" value="' + esc(data && data.rewardAmount) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td>' + renderRowAttachBox(rowKey) + '</td>' +
            '<td><button type="button" class="btn btn-xs btn-danger r-assess-del">删除</button></td>' +
            '</tr>';
        var $tr = $(tr);
        $tr.find('.r-assess-del').on('click', function() {
            var rk = $(this).closest('tr').data('rowkey');
            if (rk) delete rRowAttachs[rk];
            $(this).closest('tr').remove();
            refreshAssessTotal();
        });
        $tr.find('.r-assess-reward, .r-assess-target, .r-assess-actual').on('change input', refreshAssessTotal);
        // 附件上传
        bindRowAttachUpload($tr, rowKey, 'RECEIVABLE');
        $('#r_assessBody').append($tr);
        refreshAssessTotal();
    }

    function renderRowAttachBox(rowKey) {
        var list = rRowAttachs[rowKey] || [];
        var token = RB.getToken ? RB.getToken() : '';
        var innerList = '';
        for (var i = 0; i < list.length; i++) {
            var a = list[i];
            var nameHtml;
            if (a.downloadUrl) {
                var url = a.downloadUrl + (a.downloadUrl.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
                nameHtml = '<a class="name" href="' + url + '" target="_blank" title="点击下载：' + escAttr(a.fileName) + '">' + a.fileName + '</a>';
            } else {
                nameHtml = '<span class="name" title="' + escAttr(a.fileName) + '">' + a.fileName + '</span>';
            }
            innerList += '<span class="attach-inline-item" data-aid="' + escAttr(a.id) + '">' + nameHtml +
                '<span class="del" onclick="deleteRowAttach(\'' + escAttr(rowKey) + '\', ' + a.id + ')">×</span></span>';
        }
        return '<div class="attach-inline-box">' +
            '<div class="attach-inline-list">' + innerList + '</div>' +
            '<div class="attach-inline-upload">' +
            '<label class="btn btn-xs" style="cursor:pointer;">' +
            '+ 附件<input type="file" class="row-attach-input" multiple style="display:none;" data-rowkey="' + escAttr(rowKey) + '">' +
            '</label></div></div>';
    }

    function bindRowAttachUpload($tr, rowKey, bizType) {
        $tr.find('.row-attach-input').on('change', function(e) {
            var files = e.target.files;
            if (!files || files.length === 0) return;
            // 应收记录需要先有id才能上传附件
            var rId = $('#r_id').val();
            if (!rId || rId === '0' || !editingId) {
                RB.toast('请先保存应收记录后再上传附件', 'error');
                e.target.value = '';
                return;
            }
            // 获取当前行的 assessItemId（如果有）
            var itemId = $tr.data('itemid') || 0;
            for (var i = 0; i < files.length; i++) {
                uploadRowAttach(rId, itemId, rowKey, files[i]);
            }
            e.target.value = '';
        });
    }

    function uploadRowAttach(recId, itemId, rowKey, file) {
        var fd = new FormData();
        fd.append('file', file);
        fd.append('receivableId', recId);
        fd.append('assessItemId', itemId || 0);
        fd.append('rowKey', rowKey);
        RB.post('/api/receivable-payable?op=uploadAssessAttach', fd, true).done(function(r) {
            if (r.code === 0) {
                // 回写真实的itemId到行
                if (r.data && r.data.assessItemId) {
                    var $tr = $('#r_assessBody tr[data-rowkey="' + rowKey + '"]');
                    if ($tr.length && !$tr.data('itemid')) $tr.data('itemid', r.data.assessItemId);
                }
                if (!rRowAttachs[rowKey]) rRowAttachs[rowKey] = [];
                rRowAttachs[rowKey].push(r.data.file);
                // 重新渲染附件区域
                var $tr = $('#r_assessBody tr[data-rowkey="' + rowKey + '"]');
                if ($tr.length) {
                    $tr.find('td:eq(5)').html(renderRowAttachBox(rowKey));
                    bindRowAttachUpload($tr, rowKey, 'RECEIVABLE');
                }
                RB.toast('上传成功', 'success');
            } else {
                RB.toast(r.msg || '上传失败', 'error');
            }
        }).fail(function() { RB.toast('上传失败', 'error'); });
    }

    function deleteRowAttach(rowKey, attachId) {
        RB.confirm('确认删除该附件？', function() {
            RB.post('/api/receivable-payable?op=deleteAssessAttach', { id: attachId }).done(function(r) {
                if (r.code === 0) {
                    var list = rRowAttachs[rowKey] || [];
                    for (var i = 0; i < list.length; i++) {
                        if (String(list[i].id) === String(attachId)) {
                            list.splice(i, 1);
                            break;
                        }
                    }
                    var $tr = $('#r_assessBody tr[data-rowkey="' + rowKey + '"]');
                    if ($tr.length) {
                        $tr.find('td:eq(5)').html(renderRowAttachBox(rowKey));
                        bindRowAttachUpload($tr, rowKey, 'RECEIVABLE');
                    }
                    RB.toast('已删除', 'success');
                } else {
                    RB.toast(r.msg || '删除失败', 'error');
                }
            });
        });
    }

    function collectRAssessItems(silent) {
        var items = [];
        $('#r_assessBody tr').each(function() {
            var $tr = $(this);
            items.push({
                id: $tr.data('itemid') || null,
                itemType: $tr.find('.r-assess-type').val(),
                remark: $tr.find('.r-assess-remark').val(),
                targetValue: $tr.find('.r-assess-target').val(),
                actualValue: $tr.find('.r-assess-actual').val(),
                rewardAmount: $tr.find('.r-assess-reward').val(),
                rowKey: $tr.data('rowkey')
            });
        });
        return items;
    }

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    function load() {
        var pid = $('#selProject').val();
        var stage = $('#selStage').val();
        var status = $('#selStatus').val();
        if (!pid) { $('#body').html(''); curProject = null; currentProjectData = null; return; }
        curProject = { id: pid };
        
        RB.post('/api/receivable-payable?op=listReceivable', { projectId: pid, stage: stage, status: status }).done(function(r) {
            if (r.code === 0) {
                var rows = r.data;
                var html = '', totalScale = 0, totalAssess = 0, totalSum = 0, totalEst = 0, totalTaxEx = 0;
                for (var i = 0; i < rows.length; i++) {
                    var x = rows[i];
                    totalScale += Number(x.scaleAmount || 0);
                    totalAssess += Number(x.assessAmount || 0);
                    totalSum += Number(x.totalAmount || 0);
                    totalEst += Number(x.estimateAmount || 0);
                    var rate = Number(x.taxRate || 0);
                    var taxEx = rate > 0 ? Number(x.totalAmount || 0) / (1 + rate / 100) : Number(x.totalAmount || 0);
                    totalTaxEx += taxEx;
                    var st = x.status || 'DRAFT';
                    html += '<tr>' +
                        '<td style="white-space:nowrap;"><strong>' + (x.stage || '') + '</strong></td>' +
                        '<td style="white-space:nowrap;">' + RB.formatMoney(x.scaleAmount) + '</td>' +
                        '<td style="white-space:nowrap;">' + RB.formatMoney(x.assessAmount) + '</td>' +
                        '<td style="white-space:nowrap;"><strong>' + RB.formatMoney(x.totalAmount) + '</strong></td>' +
                        '<td style="white-space:nowrap;">' + (rate > 0 ? rate.toFixed(2) + '%' : '-') + '</td>' +
                        '<td style="white-space:nowrap;color:#67c23a;">' + RB.formatMoney(taxEx) + '</td>' +
                        '<td style="white-space:nowrap;color:#909399;">' + RB.formatMoney(x.estimateAmount) + '</td>' +
                        '<td style="white-space:nowrap;"><span class="status-tag st-' + st + '">' + formatStatus(st) + '</span></td>' +
                        '<td style="white-space:nowrap;">' + (x.fillUserName || '-') + '</td>' +
                        '<td style="white-space:nowrap;">' + (x.fillTime || '-') + '</td>' +
                        '<td style="white-space:nowrap;">' + (x.auditUserName || '-') + '</td>' +
                        '<td style="white-space:nowrap;">' + (x.auditTime || '-') + '</td>' +
                        '<td style="white-space:nowrap;">' + (x.remark || '') + '</td>' +
                        '<td style="white-space:nowrap;">' + actionBtns(x) + '</td>' +
                        '</tr>';
                }
                html += '<tr style="background:#fafafa;font-weight:600;">' +
                    '<td style="white-space:nowrap;">合计</td>' +
                    '<td style="white-space:nowrap;">' + RB.formatMoney(totalScale) + '</td>' +
                    '<td style="white-space:nowrap;">' + RB.formatMoney(totalAssess) + '</td>' +
                    '<td style="white-space:nowrap;">' + RB.formatMoney(totalSum) + '</td>' +
                    '<td style="white-space:nowrap;"></td>' +
                    '<td style="white-space:nowrap;color:#67c23a;">' + RB.formatMoney(totalTaxEx) + '</td>' +
                    '<td style="white-space:nowrap;color:#909399;">' + RB.formatMoney(totalEst) + '</td>' +
                    '<td colspan="8" style="white-space:nowrap;"></td></tr>';
                if (rows.length === 0) html = '<tr><td colspan="14" style="text-align:center;color:#999;padding:30px;">暂无应收记录</td></tr>';
                $('#body').html(html);
            }
        });
        
        RB.post('/api/overview?op=overview', { projectId: pid }).done(function(r2) {
            if (r2.code === 0 && r2.data) {
                currentProjectData = r2.data;
                currentProjectData._pid = pid;
            }
        });
    }

    function formatStatus(status) {
        var map = { 'DRAFT': '草稿', 'AUDIT': '待审核', 'FINAL': '已完成', 'REJECTED': '已拒绝' };
        return map[status] || status || '';
    }

    function actionBtns(x) {
        var html = '';
        if (x.status === 'DRAFT' || x.status === 'REJECTED') {
            html += '<button class="btn btn-xs" onclick="RB.withPerm(\'receivable:edit\', function() { editR(' + x.id + '); }, \'权限不足，无法编辑应收\')">编辑</button> ';
            html += '<button class="btn btn-xs btn-danger" onclick="RB.withPerm(\'receivable:edit\', function() { delR(' + x.id + '); }, \'权限不足，无法删除应收\')">删除</button> ';
        }
        if (x.status === 'DRAFT') {
            html += '<button class="btn btn-xs btn-primary" onclick="RB.withPerm(\'receivable:edit\', function() { auditR(' + x.id + '); }, \'权限不足，无法编辑应收\')">确认</button>';
        }
        return html;
    }

    function setProjectEditable(editable) {
        if (editable) {
            $('#r_btnSelProj').show();
            $('#r_txtProject').css('cursor', 'pointer').css('background', '#fff');
        } else {
            $('#r_btnSelProj').hide();
            $('#r_txtProject').css('cursor', 'not-allowed').css('background', '#f5f7fa');
        }
    }

    function openAdd() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        editingId = null;
        rRowAttachs = {};
        $('#modalRTitle').text('新增应收');
        $('#r_id').val('');
        $('#r_projectId').val(pid);
        var curProjectName = $('#txtProject').val() || '';
        $('#r_txtProject').val(curProjectName);
        // 新增模式：项目可以选择（但仍然建议用户从工具条选择项目后新增，这里保持可选择）
        setProjectEditable(true);
        $('#r_stage').val('阶段一');
        $('#r_scaleAmount').val('');
        $('#r_taxRate').val('');
        $('#r_assessBody').empty();
        $('#r_estimateAmount').val('');
        $('#r_remark').val('');
        refreshAssessTotal();
        RB.openModal('modalR');
    }

    function editR(id) {
        editingId = id;
        rRowAttachs = {};
        RB.post('/api/receivable-payable?op=getReceivable', { id: id }).done(function (r) {
            if (r.code === 0) {
                var x = r.data;
                $('#modalRTitle').text('编辑应收');
                $('#r_id').val(x.id);
                $('#r_projectId').val(x.projectId);
                // 编辑模式：项目不可选择
                setProjectEditable(false);
                var projectName = $('#txtProject').val() || '';
                if ($('#selProject').val() && String($('#selProject').val()) === String(x.projectId)) {
                } else {
                    projectName = '';
                    (function(targetId) {
                        RB.post('/api/project?op=get', { id: targetId }).done(function(pr) {
                            if (pr.code === 0 && pr.data) {
                                $('#r_txtProject').val(pr.data.projectName || '');
                            }
                        });
                    })(x.projectId);
                }
                $('#r_txtProject').val(projectName);
                $('#r_stage').val(x.stage);
                $('#r_scaleAmount').val(x.scaleAmount || '');
                $('#r_taxRate').val(x.taxRate || '');
                $('#r_assessBody').empty();
                // 加载明细 + 附件
                RB.post('/api/receivable-payable?op=listReceivableAssessItems', { receivableId: id }).done(function(r2) {
                    if (r2.code === 0 && r2.data && r2.data.length) {
                        r2.data.forEach(function(item) { addRAssessRow(item); });
                    }
                    // 合计显示
                    $('#r_assessAmountDisplay').text(Number(x.assessAmount || 0).toFixed(2));
                    $('#r_assessAmount').val(x.assessAmount || 0);
                    refreshTaxExcludedAmount();
                });
                $('#r_estimateAmount').val(x.estimateAmount || '');
                $('#r_remark').val(x.remark || '');
                RB.openModal('modalR');
            } else {
                RB.toast(r.msg, 'error');
            }
        }).fail(function () {
            RB.toast('获取数据失败', 'error');
        });
    }

    function delR(id) {
        RB.confirm('确认删除该应收记录？', function () {
            RB.post('/api/receivable-payable?op=deleteReceivable', { id: id }).done(function (r) {
                if (r.code === 0) { RB.toast('已删除', 'success'); load(); }
                else RB.toast(r.msg, 'error');
            });
        });
    }

    function auditR(id) {
        RB.confirm('确认终稿该应收记录？确定后将自动锁定该阶段的上游流向。', function () {
            RB.post('/api/receivable-payable?op=auditReceivable', { id: id, action: 'PASS' }).done(function (r) {
                if (r.code === 0) { RB.toast('已终稿', 'success'); load(); }
                else RB.toast(r.msg, 'error');
            });
        });
    }

    function saveR() {
        var assessItems = collectRAssessItems();
        var assessTotal = 0;
        for (var i = 0; i < assessItems.length; i++) {
            assessTotal += Number(assessItems[i].rewardAmount || 0);
        }
        // 收集rowKey -> attachs 对应关系，后端保存时关联
        var rowAttachMap = {};
        for (var k in rRowAttachs) {
            if (rRowAttachs.hasOwnProperty(k) && rRowAttachs[k] && rRowAttachs[k].length) {
                rowAttachMap[k] = rRowAttachs[k].map(function(a) { return a.id; });
            }
        }
        var p = {
            id: editingId || 0,
            projectId: $('#r_projectId').val(),
            stage: $('#r_stage').val(),
            scaleAmount: $('#r_scaleAmount').val() || 0,
            assessAmount: assessTotal,
            assessItems: JSON.stringify(assessItems),
            rowAttachMap: JSON.stringify(rowAttachMap),
            estimateAmount: $('#r_estimateAmount').val() || 0,
            taxRate: $('#r_taxRate').val() || 0,
            remark: $('#r_remark').val()
        };
        if (!p.projectId || !p.stage) { RB.toast('请选择项目、阶段', 'error'); return; }
        RB.post('/api/receivable-payable?op=saveReceivable', p).done(function (r) {
            if (r.code === 0) {
                // 如果是新增保存后，刷新行的itemId以便继续上传附件
                if (r.data && r.data.itemIdRowKeyMap) {
                    var map = r.data.itemIdRowKeyMap;
                    $('#r_assessBody tr').each(function() {
                        var $tr = $(this);
                        var rk = $tr.data('rowkey');
                        if (rk && map[rk] && !$tr.data('itemid')) {
                            $tr.data('itemid', map[rk]);
                            $tr.attr('data-itemid', map[rk]);
                        }
                    });
                    if (!editingId && r.data.id) {
                        editingId = r.data.id;
                        $('#r_id').val(r.data.id);
                    }
                }
                RB.toast('保存成功', 'success');
                RB.closeModal('modalR');
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        });
    }

    function tryLoadEstimate() {
        var pid = $('#r_projectId').val();
        var stage = $('#r_stage').val();
        if (!pid || !stage) { $('#r_estimateAmount').val(''); return; }
        $('#loadingOverlay').show();
        RB.post('/api/overview?op=calcRebate', { projectId: pid, type: 'upstream' }).done(function(r) {
            if (r.code !== 0 || !r.data) {
                $('#loadingOverlay').hide();
                RB.toast('获取估算数据失败', 'error');
                return;
            }
            var reb = r.data;
            var rebateAmt = 0;
            if (stage === '全年合计') {
                rebateAmt = Number(reb.totalRebate || 0);
            } else if (stage === '阶段一' && reb.stageRebates && reb.stageRebates[0]) {
                rebateAmt = Number(reb.stageRebates[0].rebateAmount || 0);
            } else if (stage === '阶段二' && reb.stageRebates && reb.stageRebates[1]) {
                rebateAmt = Number(reb.stageRebates[1].rebateAmount || 0);
            } else if (stage === '阶段三' && reb.stageRebates && reb.stageRebates[2]) {
                rebateAmt = Number(reb.stageRebates[2].rebateAmount || 0);
            } else if (stage === '阶段四' && reb.stageRebates && reb.stageRebates[3]) {
                rebateAmt = Number(reb.stageRebates[3].rebateAmount || 0);
            }
            // 查询已保存的依据规模应收金额之和，并减去
            RB.post('/api/receivable-payable?op=sumScaleAmount', {
                type: 'receivable',
                projectId: pid,
                stage: stage,
                excludeId: editingId || 0
            }).done(function(r2) {
                $('#loadingOverlay').hide();
                var savedScale = (r2.code === 0 && r2.data && r2.data.sum) ? Number(r2.data.sum) : 0;
                var est = rebateAmt - savedScale;
                showEstimateDetail(reb, stage, est, rebateAmt, savedScale);
                $('#r_estimateAmount').val(Number(est || 0).toFixed(2));
            }).fail(function() {
                $('#loadingOverlay').hide();
                var est = rebateAmt;
                showEstimateDetail(reb, stage, est, rebateAmt, 0);
                $('#r_estimateAmount').val(Number(est || 0).toFixed(2));
            });
        }).fail(function() {
            $('#loadingOverlay').hide();
            RB.toast('获取估算数据失败', 'error');
        });
    }

    function showEstimateDetail(reb, stage, est, rebateAmt, savedScale) {
        var detailHtml = [];
        var mapStageIdx = { '阶段一': 0, '阶段二': 1, '阶段三': 2, '阶段四': 3 };

        function renderDetailsTable(sr) {
            if (!sr.details || sr.details.length === 0) return '';
            var h = '<table class="table-compact" style="width:100%; margin-top:10px; font-size:12px;">';
            h += '<thead><tr><th>考核组</th><th>奖励类型</th><th>达成率X</th><th>目标</th><th>实际值</th><th>计算基数</th><th>返利比例</th><th>计算模式</th><th>返利金额</th></tr></thead><tbody>';
            var subTotal = 0;
            for (var i = 0; i < sr.details.length; i++) {
                var d = sr.details[i];
                subTotal += Number(d.rebateAmount || 0);
                var rt = d.rewardType || 'PERSENT';
                var rtName = rt === 'PERSENT' ? '达成率' : (rt === 'SCALE' ? '达成额' : '增长率');
                var ratioPct = d.qtyBased ? Number(d.effectiveRatio || 0).toFixed(2) + '元/单位' : (Number(d.effectiveRatio || 0) * 100).toFixed(2) + '%';
                h += '<tr>'
                    + '<td>' + esc(d.groupName) + '</td>'
                    + '<td>' + rtName + '</td>'
                    + '<td>' + (rt === 'SCALE' ? RB.formatMoney(d.x) : Number(d.x || 0).toFixed(2) + '%') + '</td>'
                    + '<td>' + RB.formatMoney(d.target) + '</td>'
                    + '<td>' + RB.formatMoney(d.calcActual) + '</td>'
                    + '<td>' + RB.formatMoney(d.base) + '</td>'
                    + '<td>' + ratioPct + '</td>'
                    + '<td>' + (d.calcMode === 'FLAT' ? '全部计算' : '递进式') + '</td>'
                    + '<td><strong>' + RB.formatMoney(d.rebateAmount) + '</strong></td>'
                    + '</tr>';
            }
            h += '<tr style="background:#f5f7fa;font-weight:bold;"><td colspan="8" style="text-align:right;">分项合计：</td><td>' + RB.formatMoney(subTotal) + '</td></tr>';
            h += '</tbody></table>';
            return h;
        }

        detailHtml.push('<h4>📊 估算结果</h4>');
        detailHtml.push('<div class="data-box">');
        detailHtml.push('<strong>阶段：</strong>' + stage + '<br>');
        if (stage === '全年合计') {
            detailHtml.push('<strong>全年合计 = 四阶段累计 + 全年规则：</strong>' + RB.formatMoney(reb.totalRebate || 0) + ' 元<br>');
            if (reb.stageRebates) {
                for (var i = 0; i < reb.stageRebates.length; i++) {
                    var sr = reb.stageRebates[i];
                    detailHtml.push('<div class="group-section">');
                    detailHtml.push('<strong>· ' + sr.stageName + '</strong>：目标 ' + RB.formatMoney(sr.target || 0)
                        + ' / 实际 ' + RB.formatMoney(sr.actual || 0)
                        + ' → 返利 <strong>' + RB.formatMoney(sr.rebateAmount || 0) + '</strong> 元');
                    detailHtml.push(renderDetailsTable(sr));
                    detailHtml.push('</div>');
                }
            }
            detailHtml.push('<div class="group-section"><strong>· 全年专属规则（FULL_YEAR）返利：</strong>' + RB.formatMoney(reb.fullYearRebate || 0) + ' 元</div>');
        } else if (reb.stageRebates) {
            var idx = mapStageIdx[stage];
            if (idx != null && reb.stageRebates[idx]) {
                var sr = reb.stageRebates[idx];
                detailHtml.push('<strong>阶段目标：</strong>' + RB.formatMoney(sr.target || 0) + ' 元<br>');
                detailHtml.push('<strong>阶段实际：</strong>' + RB.formatMoney(sr.actual || 0) + ' 元<br>');
                var rate = (sr.target && sr.target > 0) ? (sr.actual / sr.target * 100).toFixed(2) : '0.00';
                detailHtml.push('<strong>达成率：</strong>' + rate + '%<br>');
                detailHtml.push('<strong>返利合计：</strong>' + RB.formatMoney(sr.rebateAmount || 0) + ' 元');
                detailHtml.push(renderDetailsTable(sr));
            }
        }
        detailHtml.push('</div>');

        detailHtml.push('<div class="result-row" style="border-top:2px dashed #409eff; padding-top:12px; margin-top:12px;">');
        detailHtml.push('<div style="margin-bottom:6px;"><strong>返利计算金额：</strong>' + RB.formatMoney(rebateAmt || 0) + ' 元</div>');
        detailHtml.push('<div style="margin-bottom:6px;"><strong>已保存的依据规模应收之和：</strong>' + RB.formatMoney(savedScale || 0) + ' 元' + (stage === '全年合计' ? '（全年所有阶段）' : '') + '</div>');
        detailHtml.push('<div style="font-size:13px; color:#909399; margin-bottom:6px;">估算应收 = 返利计算金额 - 已保存的依据规模应收之和</div>');
        detailHtml.push('<strong style="font-size:16px;">💰 最终估算应收：</strong><span class="highlight" style="font-size:20px;">' + RB.formatMoney(est || 0) + '</span> 元');
        detailHtml.push('</div>');

        $('#estimateDetailContent').html(detailHtml.join(''));
        RB.openModal('modalEstimateDetail');
    }

    function exportReceivable() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        var token = RB.getToken();
        var url = './api/receivable-payable?op=exportReceivable&projectId=' + curProject.id;
        if (token) url += '&token=' + encodeURIComponent(token);
        window.location.href = url;
    }
</script>
</body>
</html>
