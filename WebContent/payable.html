<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目应付</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .status-tag { padding:2px 8px; border-radius:10px; font-size:12px; color:#fff;}
        .st-DRAFT { background:#909399;}
        .st-AUDIT { background:#e6a23c;}
        .st-FINAL { background:#67c23a;}
        .st-REJECTED { background:#f56c6c;}
        .group-section { margin-bottom: 16px; padding-bottom: 8px;}
        .calc-detail { font-size:13px; line-height:1.8; }
        .calc-detail h4 { color:#409eff; margin:16px 0 10px 0; font-size:15px; border-bottom:1px solid #e9ecef; padding-bottom:8px; }
        .calc-detail .data-box { background:#f8f9fa; padding:12px 16px; border-radius:6px; margin:10px 0; }
        .calc-detail .result-row { background:#ecf5ff; padding:12px 16px; border-radius:6px; margin-top:16px; }
        .calc-detail .highlight { color:#409eff; font-weight:600; }

        /* 应付编辑弹窗两列布局 */
        .p-form-grid { display: grid; grid-template-columns: 220px 1fr; gap: 12px 20px; }
        .p-form-grid .form-item { margin-bottom: 0; }
        .p-form-grid .form-item.col-full { grid-column: 1 / -1; margin-top: 4px; }
        .p-form-grid label { width: 110px; flex-shrink: 0; }
        /* 依据考核应付样式：不可编辑、居左显示、突出 */
        .assess-amount-display {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: #ecf5ff;
            color: #409eff;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
            box-sizing: border-box;
        }
        /* 明细考核表格加宽 */
        .p-assess-wrap {
            width: 100%;
            overflow-x: auto;
        }
        .p-assess-wrap table {
            width: 100%;
            min-width: 900px;
            table-layout: fixed;
        }
        .p-assess-wrap col.c-type { width: 160px; }
        .p-assess-wrap col.c-remark { width: 200px; }
        .p-assess-wrap col.c-target { width: 110px; }
        .p-assess-wrap col.c-actual { width: 110px; }
        .p-assess-wrap col.c-reward { width: 130px; }
        .p-assess-wrap col.c-attach { width: 230px; }
        .p-assess-wrap col.c-op { width: 100px; }
        .p-assess-wrap td, .p-assess-wrap th {
            padding: 6px 8px;
            word-break: break-all;
            vertical-align: top;
        }
        /* 附件行内显示 */
        .attach-inline-box { border:1px solid #ebeef5; border-radius:4px; padding:4px; background:#fafafa; min-height: 28px;}
        .attach-inline-list { margin-bottom:4px; min-height:20px;}
        .attach-inline-item { display:inline-flex; align-items:center; gap:2px; padding:2px 6px; background:#fff; border:1px solid #e4e7ed; border-radius:4px; margin:0 2px 2px 0; font-size:11px;}
        .attach-inline-item .name { max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
        .attach-inline-item a.name { color:#409eff; text-decoration:none; cursor:pointer;}
        .attach-inline-item a.name:hover { text-decoration:underline;}
        .attach-inline-item .del { color:#f56c6c; cursor:pointer;}
        .attach-inline-upload { margin-top:2px;}
        .attach-inline-upload .btn { padding: 1px 6px; font-size: 11px;}
        /* 备注全宽 */
        .remark-full {
            width: 100% !important;
            min-height: 80px;
            resize: vertical;
        }
        /* 输入框尺寸收窄 */
        .narrow-input input, .narrow-input select {
            width: 100%;
        }
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div style="width:40px; height:40px; border:4px solid #f3f3f3; border-top:4px solid #409eff; border-radius:50%; animation: spin 1s linear infinite; margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在导出，请稍候...</div>
    </div>
</div>
<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <input type="hidden" id="selProject">
    <input id="txtProject" readonly placeholder="请选择项目" style="width:300px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <select id="selAgreement" style="width:240px;"><option value="">全部下游协议</option></select>
    <select id="selStage">
        <option value="">全部阶段</option>
        <option value="全年">全年合计</option>
        <option value="阶段一">阶段一</option>
        <option value="阶段二">阶段二</option>
        <option value="阶段三">阶段三</option>
        <option value="阶段四">阶段四</option>
    </select>
    <select id="selStatus">
        <option value="">全部状态</option>
        <option value="DRAFT">草稿</option>
        <option value="AUDIT">运营已审</option>
        <option value="FINAL">财务已确认</option>
        <option value="REJECTED">已驳回</option>
    </select>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">+ 新增应付</button>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn" id="btnExport">导出Excel</button>
    <span style="flex:1;"></span>
    <span style="color:#909399; font-size:12px;">应付需经过：营销填报 → 运营审核 → 财务确认</span>
</div>

<div class="table-wrap">
    <table>
        <thead><tr>
            <th>阶段</th><th>下游协议</th><th>下游分销商</th>
            <th>依据规模应付</th><th>依据考核应付</th><th>合计应付</th>
            <th>税率</th><th>无税金额</th><th>系统估算</th><th>状态</th>
            <th>填报人</th><th>审核人</th><th>确认人</th>
            <th>备注</th><th width="200">操作</th>
        </tr></thead>
        <tbody id="body"></tbody>
    </table>
</div>

<!-- 新增/编辑 加宽到 1050px -->
<div class="modal-mask" id="modalP">
    <div class="modal" style="width:1050px;">
        <div class="modal-header" id="modalPTitle">新增应付<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalP')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="p_id">
            <input type="hidden" id="p_projectId">
            <div class="p-form-grid">
                <!-- 左列：阶段（窄） -->
                <div class="form-item narrow-input"><label>阶段 *</label>
                    <select id="p_stage">
                        <option value="全年合计">全年合计</option>
                        <option value="阶段一">阶段一</option>
                        <option value="阶段二">阶段二</option>
                        <option value="阶段三">阶段三</option>
                        <option value="阶段四">阶段四</option>
                    </select>
                </div>
                <!-- 右列：项目（编辑模式下禁用选择） -->
                <div class="form-item"><label>项目 *</label>
                    <div style="display:flex; gap:8px;">
                        <input id="p_txtProject" readonly placeholder="请选择项目" style="flex:1; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
                        <button class="btn" id="p_btnSelProj" type="button">选择项目</button>
                    </div>
                </div>
                <!-- 左列：依据规模应付（窄） -->
                <div class="form-item narrow-input"><label>依据规模应付(元)</label><input id="p_scaleAmount" type="number" step="0.01"></div>
                <!-- 右列：下游协议（相对宽一些） -->
                <div class="form-item"><label>下游协议 *</label><select id="p_agreementId"></select></div>
                <!-- 左列：系统估算（窄） -->
                <div class="form-item narrow-input"><label>系统估算(元) <span style="cursor:pointer;color:#409eff;display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border:1px solid #409eff;border-radius:50%;font-size:12px;" id="btnCalcEstimate" title="点击计算">?</span></label><input id="p_estimateAmount" type="number" step="0.01" readonly></div>
                <!-- 右列：依据考核应付（合计，只读，居左显示） -->
                <div class="form-item"><label>依据考核应付(元)</label>
                    <div id="p_assessAmountDisplay" class="assess-amount-display">0.00</div>
                    <input type="hidden" id="p_assessAmount">
                </div>
                <!-- 左列：税率（窄） -->
                <div class="form-item narrow-input"><label>税率(%)</label><input id="p_taxRate" type="number" step="0.01" placeholder="如13"></div>
                <!-- 右列：无税金额（合计，只读，居左显示） -->
                <div class="form-item"><label>无税金额(元)</label>
                    <div id="p_taxExcludedAmount" class="assess-amount-display" style="background:#f0f9eb;color:#67c23a;">0.00</div>
                </div>

                <!-- 依据考核明细应付（全宽，加宽表格） -->
                <div class="form-item col-full">
                    <label style="display:block; margin-bottom:6px;">依据考核应付明细</label>
                    <div class="p-assess-wrap">
                        <table class="table-nowrap" id="p_assessTable" style="font-size:13px;">
                            <colgroup>
                                <col class="c-type">
                                <col class="c-remark">
                                <col class="c-target">
                                <col class="c-actual">
                                <col class="c-reward">
                                <col class="c-attach">
                                <col class="c-op">
                            </colgroup>
                            <thead><tr>
                                <th>考核项目</th><th>备注说明</th><th>目标</th><th>达成</th><th>奖惩金额</th><th>附件</th><th>操作</th>
                            </tr></thead>
                            <tbody id="p_assessBody"></tbody>
                        </table>
                        <button class="btn btn-sm" id="p_addAssessRow" type="button" style="margin-top:6px;">+ 添加行</button>
                    </div>
                </div>

                <!-- 备注全宽，放最下边 -->
                <div class="form-item col-full">
                    <label style="display:block; margin-bottom:6px;">备注</label>
                    <textarea id="p_remark" rows="4" class="remark-full"></textarea>
                </div>
            </div>
            <p style="color:#888; font-size:12px; margin-top:12px;">应付确认后，关联阶段的下游流向将自动置为终版不可修改。考核明细附件需先保存应付记录后再上传。</p>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalP')">取消</button>
            <button class="btn btn-primary" id="btnSaveP">保存</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="modalPEstimateDetail">
    <div class="modal" style="width:850px; max-height:85vh; overflow:hidden;">
        <div class="modal-header">估算应付计算明细<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalPEstimateDetail')">×</span></div>
        <div class="modal-body" style="max-height:65vh; overflow-y:auto;">
            <div id="pEstimateDetailContent" class="calc-detail"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="RB.closeModal('modalPEstimateDetail')">确认</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/rebate-calc.js"></script>
<script src="js/project-selector.js"></script>
<script>
    var editingId = null;
    var pRowAttachs = {};
    var pRowTempSeq = 0;

    $(function () {
        RB.checkLogin(function () { 
            loadYears();
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#selProject',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { loadAgreements(); load(); }
            });
            RB.bindProjectSelector({
                trigger: '#p_btnSelProj, #p_txtProject',
                display: '#p_txtProject',
                hidden: '#p_projectId',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { loadAgreements(); $('#p_estimateAmount').val(''); }
            });
        });

        $('#btnSearch').on('click', load);
        $('#btnRefresh').on('click', load);
        $('#btnExport').on('click', exportPayable);
        $('#btnAdd').on('click', function () { RB.withPerm('payable:edit', openAdd, '权限不足，无法编辑应付'); });
        $('#btnSaveP').on('click', function() { RB.withPerm('payable:edit', saveP, '权限不足，无法编辑应付'); });
        $('#p_agreementId').on('change', function () { $('#p_estimateAmount').val(''); });
        $('#p_stage').on('change', function () { $('#p_estimateAmount').val(''); });
        $('#p_scaleAmount, #p_taxRate').on('input change', refreshPTaxExcludedAmount);
        $('#btnCalcEstimate').on('click', function() {
            var pid = $('#p_projectId').val(), aid = $('#p_agreementId').val(), stage = $('#p_stage').val();
            if (!pid || !aid || !stage) {
                RB.toast('请先选择项目、下游协议和阶段', 'error');
                return;
            }
            tryLoadPayableEstimate(true);
        });
        $('#p_addAssessRow').on('click', function() { addPAssessRow(null); });
    });

    function escAttr(v) { return (v == null ? '' : String(v)).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    function refreshPAssessTotal() {
        var items = collectPAssessItems(true);
        var total = 0;
        for (var i = 0; i < items.length; i++) {
            total += Number(items[i].rewardAmount || 0);
        }
        $('#p_assessAmountDisplay').text(Number(total || 0).toFixed(2));
        $('#p_assessAmount').val(total);
        refreshPTaxExcludedAmount();
    }

    function refreshPTaxExcludedAmount() {
        var scale = Number($('#p_scaleAmount').val() || 0);
        var assess = Number($('#p_assessAmount').val() || 0);
        var total = scale + assess;
        var rate = Number($('#p_taxRate').val() || 0);
        var ex = rate > 0 ? total / (1 + rate / 100) : total;
        $('#p_taxExcludedAmount').text(Number(ex || 0).toFixed(2));
    }

    function addPAssessRow(data) {
        var itemTypes = [
            {value: 'STAFF_COUNT', label: '作业人数'},
            {value: 'VISIT_COUNT', label: '拜访次数'},
            {value: 'MEETING', label: '会议活动'},
            {value: 'OTHER', label: '其它'}
        ];
        var typeOpts = '';
        for (var i = 0; i < itemTypes.length; i++) {
            var sel = data && data.itemType === itemTypes[i].value ? ' selected' : '';
            typeOpts += '<option value="' + itemTypes[i].value + '"' + sel + '>' + itemTypes[i].label + '</option>';
        }
        var esc = escAttr;
        var tempId = '_tmp_' + (++pRowTempSeq);
        var rowKey = data && data.id ? String(data.id) : tempId;
        if (!pRowAttachs[rowKey]) pRowAttachs[rowKey] = data && data.attachFiles ? data.attachFiles.slice() : [];

        var tr = '<tr data-rowkey="' + esc(rowKey) + '" data-tmpid="' + esc(tempId) + '" data-itemid="' + esc(data && data.id ? data.id : '') + '">' +
            '<td><select class="p-assess-type" style="width:100%;padding:4px 6px;">' + typeOpts + '</select></td>' +
            '<td><input type="text" class="p-assess-remark" value="' + esc(data && data.remark) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="p-assess-target" value="' + esc(data && data.targetValue) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="p-assess-actual" value="' + esc(data && data.actualValue) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td><input type="number" step="0.01" class="p-assess-reward" value="' + esc(data && data.rewardAmount) + '" style="width:100%;padding:4px 6px;"></td>' +
            '<td>' + renderPRowAttachBox(rowKey) + '</td>' +
            '<td><button type="button" class="btn btn-xs btn-danger p-assess-del">删除</button></td>' +
            '</tr>';
        var $tr = $(tr);
        $tr.find('.p-assess-del').on('click', function() {
            var rk = $(this).closest('tr').data('rowkey');
            if (rk) delete pRowAttachs[rk];
            $(this).closest('tr').remove();
            refreshPAssessTotal();
        });
        $tr.find('.p-assess-reward, .p-assess-target, .p-assess-actual').on('change input', refreshPAssessTotal);
        bindPRowAttachUpload($tr, rowKey);
        $('#p_assessBody').append($tr);
        refreshPAssessTotal();
    }

    function renderPRowAttachBox(rowKey) {
        var list = pRowAttachs[rowKey] || [];
        var token = RB.getToken ? RB.getToken() : '';
        var innerList = '';
        for (var i = 0; i < list.length; i++) {
            var a = list[i];
            var nameHtml;
            if (a.downloadUrl) {
                var url = a.downloadUrl + (a.downloadUrl.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
                nameHtml = '<a class="name" href="' + url + '" target="_blank" title="点击下载：' + escAttr(a.fileName) + '">' + a.fileName + '</a>';
            } else {
                nameHtml = '<span class="name" title="' + escAttr(a.fileName) + '">' + a.fileName + '</span>';
            }
            innerList += '<span class="attach-inline-item" data-aid="' + escAttr(a.id) + '">' + nameHtml +
                '<span class="del" onclick="deletePRowAttach(\'' + escAttr(rowKey) + '\', ' + a.id + ')">×</span></span>';
        }
        return '<div class="attach-inline-box">' +
            '<div class="attach-inline-list">' + innerList + '</div>' +
            '<div class="attach-inline-upload">' +
            '<label class="btn btn-xs" style="cursor:pointer;">' +
            '+ 附件<input type="file" class="p-row-attach-input" multiple style="display:none;" data-rowkey="' + escAttr(rowKey) + '">' +
            '</label></div></div>';
    }

    function bindPRowAttachUpload($tr, rowKey) {
        $tr.find('.p-row-attach-input').on('change', function(e) {
            var files = e.target.files;
            if (!files || files.length === 0) return;
            var pId = $('#p_id').val();
            if (!pId || pId === '0' || !editingId) {
                RB.toast('请先保存应付记录后再上传附件', 'error');
                e.target.value = '';
                return;
            }
            var itemId = $tr.data('itemid') || 0;
            for (var i = 0; i < files.length; i++) {
                uploadPRowAttach(pId, itemId, rowKey, files[i]);
            }
            e.target.value = '';
        });
    }

    function uploadPRowAttach(payId, itemId, rowKey, file) {
        var fd = new FormData();
        fd.append('file', file);
        fd.append('payableId', payId);
        fd.append('assessItemId', itemId || 0);
        fd.append('rowKey', rowKey);
        RB.post('/api/receivable-payable?op=uploadPayAssessAttach', fd, true).done(function(r) {
            if (r.code === 0) {
                if (r.data && r.data.assessItemId) {
                    var $tr = $('#p_assessBody tr[data-rowkey="' + rowKey + '"]');
                    if ($tr.length && !$tr.data('itemid')) $tr.data('itemid', r.data.assessItemId);
                }
                if (!pRowAttachs[rowKey]) pRowAttachs[rowKey] = [];
                pRowAttachs[rowKey].push(r.data.file);
                var $tr = $('#p_assessBody tr[data-rowkey="' + rowKey + '"]');
                if ($tr.length) {
                    $tr.find('td:eq(5)').html(renderPRowAttachBox(rowKey));
                    bindPRowAttachUpload($tr, rowKey);
                }
                RB.toast('上传成功', 'success');
            } else {
                RB.toast(r.msg || '上传失败', 'error');
            }
        }).fail(function() { RB.toast('上传失败', 'error'); });
    }

    function deletePRowAttach(rowKey, attachId) {
        RB.confirm('确认删除该附件？', function() {
            RB.post('/api/receivable-payable?op=deleteAssessAttach', { id: attachId }).done(function(r) {
                if (r.code === 0) {
                    var list = pRowAttachs[rowKey] || [];
                    for (var i = 0; i < list.length; i++) {
                        if (String(list[i].id) === String(attachId)) {
                            list.splice(i, 1);
                            break;
                        }
                    }
                    var $tr = $('#p_assessBody tr[data-rowkey="' + rowKey + '"]');
                    if ($tr.length) {
                        $tr.find('td:eq(5)').html(renderPRowAttachBox(rowKey));
                        bindPRowAttachUpload($tr, rowKey);
                    }
                    RB.toast('已删除', 'success');
                } else {
                    RB.toast(r.msg || '删除失败', 'error');
                }
            });
        });
    }

    function collectPAssessItems(silent) {
        var items = [];
        $('#p_assessBody tr').each(function() {
            var $tr = $(this);
            items.push({
                id: $tr.data('itemid') || null,
                itemType: $tr.find('.p-assess-type').val(),
                remark: $tr.find('.p-assess-remark').val(),
                targetValue: $tr.find('.p-assess-target').val(),
                actualValue: $tr.find('.p-assess-actual').val(),
                rewardAmount: $tr.find('.p-assess-reward').val(),
                rowKey: $tr.data('rowkey')
            });
        });
        return items;
    }

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    function loadAgreements() {
        var pid = $('#selProject').val();
        if ($('#modalP').hasClass('show') && $('#p_projectId').val()) {
            pid = $('#p_projectId').val();
        }
        if (!pid) { $('#selAgreement').html('<option value="">全部下游协议</option>'); $('#p_agreementId').html(''); return; }
        RB.post('/api/downstream-agreement', { op: 'list', current: 'true', projectId: pid }).done(function (r) {
            var html = '<option value="">全部下游协议</option>';
            if (r.code === 0 && r.data) for (var i = 0; i < r.data.length; i++) {
                var a = r.data[i];
                html += '<option value="' + a.id + '">' + (a.agreementName || '') + ' - ' + (a.distributorName || '') + '</option>';
            }
            $('#selAgreement').html(html);
            var ph = '<option value="">请选择下游协议</option>';
            if (r.code === 0 && r.data) for (var i = 0; i < r.data.length; i++) {
                ph += '<option value="' + r.data[i].id + '">' + (r.data[i].agreementName || '') + ' - ' + (r.data[i].distributorName || '') + '</option>';
            }
            $('#p_agreementId').html(ph);
        });
    }

    function load() {
        var pid = $('#selProject').val();
        if (!pid) { $('#body').html('<tr><td colspan="15" style="text-align:center;color:#999;padding:30px;">请选择项目查看应付</td></tr>'); return; }
        RB.post('/api/receivable-payable?op=listPayable', {
            projectId: pid,
            agreementId: $('#selAgreement').val(),
            stage: $('#selStage').val(),
            status: $('#selStatus').val()
        }).done(function (r) {
            if (r.code !== 0) { RB.toast(r.msg, 'error'); return; }
            render(r.data || []);
        });
    }

    var payableStatusLabel = { DRAFT:'草稿', AUDIT:'运营已审', FINAL:'财务已确认', REJECTED:'已驳回' };

    function render(rows) {
        var html = '';
        var total = 0, totalTaxEx = 0;
        for (var i = 0; i < rows.length; i++) {
            var x = rows[i];
            total += Number(x.totalAmount || 0);
            var rate = Number(x.taxRate || 0);
            var taxEx = rate > 0 ? Number(x.totalAmount || 0) / (1 + rate / 100) : Number(x.totalAmount || 0);
            totalTaxEx += taxEx;
            var st = x.status || 'DRAFT';
            var stLabel = payableStatusLabel[st] || st;
            html += '<tr>' +
                '<td><strong>' + (x.stage || '') + '</strong></td>' +
                '<td>' + (x.agreementName || '-') + '</td>' +
                '<td>' + (x.distributor || '-') + '</td>' +
                '<td>' + RB.formatMoney(x.scaleAmount) + '</td>' +
                '<td>' + RB.formatMoney(x.assessAmount) + '</td>' +
                '<td><strong>' + RB.formatMoney(x.totalAmount) + '</strong></td>' +
                '<td>' + (rate > 0 ? rate.toFixed(2) + '%' : '-') + '</td>' +
                '<td style="color:#67c23a;">' + RB.formatMoney(taxEx) + '</td>' +
                '<td style="color:#909399;">' + RB.formatMoney(x.estimateAmount) + '</td>' +
                '<td><span class="status-tag st-' + st + '">' + stLabel + '</span></td>' +
                '<td>' + (x.fillUserName || '-') + '</td>' +
                '<td>' + (x.auditUserName || '-') + '</td>' +
                '<td>' + (x.confirmUserName || '-') + '</td>' +
                '<td>' + (x.remark || '') + '</td>' +
                '<td>' + actionBtns(x) + '</td>' +
                '</tr>';
        }
        html += '<tr style="background:#fafafa; font-weight:600;">' +
            '<td colspan="5" style="text-align:right;">合计：</td>' +
            '<td>' + RB.formatMoney(total) + '</td>' +
            '<td></td>' +
            '<td style="color:#67c23a;">' + RB.formatMoney(totalTaxEx) + '</td>' +
            '<td colspan="8"></td></tr>';
        if (rows.length === 0) html = '<tr><td colspan="15" style="text-align:center;color:#999;padding:30px;">暂无应付记录</td></tr>';
        $('#body').html(html);
    }

    function actionBtns(x) {
        var html = '';
        if (x.status === 'DRAFT' || x.status === 'REJECTED') {
            html += '<a class="op" data-act="edit" data-id="' + x.id + '">编辑</a> ';
        }
        if (x.status === 'DRAFT') {
            html += '<a class="op" data-act="audit" data-id="' + x.id + '">运营审核</a> ';
        }
        if (x.status === 'AUDIT') {
            html += '<a class="op" data-act="confirm" data-id="' + x.id + '">财务确认</a> ';
        }
        return html || '-';
    }

    $(document).on('click', '.op', function () {
        var id = $(this).data('id'), act = $(this).data('act');
        if (act === 'edit') {
            RB.withPerm('payable:edit', function() { editP(id); }, '权限不足，无法编辑应付');
        }
        else if (act === 'audit') {
            RB.withPerm('payable:audit', function() { auditP(id); }, '权限不足，无法审核应付');
        }
        else if (act === 'confirm') {
            RB.withPerm('payable:audit', function() { confirmP(id); }, '权限不足，无法确认应付');
        }
    });

    function setProjectEditableP(editable) {
        if (editable) {
            $('#p_btnSelProj').show();
            $('#p_txtProject').css('cursor', 'pointer').css('background', '#fff');
        } else {
            $('#p_btnSelProj').hide();
            $('#p_txtProject').css('cursor', 'not-allowed').css('background', '#f5f7fa');
        }
    }

    function openAdd() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        $('#modalPEstimateDetail').removeClass('show');
        editingId = null;
        pRowAttachs = {};
        $('#modalPTitle').text('新增应付');
        $('#p_id').val('');
        $('#p_projectId').val(pid);
        $('#p_txtProject').val($('#txtProject').val() || '');
        setProjectEditableP(true);
        $('#p_stage').val('阶段一');
        loadAgreements();
        $('#p_scaleAmount,#p_estimateAmount').val('');
        $('#p_taxRate').val('');
        $('#p_assessBody').empty();
        $('#p_remark').val('');
        refreshPAssessTotal();
        RB.openModal('modalP');
        tryLoadPayableEstimate();
    }

    function editP(id) {
        editingId = id;
        pRowAttachs = {};
        RB.post('/api/receivable-payable?op=listPayable', { projectId: $('#selProject').val() }).done(function (r) {
            if (r.code !== 0) return;
            var x = null; for (var i = 0; i < r.data.length; i++) if (r.data[i].id == id) { x = r.data[i]; break; }
            if (!x) { RB.toast('记录不存在', 'error'); return; }
            $('#modalPTitle').text('编辑应付');
            $('#p_id').val(x.id);
            $('#p_projectId').val(x.projectId);
            // 编辑模式：项目不可选择
            setProjectEditableP(false);
            var projectName = $('#txtProject').val() || '';
            if (!($('#selProject').val() && String($('#selProject').val()) === String(x.projectId))) {
                (function(targetId) {
                    RB.post('/api/project?op=get', { id: targetId }).done(function(pr) {
                        if (pr.code === 0 && pr.data) $('#p_txtProject').val(pr.data.projectName || '');
                    });
                })(x.projectId);
            }
            $('#p_txtProject').val(projectName);
            loadAgreements();
            setTimeout(function () { $('#p_agreementId').val(x.agreementId); }, 200);
            $('#p_stage').val(x.stage || '阶段一');
            $('#p_scaleAmount').val(x.scaleAmount);
            $('#p_taxRate').val(x.taxRate || '');
            $('#p_assessBody').empty();
            RB.post('/api/receivable-payable?op=listPayableAssessItems', { payableId: id }).done(function(r2) {
                if (r2.code === 0 && r2.data && r2.data.length) {
                    r2.data.forEach(function(item) { addPAssessRow(item); });
                }
                $('#p_assessAmountDisplay').text(Number(x.assessAmount || 0).toFixed(2));
                $('#p_assessAmount').val(x.assessAmount || 0);
                refreshPTaxExcludedAmount();
            });
            $('#p_estimateAmount').val(x.estimateAmount);
            $('#p_remark').val(x.remark);
            RB.openModal('modalP');
        });
    }

    function saveP() {
        var assessItems = collectPAssessItems();
        var assessTotal = 0;
        for (var i = 0; i < assessItems.length; i++) {
            assessTotal += Number(assessItems[i].rewardAmount || 0);
        }
        var rowAttachMap = {};
        for (var k in pRowAttachs) {
            if (pRowAttachs.hasOwnProperty(k) && pRowAttachs[k] && pRowAttachs[k].length) {
                rowAttachMap[k] = pRowAttachs[k].map(function(a) { return a.id; });
            }
        }
        var p = {
            id: editingId || 0,
            projectId: $('#p_projectId').val(),
            agreementId: $('#p_agreementId').val(),
            stage: $('#p_stage').val(),
            scaleAmount: $('#p_scaleAmount').val() || 0,
            assessAmount: assessTotal,
            assessItems: JSON.stringify(assessItems),
            rowAttachMap: JSON.stringify(rowAttachMap),
            estimateAmount: $('#p_estimateAmount').val() || 0,
            taxRate: $('#p_taxRate').val() || 0,
            remark: $('#p_remark').val()
        };
        if (!p.projectId || !p.agreementId || !p.stage) { RB.toast('请选择项目、协议、阶段', 'error'); return; }
        RB.post('/api/receivable-payable?op=savePayable', p).done(function (r) {
            if (r.code === 0) {
                if (r.data && r.data.itemIdRowKeyMap) {
                    var map = r.data.itemIdRowKeyMap;
                    $('#p_assessBody tr').each(function() {
                        var $tr = $(this);
                        var rk = $tr.data('rowkey');
                        if (rk && map[rk] && !$tr.data('itemid')) {
                            $tr.data('itemid', map[rk]);
                            $tr.attr('data-itemid', map[rk]);
                        }
                    });
                    if (!editingId && r.data.id) {
                        editingId = r.data.id;
                        $('#p_id').val(r.data.id);
                    }
                }
                RB.toast('保存成功', 'success'); RB.closeModal('modalP'); load();
            }
            else RB.toast(r.msg, 'error');
        });
    }

    function auditP(id) {
        RB.confirm('确认运营审核通过？', function () {
            RB.post('/api/receivable-payable?op=auditPayable', { id: id, action: 'PASS' }).done(function (r) {
                if (r.code === 0) { RB.toast('审核通过', 'success'); load(); }
                else RB.toast(r.msg, 'error');
            });
        });
    }

    function confirmP(id) {
        RB.confirm('确认财务最终确认该应付？', function () {
            RB.post('/api/receivable-payable?op=confirmPayable', { id: id }).done(function (r) {
                if (r.code === 0) { RB.toast('已财务确认', 'success'); load(); }
                else RB.toast(r.msg, 'error');
            });
        });
    }

    function tryLoadPayableEstimate(showDetail) {
        var projectId = $('#p_projectId').val();
        var agreementId = $('#p_agreementId').val();
        var stage = $('#p_stage').val();
        if (!projectId || !agreementId || !stage) { $('#p_estimateAmount').val(''); return; }
        var isFull = (stage === '全年' || stage === '全年合计');
        RB.post('/api/overview?op=calcDownstreamRebate', { agreementId: agreementId }).done(function(r) {
            if (r.code !== 0 || !r.data) {
                $('#p_estimateAmount').val('');
                return;
            }
            var reb = r.data;
            var rebateAmt = 0;
            if (isFull) {
                rebateAmt = Number(reb.totalRebate || 0);
            } else if (stage === '阶段一' && reb.stageRebates && reb.stageRebates[0]) {
                rebateAmt = Number(reb.stageRebates[0].rebateAmount || 0);
            } else if (stage === '阶段二' && reb.stageRebates && reb.stageRebates[1]) {
                rebateAmt = Number(reb.stageRebates[1].rebateAmount || 0);
            } else if (stage === '阶段三' && reb.stageRebates && reb.stageRebates[2]) {
                rebateAmt = Number(reb.stageRebates[2].rebateAmount || 0);
            } else if (stage === '阶段四' && reb.stageRebates && reb.stageRebates[3]) {
                rebateAmt = Number(reb.stageRebates[3].rebateAmount || 0);
            }
            // 查询已保存的依据规模应付金额之和，并减去
            RB.post('/api/receivable-payable?op=sumScaleAmount', {
                type: 'payable',
                projectId: projectId,
                agreementId: agreementId,
                stage: stage,
                excludeId: editingId || 0
            }).done(function(r2) {
                var savedScale = (r2.code === 0 && r2.data && r2.data.sum) ? Number(r2.data.sum) : 0;
                var est = rebateAmt - savedScale;
                $('#p_estimateAmount').val(Number(est || 0).toFixed(2));
                if (showDetail) renderPayableEstimateDetail(reb, stage, est, rebateAmt, savedScale, isFull);
            }).fail(function() {
                var est = rebateAmt;
                $('#p_estimateAmount').val(Number(est || 0).toFixed(2));
                if (showDetail) renderPayableEstimateDetail(reb, stage, est, rebateAmt, 0, isFull);
            });
        }).fail(function() {
            $('#p_estimateAmount').val('');
        });
    }

    function renderPayableEstimateDetail(reb, stage, est, rebateAmt, savedScale, isFull) {
        var detailHtml = [];
        var mapStageIdx = { '阶段一': 0, '阶段二': 1, '阶段三': 2, '阶段四': 3 };

        function renderDetailsTable(sr) {
            if (!sr.details || sr.details.length === 0) return '';
            var h = '<table class="table-compact" style="width:100%; margin-top:10px; font-size:12px;">';
            h += '<thead><tr><th>考核组</th><th>奖励类型</th><th>达成率X</th><th>目标</th><th>实际值</th><th>计算基数</th><th>返利比例</th><th>计算模式</th><th>返利金额</th></tr></thead><tbody>';
            var subTotal = 0;
            for (var j = 0; j < sr.details.length; j++) {
                var d = sr.details[j];
                subTotal += Number(d.rebateAmount || 0);
                var rt = d.rewardType || 'PERSENT';
                var rtName = rt === 'PERSENT' ? '达成率' : (rt === 'SCALE' ? '达成额' : '增长率');
                var ratioPct = (Number(d.effectiveRatio || 0) * 100).toFixed(2) + '%';
                h += '<tr>'
                    + '<td>' + escAttr(d.groupName) + '</td>'
                    + '<td>' + rtName + '</td>'
                    + '<td>' + (rt === 'SCALE' ? RB.formatMoney(d.x) : Number(d.x || 0).toFixed(2) + '%') + '</td>'
                    + '<td>' + RB.formatMoney(d.target) + '</td>'
                    + '<td>' + RB.formatMoney(d.calcActual) + '</td>'
                    + '<td>' + RB.formatMoney(d.base) + '</td>'
                    + '<td>' + ratioPct + '</td>'
                    + '<td>' + (d.calcMode === 'FLAT' ? '全部计算' : '递进式') + '</td>'
                    + '<td><strong>' + RB.formatMoney(d.rebateAmount) + '</strong></td>'
                    + '</tr>';
            }
            h += '<tr style="background:#f5f7fa;font-weight:bold;"><td colspan="8" style="text-align:right;">分项合计：</td><td>' + RB.formatMoney(subTotal) + '</td></tr>';
            h += '</tbody></table>';
            return h;
        }

        detailHtml.push('<h4>📊 估算结果（后端返利计算引擎 - 下游协议）</h4>');
        detailHtml.push('<div class="data-box">');
        detailHtml.push('<strong>阶段：</strong>' + stage + '<br>');
        if (isFull) {
            detailHtml.push('<strong>全年合计 = 四阶段累计 + 全年规则：</strong>' + RB.formatMoney(reb.totalRebate || 0) + ' 元<br>');
            if (reb.stageRebates) {
                for (var i = 0; i < reb.stageRebates.length; i++) {
                    var sr = reb.stageRebates[i];
                    detailHtml.push('<div class="group-section">');
                    detailHtml.push('<strong>· ' + sr.stageName + '</strong>：目标 ' + RB.formatMoney(sr.target || 0)
                        + ' / 实际 ' + RB.formatMoney(sr.actual || 0)
                        + ' → 返利 <strong>' + RB.formatMoney(sr.rebateAmount || 0) + '</strong> 元');
                    detailHtml.push(renderDetailsTable(sr));
                    detailHtml.push('</div>');
                }
            }
            detailHtml.push('<div class="group-section"><strong>· 全年专属规则（FULL_YEAR）返利：</strong>' + RB.formatMoney(reb.fullYearRebate || 0) + ' 元</div>');
        } else if (reb.stageRebates) {
            var idx = mapStageIdx[stage];
            if (idx != null && reb.stageRebates[idx]) {
                var sr = reb.stageRebates[idx];
                detailHtml.push('<strong>阶段目标：</strong>' + RB.formatMoney(sr.target || 0) + ' 元<br>');
                detailHtml.push('<strong>阶段实际：</strong>' + RB.formatMoney(sr.actual || 0) + ' 元<br>');
                var rate = (sr.target && sr.target > 0) ? (sr.actual / sr.target * 100).toFixed(2) : '0.00';
                detailHtml.push('<strong>达成率：</strong>' + rate + '%<br>');
                detailHtml.push('<strong>返利合计：</strong>' + RB.formatMoney(sr.rebateAmount || 0) + ' 元');
                detailHtml.push(renderDetailsTable(sr));
            }
        }
        detailHtml.push('</div>');
        detailHtml.push('<div class="result-row" style="border-top:2px dashed #409eff; padding-top:12px; margin-top:12px;">');
        detailHtml.push('<div style="margin-bottom:6px;"><strong>返利计算金额：</strong>' + RB.formatMoney(rebateAmt || 0) + ' 元</div>');
        detailHtml.push('<div style="margin-bottom:6px;"><strong>已保存的依据规模应付之和：</strong>' + RB.formatMoney(savedScale || 0) + ' 元' + (isFull ? '（全年所有阶段）' : '') + '</div>');
        detailHtml.push('<div style="font-size:13px; color:#909399; margin-bottom:6px;">估算应付 = 返利计算金额 - 已保存的依据规模应付之和</div>');
        detailHtml.push('<strong style="font-size:16px;">💰 最终估算应付：</strong><span class="highlight" style="font-size:20px;">' + RB.formatMoney(est || 0) + '</span> 元');
        detailHtml.push('</div>');
        $('#pEstimateDetailContent').html(detailHtml.join(''));
        RB.openModal('modalPEstimateDetail');
    }

    function exportPayable() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        $('#loadingOverlay').show();
        var url = './api/receivable-payable?op=exportPayable&projectId=' + pid;
        
        downloadWithXhr(url, '项目应付.xlsx');
    }

    function downloadWithXhr(url, defaultFileName) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Token', RB.getToken());
        xhr.responseType = 'blob';
        
        xhr.onload = function() {
            $('#loadingOverlay').hide();
            if (xhr.status === 200) {
                var blob = xhr.response;
                var contentDisposition = xhr.getResponseHeader('Content-Disposition');
                var fileName = defaultFileName;
                if (contentDisposition && contentDisposition.indexOf('attachment') !== -1) {
                    var match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        fileName = decodeURIComponent(match[1].replace(/['"]/g, ''));
                    }
                }
                
                var downloadUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            } else {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var response = JSON.parse(e.target.result);
                        RB.toast(response.msg || '导出失败', 'error');
                    } catch (err) {
                        RB.toast('导出失败', 'error');
                    }
                };
                reader.readAsText(xhr.response);
            }
        };
        
        xhr.onerror = function() {
            $('#loadingOverlay').hide();
            RB.toast('网络错误', 'error');
        };
        
        xhr.send();
    }
</script>
