<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>项目实收</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .status-tag { padding:2px 8px; border-radius:10px; font-size:12px; color:#fff;}
        .st-DRAFT { background:#909399;}
        .st-PURCHASE { background:#409eff;}
        .st-OP { background:#e6a23c;}
        .st-FINANCE { background:#67c23a;}
        .st-FINAL { background:#67c23a;}
        .step-bar { display:flex; align-items:center; font-size:12px; color:#606266; margin-bottom:4px;}
        .step-bar .step { padding:2px 8px; border-radius:3px; background:#f0f0f0; margin-right:6px;}
        .step-bar .step.active { background:#67c23a; color:#fff;}
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div style="width:40px; height:40px; border:4px solid #f3f3f3; border-top:4px solid #409eff; border-radius:50%; animation: spin 1s linear infinite; margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在导出，请稍候...</div>
    </div>
</div>
<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <input type="hidden" id="selProject">
    <input id="txtProject" readonly placeholder="请选择项目" style="width:300px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <select id="selStage">
        <option value="">全部阶段</option>
        <option value="全年">全年</option>
        <option value="阶段一">阶段一</option>
        <option value="阶段二">阶段二</option>
        <option value="阶段三">阶段三</option>
        <option value="阶段四">阶段四</option>
    </select>
    <select id="selRebateType">
        <option value="">全部类型</option>
        <option value="票折">票折</option>
        <option value="服务费">服务费</option>
    </select>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">+ 新增实收</button>
    <button class="btn" id="btnBpm" style="background:#ff9800;color:#fff;border-color:#ff9800;">⇲ 从BPM引入</button>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn" id="btnExport">导出Excel</button>
    <span style="flex:1;"></span>
    <span style="color:#909399; font-size:12px;">确认流程：采购认可 → 运营确认（票折）/财务确认（服务费）</span>
</div>

<div class="table-wrap">
    <table>
        <thead><tr>
            <th>阶段</th><th>类型</th><th>申请人</th><th>申请部门</th>
            <th>申请日期</th><th>财务编码</th>
            <th>返利金额</th><th>税率</th><th>价税合计</th>
            <th>本部门应得</th><th>发票号码</th><th>收款部门</th>
            <th>状态</th><th>备注</th><th width="240">操作</th>
        </tr></thead>
        <tbody id="body"></tbody>
    </table>
</div>

<!-- 新增/编辑 -->
<div class="modal-mask" id="modalR">
    <div class="modal" style="width:680px;">
        <div class="modal-header" id="modalRTitle">新增实收<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalR')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="r_id">
            <input type="hidden" id="r_projectId">
            <div class="form-row">
                <div class="form-item col-2"><label>项目 *</label>
                    <div style="display:flex; gap:8px;">
                        <input id="r_txtProject" readonly placeholder="请选择项目" style="flex:1; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
                        <button class="btn" id="r_btnSelProj" type="button">选择</button>
                    </div>
                </div>
                <div class="form-item col-2"><label>阶段 *</label>
                    <select id="r_stage">
                        <option value="全年">全年</option>
                        <option value="阶段一">阶段一</option>
                        <option value="阶段二">阶段二</option>
                        <option value="阶段三">阶段三</option>
                        <option value="阶段四">阶段四</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>返利类型 *</label>
                    <select id="r_rebateType">
                        <option value="票折">票折</option>
                        <option value="服务费">服务费</option>
                    </select>
                </div>
                <div class="form-item col-2"><label>申请日期</label><input id="r_applyDate" type="date"></div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>申请人</label><input id="r_applicant"></div>
                <div class="form-item col-2"><label>申请部门</label><input id="r_applyDept"></div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>财务编码</label><input id="r_financeCode"></div>
                <div class="form-item col-2"><label>发票号码</label><input id="r_invoiceNo"></div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>返利金额(元)</label><input id="r_rebateAmount" type="number" step="0.01"></div>
                <div class="form-item col-2"><label>销售税率</label><input id="r_taxRate" type="number" step="0.0001"></div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>价税合计(元)</label><input id="r_totalPriceTax" type="number" step="0.01"></div>
                <div class="form-item col-2"><label>本部门应得(元)</label><input id="r_deptShare" type="number" step="0.01"></div>
            </div>
            <div class="form-row">
                <div class="form-item col-2"><label>收款部门</label><input id="r_receiveDept"></div>
                <div class="form-item col-2"><label>备注</label><textarea id="r_remark" rows="2"></textarea></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalR')">取消</button>
            <button class="btn btn-primary" id="btnSaveR">保存</button>
        </div>
    </div>
</div>

<!-- BPM引入弹窗 -->
<div class="modal-mask" id="modalBpm">
    <div class="modal" style="width:1200px; max-height:90vh;">
        <div class="modal-header">从BPM引入实收<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalBpm')">×</span></div>
        <div class="modal-body" style="max-height:72vh; overflow-y:auto;">
            <!-- 查询条件区 -->
            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; padding:10px; background:#f5f7fa; border-radius:4px;">
                <label>时间区间：</label>
                <input type="date" id="bpmStartDate" style="padding:4px 8px; border:1px solid #dcdfe6; border-radius:4px;">
                <span>至</span>
                <input type="date" id="bpmEndDate" style="padding:4px 8px; border:1px solid #dcdfe6; border-radius:4px;">
                <label style="margin-left:12px;">发票号码（可选）：</label>
                <input type="text" id="bpmInvoiceNo" placeholder="部分匹配" style="width:180px; padding:4px 8px; border:1px solid #dcdfe6; border-radius:4px;">
                <button class="btn btn-primary" id="btnBpmQuery">查询</button>
                <span id="bpmQueryTip" style="color:#909399; font-size:12px; margin-left:8px;"></span>
            </div>
            <!-- 结果列表 -->
            <style>
            #bpmTable { border-collapse: collapse; min-width: 1300px; }
            #bpmTable th, #bpmTable td { white-space: nowrap; }
            #bpmTable thead th { position: sticky; top: 0; z-index: 2; background: #f0f3f7; }
            #bpmTable tbody td.fix-left { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 2px 0 0 -1px #dcdfe6; }
            #bpmTable thead th.fix-left { position: sticky; top: 0; left: 0; z-index: 3; background: #f0f3f7; }
            #bpmTable tbody tr:hover td { background: #fafbfc; }
            #bpmTable tbody tr.bpm-checked td { background: #ecf5ff; }
            </style>
            <div class="table-wrap" style="margin:0; max-height:52vh; overflow:auto;">
                <table id="bpmTable" style="font-size:12px;">
                    <thead><tr>
                        <th class="fix-left"><input type="checkbox" id="bpmSelectAll"></th>
                        <th>申请人</th>
                        <th>申请部门</th>
                        <th>申请日期</th>
                        <th>财务编码</th>
                        <th>所属期间</th>
                        <th>应返利金额</th>
                        <th>返利金额</th>
                        <th>税率</th>
                        <th>本部门应得</th>
                        <th>返利类型</th>
                        <th>供应商名称</th>
                        <th>返利项目</th>
                        <th>发票号码</th>
                    </tr></thead>
                    <tbody id="bpmBody"></tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <span id="bpmSelectedCount" style="margin-right:auto; color:#606266; font-size:13px;">已选 0 条</span>
            <button class="btn" onclick="RB.closeModal('modalBpm')">取消</button>
            <button class="btn btn-primary" id="btnBpmImport">确定引入</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/project-selector.js"></script>
<script>
    var editingId = null;

    $(function () {
        RB.checkLogin(function () { 
            loadYears();
            // 工具栏项目选择器
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#selProject',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { load(); }
            });
            // 新增/编辑弹窗内项目选择器
            RB.bindProjectSelector({
                trigger: '#r_btnSelProj, #r_txtProject',
                display: '#r_txtProject',
                hidden: '#r_projectId',
                coYear: function() { return $('#selYear').val(); }
            });
        });
        $('#btnSearch').on('click', load);
        $('#btnRefresh').on('click', load);
        $('#btnExport').on('click', exportReceived);
        $('#btnAdd').on('click', function() { RB.withPerm('received:edit', openAdd, '权限不足，无法编辑实收'); });
        $('#btnSaveR').on('click', function() { RB.withPerm('received:edit', saveR, '权限不足，无法编辑实收'); });
        $('#btnBpm').on('click', function() { RB.withPerm('received:edit', loadBpmList, '权限不足，无法从BPM引入'); });
        $('#btnBpmQuery').on('click', queryBpm);
        $('#btnBpmImport').on('click', function() { RB.withPerm('received:edit', confirmBpmImport, '权限不足'); });
        $('#bpmSelectAll').on('change', bpmSelectAll);
    });

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    var receivedStatusLabel = { DRAFT:'草稿', PURCHASE:'采购已认', PURCHASE_OK:'采购已认', OP:'运营已审', OP_OK:'运营已审', OP_AUDIT:'运营已审', FINANCE:'财务已确认', FIN_OK:'财务已确认', FINAL:'财务已确认', REJECTED:'已驳回' };

    function load() {
        var pid = $('#selProject').val();
        if (!pid) { $('#body').html('<tr><td colspan="15" style="text-align:center;color:#999;padding:30px;">请选择项目查看实收</td></tr>'); return; }
        RB.post('/api/received-paid?op=listReceived', {
            projectId: pid,
            stage: $('#selStage').val(),
            rebateType: $('#selRebateType').val()
        }).done(function (r) {
            if (r.code !== 0) { RB.toast(r.msg, 'error'); return; }
            render(r.data || []);
        });
    }

    function render(rows) {
        var html = '';
        var total = 0, totalShare = 0;
        for (var i = 0; i < rows.length; i++) {
            var x = rows[i];
            total += Number(x.rebateAmount || 0);
            totalShare += Number(x.deptShare || 0);
            var st = x.status || 'DRAFT';
            var stLabel = receivedStatusLabel[st] || st;
            html += '<tr>' +
                '<td><strong>' + (x.stage || '') + '</strong></td>' +
                '<td>' + (x.rebateType || '-') + '</td>' +
                '<td>' + (x.applicant || '-') + '</td>' +
                '<td>' + (x.applyDept || '-') + '</td>' +
                '<td>' + (x.applyDate || '-') + '</td>' +
                '<td>' + (x.financeCode || '-') + '</td>' +
                '<td>' + RB.formatMoney(x.rebateAmount) + '</td>' +
                '<td>' + (x.taxRate || 0) + '</td>' +
                '<td>' + RB.formatMoney(x.totalPriceTax) + '</td>' +
                '<td><strong>' + RB.formatMoney(x.deptShare) + '</strong></td>' +
                '<td>' + (x.invoiceNo || '-') + '</td>' +
                '<td>' + (x.receiveDept || '-') + '</td>' +
                '<td><span class="status-tag st-' + st + '">' + stLabel + '</span></td>' +
                '<td>' + (x.remark || '') + '</td>' +
                '<td>' + actionBtns(x) + '</td>' +
                '</tr>';
        }
        html += '<tr style="background:#fafafa; font-weight:600;">' +
            '<td colspan="6" style="text-align:right;">合计：</td>' +
            '<td>' + RB.formatMoney(total) + '</td>' +
            '<td></td><td></td>' +
            '<td>' + RB.formatMoney(totalShare) + '</td>' +
            '<td colspan="5"></td></tr>';
        if (rows.length === 0) html = '<tr><td colspan="15" style="text-align:center;color:#999;padding:30px;">暂无实收记录</td></tr>';
        $('#body').html(html);
    }

    function actionBtns(x) {
        var html = '';
        if (x.status === 'DRAFT' || !x.status) {
            html += '<a class="op" data-act="edit" data-id="' + x.id + '">编辑</a> ';
            html += '<a class="op" data-act="del" data-id="' + x.id + '">删除</a> ';
            html += '<a class="op" data-act="purchase" data-id="' + x.id + '">采购认可</a> ';
        }
        if (x.status === 'PURCHASE' && x.rebateType === '票折') {
            html += '<a class="op" data-act="op" data-id="' + x.id + '">运营确认</a> ';
        }
        if (x.status === 'PURCHASE' && x.rebateType === '服务费') {
            html += '<a class="op" data-act="finance" data-id="' + x.id + '">财务确认</a> ';
        }
        return html || '-';
    }

    $(document).on('click', '.op', function () {
        var id = $(this).data('id'), act = $(this).data('act');
        if (act === 'edit') {
            RB.withPerm('received:edit', function() { editR(id); }, '权限不足，无法编辑实收');
        }
        else if (act === 'del') {
            RB.withPerm('received:edit', function() { delR(id); }, '权限不足，无法删除实收');
        }
        else if (act === 'purchase') {
            RB.withPerm('received:confirm', function() { confirmStep(id, 'PURCHASE'); }, '权限不足，无法采购认可');
        }
        else if (act === 'op') {
            RB.withPerm('received:confirm', function() { confirmStep(id, 'OP'); }, '权限不足，无法运营确认');
        }
        else if (act === 'finance') {
            RB.withPerm('received:confirm', function() { confirmStep(id, 'FINANCE'); }, '权限不足，无法财务确认');
        }
    });

    function openAdd() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        editingId = null;
        $('#modalRTitle').text('新增实收');
        $('#r_id').val('');
        $('#r_projectId').val(pid);
        $('#r_txtProject').val($('#txtProject').val() || '');
        $('#r_stage').val('阶段一');
        $('#r_rebateType').val('票折');
        $('#r_applyDate,#r_applicant,#r_applyDept,#r_financeCode,#r_invoiceNo').val('');
        $('#r_rebateAmount,#r_taxRate,#r_totalPriceTax,#r_deptShare').val('');
        $('#r_receiveDept,#r_remark').val('');
        RB.openModal('modalR');
    }

    function editR(id) {
        editingId = id;
        RB.post('/api/received-paid?op=listReceived', { projectId: $('#selProject').val() }).done(function (r) {
            if (r.code !== 0) return;
            var x = null; for (var i = 0; i < r.data.length; i++) if (r.data[i].id == id) { x = r.data[i]; break; }
            if (!x) { RB.toast('记录不存在', 'error'); return; }
            $('#modalRTitle').text('编辑实收');
            $('#r_id').val(x.id);
            $('#r_projectId').val(x.projectId);
            var projectName = $('#txtProject').val() || '';
            if (!($('#selProject').val() && String($('#selProject').val()) === String(x.projectId))) {
                (function(targetId) {
                    RB.post('/api/project?op=get', { id: targetId }).done(function(pr) {
                        if (pr.code === 0 && pr.data) $('#r_txtProject').val(pr.data.projectName || '');
                    });
                })(x.projectId);
            }
            $('#r_txtProject').val(projectName);
            $('#r_stage').val(x.stage);
            $('#r_rebateType').val(x.rebateType);
            $('#r_applyDate').val(x.applyDate);
            $('#r_applicant').val(x.applicant);
            $('#r_applyDept').val(x.applyDept);
            $('#r_financeCode').val(x.financeCode);
            $('#r_invoiceNo').val(x.invoiceNo);
            $('#r_rebateAmount').val(x.rebateAmount);
            $('#r_taxRate').val(x.taxRate);
            $('#r_totalPriceTax').val(x.totalPriceTax);
            $('#r_deptShare').val(x.deptShare);
            $('#r_receiveDept').val(x.receiveDept);
            $('#r_remark').val(x.remark);
            RB.openModal('modalR');
        });
    }

    function saveR() {
        var p = {
            id: editingId || 0,
            projectId: $('#r_projectId').val(),
            stage: $('#r_stage').val(),
            rebateType: $('#r_rebateType').val(),
            applicant: $('#r_applicant').val(),
            applyDept: $('#r_applyDept').val(),
            applyDate: $('#r_applyDate').val(),
            financeCode: $('#r_financeCode').val(),
            invoiceNo: $('#r_invoiceNo').val(),
            rebateAmount: $('#r_rebateAmount').val() || 0,
            taxRate: $('#r_taxRate').val() || 0,
            totalPriceTax: $('#r_totalPriceTax').val() || 0,
            deptShare: $('#r_deptShare').val() || 0,
            receiveDept: $('#r_receiveDept').val(),
            remark: $('#r_remark').val()
        };
        if (!p.projectId || !p.stage || !p.rebateType) { RB.toast('请选择项目、阶段、类型', 'error'); return; }
        RB.post('/api/received-paid?op=saveReceived', p).done(function (r) {
            if (r.code === 0) { RB.toast('保存成功', 'success'); RB.closeModal('modalR'); load(); }
            else RB.toast(r.msg, 'error');
        });
    }

    function delR(id) {
        RB.confirm('确认删除？', function () {
            RB.post('/api/received-paid?op=deleteReceived', { id: id }).done(function (r) {
                if (r.code === 0) { RB.toast('已删除', 'success'); load(); }
                else RB.toast(r.msg || '后端未实现 deleteReceived', 'error');
            });
        });
    }

    function confirmStep(id, step) {
        var label = { PURCHASE: '采购认可', OP: '运营确认', FINANCE: '财务确认' }[step];
        RB.confirm('确认' + label + '？', function () {
            RB.post('/api/received-paid?op=confirmReceived', { id: id, step: step }).done(function (r) {
                if (r.code === 0) { RB.toast(label + '成功', 'success'); load(); }
                else RB.toast(r.msg, 'error');
            });
        });
    }

    function exportReceived() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        $('#loadingOverlay').show();
        var url = './api/received-paid?op=exportReceived&projectId=' + pid;
        
        downloadWithXhr(url, '项目实收.xlsx');
    }

    function downloadWithXhr(url, defaultFileName) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Token', RB.getToken());
        xhr.responseType = 'blob';
        
        xhr.onload = function() {
            $('#loadingOverlay').hide();
            if (xhr.status === 200) {
                var blob = xhr.response;
                var contentDisposition = xhr.getResponseHeader('Content-Disposition');
                var fileName = defaultFileName;
                if (contentDisposition && contentDisposition.indexOf('attachment') !== -1) {
                    var match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        fileName = decodeURIComponent(match[1].replace(/['"]/g, ''));
                    }
                }
                
                var downloadUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            } else {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var response = JSON.parse(e.target.result);
                        RB.toast(response.msg || '导出失败', 'error');
                    } catch (err) {
                        RB.toast('导出失败', 'error');
                    }
                };
                reader.readAsText(xhr.response);
            }
        };
        
        xhr.onerror = function() {
            $('#loadingOverlay').hide();
            RB.toast('网络错误', 'error');
        };
        
        xhr.send();
    }

    // ==================== 从BPM引入 ====================
    var bpmRows = [];       // 查询结果
    var bpmSelectedSet = {}; // 选中行的 bpmProcessId -> true

    function initBpmDates() {
        var today = new Date();
        var oneMonthAgo = new Date(today);
        oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
        $('#bpmStartDate').val(fmtDate(oneMonthAgo));
        $('#bpmEndDate').val(fmtDate(today));
    }

    function fmtDate(d) {
        var y = d.getFullYear();
        var m = ('0' + (d.getMonth() + 1)).slice(-2);
        var dd = ('0' + d.getDate()).slice(-2);
        return y + '-' + m + '-' + dd;
    }

    function loadBpmList() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        initBpmDates();
        bpmRows = [];
        bpmSelectedSet = {};
        $('#bpmBody').html('<tr><td colspan="14" style="text-align:center;color:#999;padding:20px;">请输入时间区间后点击查询</td></tr>');
        $('#bpmSelectedCount').text('已选 0 条');
        RB.openModal('modalBpm');
    }

    function queryBpm() {
        var startDate = $('#bpmStartDate').val();
        var endDate = $('#bpmEndDate').val();
        if (!startDate || !endDate) { RB.toast('请填写时间区间', 'error'); return; }
        // 校验：起止时间差不超过3个月
        var s = new Date(startDate), e = new Date(endDate);
        var diffDays = (e - s) / (1000 * 60 * 60 * 24);
        if (diffDays > 93) { RB.toast('起止时间差不能超过3个月', 'error'); return; }
        if (diffDays < 0) { RB.toast('起始日期不能晚于截止日期', 'error'); return; }
        var invoiceNo = $('#bpmInvoiceNo').val().trim();
        $('#btnBpmQuery').prop('disabled', true).text('查询中...');
        $('#bpmQueryTip').text('');
        RB.post('/api/received-paid?op=listBpmReceived', {
            startDate: startDate,
            endDate: endDate,
            invoiceNo: invoiceNo
        }).done(function (r) {
            $('#btnBpmQuery').prop('disabled', false).text('查询');
            if (r.code !== 0) { RB.toast(r.msg || '获取BPM数据失败', 'error'); return; }
            bpmRows = r.data || [];
            bpmSelectedSet = {};
            renderBpmRows();
            $('#bpmQueryTip').text('共 ' + bpmRows.length + ' 条可引入记录');
        }).fail(function () {
            $('#btnBpmQuery').prop('disabled', false).text('查询');
            RB.toast('网络错误', 'error');
        });
    }

    function renderBpmRows() {
        var html = '';
        if (bpmRows.length === 0) {
            html = '<tr><td colspan="14" style="text-align:center;color:#999;padding:20px;">无可用数据</td></tr>';
        } else {
            for (var i = 0; i < bpmRows.length; i++) {
                var x = bpmRows[i];
                var chkId = 'bpmChk_' + i;
                html += '<tr data-idx="' + i + '">' +
                    '<td class="fix-left"><input type="checkbox" class="bpm-chk" id="' + chkId + '" data-idx="' + i + '"></td>' +
                    '<td>' + esc(x.applicant) + '</td>' +
                    '<td>' + esc(x.applyDept) + '</td>' +
                    '<td>' + esc(x.applyDate) + '</td>' +
                    '<td>' + esc(x.financeCode) + '</td>' +
                    '<td>' + esc(x.belongToYear) + '</td>' +
                    '<td>' + RB.formatMoney(x.secondaryRebateAmount) + '</td>' +
                    '<td><strong>' + RB.formatMoney(x.rebateAmount) + '</strong></td>' +
                    '<td><input type="number" step="0.0001" class="bpm-input bpm-tax-rate" value="0.13" style="width:70px; padding:2px 4px; border:1px solid #dcdfe6; border-radius:3px;" disabled></td>' +
                    '<td><input type="number" step="0.01" class="bpm-input bpm-dept-share" value="' + (x.rebateAmount || 0) + '" style="width:100px; padding:2px 4px; border:1px solid #dcdfe6; border-radius:3px;" disabled></td>' +
                    '<td><select class="bpm-input bpm-rebate-type" style="padding:2px 4px; border:1px solid #dcdfe6; border-radius:3px;" disabled>' +
                        '<option value="票折">票折</option>' +
                        '<option value="服务费">服务费</option>' +
                    '</select></td>' +
                    '<td>' + esc(x.supplier) + '</td>' +
                    '<td>' + esc(x.rebateProject) + '</td>' +
                    '<td>' + esc(x.invoiceNo) + '</td>' +
                    '</tr>';
            }
        }
        $('#bpmBody').html(html);
        // 绑定 checkbox 事件
        $('.bpm-chk').off('change').on('change', function () {
            var idx = $(this).data('idx');
            var row = bpmRows[idx];
            var pid = row.bpmProcessId;
            var inputs = $(this).closest('tr').find('.bpm-input');
            if ($(this).is(':checked')) {
                bpmSelectedSet[pid] = true;
                inputs.prop('disabled', false);
                $(this).closest('tr').addClass('bpm-checked');
            } else {
                delete bpmSelectedSet[pid];
                inputs.prop('disabled', true);
                $(this).closest('tr').removeClass('bpm-checked');
            }
            updateBpmSelectedCount();
        });
    }

    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateBpmSelectedCount() {
        var cnt = Object.keys(bpmSelectedSet).length;
        $('#bpmSelectedCount').text('已选 ' + cnt + ' 条');
    }

    function bpmSelectAll() {
        var checked = $(this).is(':checked');
        $('.bpm-chk').each(function () {
            $(this).prop('checked', checked);
            var idx = $(this).data('idx');
            var row = bpmRows[idx];
            var pid = row.bpmProcessId;
            var inputs = $(this).closest('tr').find('.bpm-input');
            if (checked) {
                bpmSelectedSet[pid] = true;
                inputs.prop('disabled', false);
                $(this).closest('tr').addClass('bpm-checked');
            } else {
                delete bpmSelectedSet[pid];
                inputs.prop('disabled', true);
                $(this).closest('tr').removeClass('bpm-checked');
            }
        });
        updateBpmSelectedCount();
    }

    function confirmBpmImport() {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        var selectedIdx = [];
        $('.bpm-chk:checked').each(function () { selectedIdx.push($(this).data('idx')); });
        if (selectedIdx.length === 0) { RB.toast('请至少选择一条记录', 'error'); return; }
        var items = [];
        for (var i = 0; i < selectedIdx.length; i++) {
            var idx = selectedIdx[i];
            var row = bpmRows[idx];
            var tr = $('#bpmBody tr[data-idx="' + idx + '"]');
            items.push({
                bpmProcessId: row.bpmProcessId,
                applicant: row.applicant,
                applyDept: row.applyDept,
                applyDate: row.applyDate,
                financeCode: row.financeCode,
                belongToYear: row.belongToYear,
                secondaryRebateAmount: row.secondaryRebateAmount,
                rebateAmount: row.rebateAmount,
                supplier: row.supplier,
                rebateProject: row.rebateProject,
                invoiceNo: row.invoiceNo,
                taxRate: tr.find('.bpm-tax-rate').val() || 0,
                deptShare: tr.find('.bpm-dept-share').val() || 0,
                rebateType: tr.find('.bpm-rebate-type').val() || '票折'
            });
        }
        $('#btnBpmImport').prop('disabled', true).text('引入中...');
        RB.post('/api/received-paid?op=importFromBpm', {
            projectId: pid,
            items: JSON.stringify(items)
        }).done(function (r) {
            $('#btnBpmImport').prop('disabled', false).text('确定引入');
            if (r.code === 0) {
                var cnt = (r.data && r.data.insertedCount) ? r.data.insertedCount : 0;
                RB.toast('成功引入 ' + cnt + ' 条实收记录（FINAL状态）', 'success');
                RB.closeModal('modalBpm');
                load();
            } else {
                RB.toast(r.msg || '引入失败', 'error');
            }
        }).fail(function () {
            $('#btnBpmImport').prop('disabled', false).text('确定引入');
            RB.toast('网络错误', 'error');
        });
    }
</script>
</body>
</html>
