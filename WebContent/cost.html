<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>费用投入</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div class="loading-spinner" style="margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在导入数据，请稍候...</div>
    </div>
</div>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <input type="hidden" id="projectId">
    <input id="txtProject" readonly placeholder="选择项目..." style="width:280px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <input id="filterWorkNo" style="width: 140px;" placeholder="报销人">
    <input id="filterDocNo" style="width: 140px;" placeholder="发票号">
    <select id="filterExpenseType" style="width: 140px;">
        <option value="">全部费用类型</option>
        <option value="ADVERT">广告宣传费</option>
        <option value="PROMO">促销活动费</option>
        <option value="TRANSPORT">运输费</option>
        <option value="MEETING">会议费</option>
        <option value="TRAVEL">差旅费</option>
        <option value="OTHER">其他费用</option>
    </select>
    <input type="date" id="filterStartDate" style="width: 140px;" placeholder="开始日期">
    <input type="date" id="filterEndDate" style="width: 140px;" placeholder="结束日期">
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">新增费用</button>
    <button class="btn" id="btnImport">导入Excel</button>
    <button class="btn" id="btnExport">导出Excel</button>
</div>
<div class="table-wrap">
    <table>
        <thead><tr>
            <th>报销人工号</th>
            <th>报销人姓名</th>
            <th>报销时间</th>
            <th>费用类型</th>
            <th>发票号</th>
            <th>发票金额</th>
            <th>本项目分摊金额</th>
            <th>备注</th>
            <th>操作</th>
        </tr></thead>
        <tbody id="body"></tbody>
        <tfoot><tr id="footRow" style="display:none; background:#fafafa; font-weight:600; color:#409eff;">
            <td style="text-align:right;" colspan="5">合计：</td>
            <td id="t1"></td>
            <td id="t2"></td>
            <td colspan="2"></td>
        </tr></tfoot>
    </table>
</div>

<div class="pagination" id="pagination" style="display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;">
    <button class="page-btn" id="btnPrev" onclick="prevPage()" style="display:inline-block;">上一页</button>
    <div id="pageNumbers" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;"></div>
    <button class="page-btn" id="btnNext" onclick="nextPage()" style="display:inline-block;">下一页</button>
    <div class="page-jump" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;">
        <input type="text" id="jumpPage" placeholder="页码" onkeydown="if(event.keyCode===13) jumpToPage()" style="display:inline-block;">
        <button class="jump-btn" onclick="jumpToPage()" style="display:inline-block;">跳转</button>
    </div>
    <span class="page-info" id="pageInfo" style="display:inline-block;"></span>
</div>

<div class="modal-mask" id="modal">
    <div class="modal" style="width: 520px;">
        <div class="modal-header" id="modalTitle">新增费用<span class="spacer"></span><span class="close" onclick="RB.closeModal('modal')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="id">
            <div class="form-item"><label>报销人</label>
                <select id="workNo" style="width: 100%;">
                    <option value="">请选择报销人</option>
                </select>
            </div>
            <div class="form-item"><label>费用类型</label><input id="expenseType" maxlength="50" style="width:100%;" placeholder="请输入费用类型"></div>
            <div class="form-item"><label>报销时间</label><input type="date" id="reimburseDate"></div>
            <div class="form-item"><label>发票号</label><input id="docNo" style="width:100%;"></div>
            <div class="form-item"><label>发票金额</label><input type="number" step="0.01" id="invoiceAmount" style="width:100%;"></div>
            <div class="form-item"><label>备注</label><textarea id="remark" rows="3" style="width:100%;"></textarea></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modal')">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="importModal">
    <div class="modal" style="width: 480px;">
        <div class="modal-header">导入Excel<span class="spacer"></span><span class="close" onclick="RB.closeModal('importModal')">×</span></div>
        <div class="modal-body">
            <p style="font-size:12px; color:#909399; margin-bottom:12px;">
                Excel列：报销人工号、报销人姓名、报销时间、费用类型、发票号、发票金额、备注
            </p>
            <div class="form-item"><label>选择文件</label><input type="file" id="importFile" accept=".xlsx,.xls"></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('importModal')">取消</button>
            <button class="btn btn-primary" id="btnImportSave">导入</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/project-selector.js"></script>
<script>
    var curProject = null;
    var page = 1, pageSize = 10, total = 0;
    var staffList = [];

    $(function () {
        RB.checkLogin(function () { 
            loadYears(); 
            recalculatePageSize(); 
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#projectId',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { page = 1; load(); }
            });
        });
        $('#btnSearch').on('click', function () { page = 1; load(); });
        $('#btnAdd').on('click', function() { RB.withPerm('expense:edit', showAddModal, '权限不足，无法新增费用'); });
        $('#btnSave').on('click', function() { RB.withPerm('expense:edit', save, '权限不足，无法编辑费用'); });
        $('#btnImport').on('click', function() { RB.withPerm('expense:import', function() { RB.openModal('importModal'); }, '权限不足，无法导入费用数据'); });
        $('#btnImportSave').on('click', function() { RB.withPerm('expense:import', importExcel, '权限不足，无法导入费用数据'); });
        $('#btnExport').on('click', exportExpense);
        $(window).on('resize', function () { recalculatePageSize(); load(); });
    });

    function recalculatePageSize() {
        var tableWrap = $('.table-wrap');
        var pagination = $('#pagination');
        var toolbar = $('.toolbar');
        
        if (tableWrap.length === 0) {
            pageSize = 10;
            return;
        }
        
        var windowHeight = $(window).height();
        var toolbarHeight = toolbar.length > 0 ? toolbar.outerHeight(true) : 50;
        var paginationHeight = pagination.length > 0 ? pagination.outerHeight(true) : 60;
        var topMargin = 20;
        var bottomMargin = 20;
        
        var availableHeight = windowHeight - toolbarHeight - paginationHeight - topMargin - bottomMargin;
        
        var headerHeight = tableWrap.find('thead tr').height() || 36;
        var rowHeight = 36;
        var tableAvailableHeight = availableHeight - headerHeight - 16;
        
        var calculatedSize = Math.max(5, Math.floor(tableAvailableHeight / rowHeight));
        pageSize = calculatedSize;
    }

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    function loadStaff() {
        var pid = $('#projectId').val();
        if (!pid) return;
        RB.post('/api/project-staff?op=list', { projectId: pid, page: 1, pageSize: 1000 }).done(function (r) {
            if (r.code === 0) {
                staffList = r.data.list || [];
                var html = '<option value="">请选择报销人</option>';
                for (var i = 0; i < staffList.length; i++) {
                    var s = staffList[i];
                    html += '<option value="' + s.userCode + '" data-name="' + s.userName + '">' + 
                        s.userName + ' (' + s.userCode + ')</option>';
                }
                $('#workNo').html(html);
            }
        });
    }

    function load() {
        var pid = $('#projectId').val();
        if (!pid) { 
            $('#body').html('<tr><td colspan="9" style="text-align:center;color:#999;padding:24px;">请先选择项目</td></tr>'); 
            $('#footRow').hide(); 
            updatePagination(); 
            return; 
        }
        curProject = { id: pid };
        loadStaff();
        
        RB.post('/api/cost?op=list', { 
            projectId: pid, 
            costType: 'EXPENSE', 
            page: page, 
            pageSize: pageSize,
            workNo: $('#filterWorkNo').val(),
            expenseType: $('#filterExpenseType').val(),
            docNo: $('#filterDocNo').val(),
            startDate: $('#filterStartDate').val(),
            endDate: $('#filterEndDate').val()
        }).done(function (r) {
            if (r.code === 0) {
                total = r.data.total || 0;
                render(r.data.list);
                updatePagination();
            }
        });
    }

    function updatePagination() {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        $('#pageInfo').text('共 ' + total + ' 条，每页 ' + pageSize + ' 条，第 ' + page + '/' + totalPages + ' 页');
        
        $('#btnPrev').toggleClass('disabled', page <= 1);
        $('#btnNext').toggleClass('disabled', page >= totalPages);
        
        renderPageNumbers(totalPages);
    }

    function renderPageNumbers(totalPages) {
        var html = '';
        var showPages = 5;
        var startPage = Math.max(1, page - Math.floor(showPages / 2));
        var endPage = Math.min(totalPages, startPage + showPages - 1);
        
        if (startPage > 1) {
            html += '<button class="page-btn" onclick="goToPage(1)" style="display:inline-block;">1</button>';
            if (startPage > 2) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
        }
        
        for (var i = startPage; i <= endPage; i++) {
            html += '<button class="page-btn' + (i === page ? ' active' : '') + '" onclick="goToPage(' + i + ')" style="display:inline-block;">' + i + '</button>';
        }
        
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
            html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" style="display:inline-block;">' + totalPages + '</button>';
        }
        
        $('#pageNumbers').html(html);
    }

    function prevPage() {
        if (page > 1) { page--; load(); }
    }

    function nextPage() {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page < totalPages) { page++; load(); }
    }

    function goToPage(p) {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (p >= 1 && p <= totalPages && p !== page) {
            page = p;
            load();
        }
    }

    function jumpToPage() {
        var targetPage = parseInt($('#jumpPage').val());
        if (!isNaN(targetPage)) {
            goToPage(targetPage);
            $('#jumpPage').val('');
        }
    }

    function render(rows) {
        var typeMap = { 
            'ADVERT': '广告宣传费', 
            'PROMO': '促销活动费', 
            'TRANSPORT': '运输费', 
            'MEETING': '会议费', 
            'TRAVEL': '差旅费', 
            'OTHER': '其他费用' 
        };
        var html = '';
        var sumAmount = 0, sumAlloc = 0;
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var amount = Number(r.invoiceAmount || 0);
            var alloc = Number(r.allocatedAmount || 0);
            sumAmount += amount;
            sumAlloc += alloc;
            html += '<tr><td>' + (r.workNo || '') + '</td>' +
                '<td>' + (r.userName || '') + '</td>' +
                '<td>' + (r.reimburseDate || '') + '</td>' +
                '<td>' + (typeMap[r.expenseType] || r.expenseType || '') + '</td>' +
                '<td>' + (r.docNo || '') + '</td>' +
                '<td style="text-align:right;">' + RB.formatMoney(amount) + '</td>' +
                '<td style="text-align:right; color:#67c23a; font-weight:600;">' + RB.formatMoney(alloc) + '</td>' +
                '<td>' + (r.remark || '') + '</td>' +
                '<td>' +
                '<a href="javascript:;" onclick="showEditModal(' + r.id + ')">编辑</a> | ' +
                '<a href="javascript:;" onclick="del(' + r.id + ')">删除</a>' +
                '</td></tr>';
        }
        $('#body').html(html || '<tr><td colspan="9" style="text-align:center;color:#999;padding:24px;">暂无费用记录</td></tr>');
        if (rows.length > 0) {
            $('#footRow').show();
            $('#t1').text(RB.formatMoney(sumAmount));
            $('#t2').text(RB.formatMoney(sumAlloc));
        } else { 
            $('#footRow').hide(); 
        }
    }

    function showAddModal() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        $('#modalTitle').text('新增费用');
        $('#id').val('');
        $('#workNo').val('');
        $('#expenseType').val('');
        $('#reimburseDate').val('');
        $('#docNo').val('');
        $('#invoiceAmount').val('');
        $('#remark').val('');
        RB.openModal('modal');
    }

    function showEditModal(id) {
        RB.withPerm('expense:edit', function() {
            RB.post('/api/cost?op=get', { id: id, costType: 'EXPENSE' }).done(function (r) {
                if (r.code === 0) {
                    var d = r.data;
                    $('#modalTitle').text('编辑费用');
                    $('#id').val(d.id);
                    $('#workNo').val(d.workNo || '');
                    $('#expenseType').val(d.expenseType || 'ADVERT');
                    $('#reimburseDate').val(d.reimburseDate || d.occurDate || '');
                    $('#docNo').val(d.docNo || '');
                    $('#invoiceAmount').val(d.invoiceAmount || d.amount || '');
                    $('#remark').val(d.remark || '');
                    RB.openModal('modal');
                }
            });
        }, '权限不足，无法编辑费用');
    }

    function save() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        if (!$('#invoiceAmount').val()) { RB.toast('请输入发票金额', 'error'); return; }
        if (!$('#reimburseDate').val()) { RB.toast('请选择报销时间', 'error'); return; }
        
        var selectedOption = $('#workNo option:selected');
        var workNo = $('#workNo').val();
        var userName = selectedOption.data('name') || '';
        
        RB.post('/api/cost?op=' + ($('#id').val() ? 'update' : 'add'), {
            id: $('#id').val(),
            projectId: curProject.id,
            costType: 'EXPENSE',
            expenseType: $('#expenseType').val(),
            workNo: workNo,
            userName: userName,
            reimburseDate: $('#reimburseDate').val(),
            occurDate: $('#reimburseDate').val(),
            docNo: $('#docNo').val(),
            amount: $('#invoiceAmount').val(),
            remark: $('#remark').val()
        }).done(function (r) {
            if (r.code === 0) {
                RB.toast('保存成功', 'success');
                RB.closeModal('modal');
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        });
    }

    function del(id) {
        RB.withPerm('expense:edit', function() {
            if (!confirm('确定删除该费用记录吗？')) return;
            RB.post('/api/cost?op=delete', { id: id, costType: 'EXPENSE' }).done(function (r) {
                if (r.code === 0) {
                    RB.toast('删除成功', 'success');
                    load();
                } else {
                    RB.toast(r.msg, 'error');
                }
            });
        }, '权限不足，无法删除费用');
    }

    function importExcel() {
        var file = $('#importFile')[0].files[0];
        if (!file) { RB.toast('请选择文件', 'error'); return; }
        
        var formData = new FormData();
        formData.append('file', file);
        if (curProject) formData.append('projectId', curProject.id);
        formData.append('op', 'importExpenseExcel');
        
        $('#loadingOverlay').show();
        RB.api('/api/cost', 'POST', formData).done(function(r) {
            $('#loadingOverlay').hide();
            if (r.code === 0) {
                var msg = '导入成功：成功 ' + r.data.ok + ' 条';
                if (r.data.fail > 0) {
                    msg += '，失败 ' + r.data.fail + ' 条';
                    if (r.data.errors && r.data.errors.length > 0) {
                        msg += '\n' + r.data.errors.join('\n');
                    }
                }
                RB.toast(msg, r.data.fail > 0 ? 'warning' : 'success');
                RB.closeModal('importModal');
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        }).fail(function() {
            $('#loadingOverlay').hide();
            RB.toast('导入失败', 'error');
        });
    }

    function exportExpense() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        var token = RB.getToken();
        var workNo = $('#filterWorkNo').val();
        var expenseType = $('#filterExpenseType').val();
        var docNo = $('#filterDocNo').val();
        var startDate = $('#filterStartDate').val();
        var endDate = $('#filterEndDate').val();
        var url = './api/cost?op=exportExpense&projectId=' + curProject.id;
        if (workNo) url += '&workNo=' + encodeURIComponent(workNo);
        if (expenseType) url += '&expenseType=' + encodeURIComponent(expenseType);
        if (docNo) url += '&docNo=' + encodeURIComponent(docNo);
        if (startDate) url += '&startDate=' + encodeURIComponent(startDate);
        if (endDate) url += '&endDate=' + encodeURIComponent(endDate);
        if (token) url += '&token=' + encodeURIComponent(token);
        window.location.href = url;
    }
</script>
</body>
</html>
