<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>上游流向</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .stage-card { background:#fff; border-radius:6px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
        .stage-card h4 { margin:0 0 12px 0; font-size:14px; color:#303133; border-left:3px solid #409eff; padding-left:8px;}
        .stage-row { display:flex; gap:16px; flex-wrap:wrap;}
        .stage-item { flex:1; min-width:140px;}
        .stage-item .label { color:#909399; font-size:12px; margin-bottom:4px;}
        .stage-item .value { font-size:16px; font-weight:600; color:#303133;}
        .stage-item .value.target { color:#606266;}
        .stage-item .value.actual { color:#409eff;}
        .stage-item .value.rate { color:#67c23a;}
        .progress-bar { background:#ebeef5; border-radius:4px; height:16px; overflow:hidden; margin-top:4px;}
        .progress-fill { background:#409eff; height:100%; transition:width .3s;}
        .summary-row { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px;}
        .summary-item { padding:10px 16px; background:#f5f7fa; border-radius:4px;}
        .summary-item .label { color:#909399; font-size:12px;}
        .summary-item .value { font-size:18px; font-weight:600; color:#303133;}
        .table-nowrap td, .table-nowrap th { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #409eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div class="loading-spinner" style="margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在加载数据，请稍候...</div>
    </div>
</div>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <input type="hidden" id="projectId">
    <input id="txtProject" readonly placeholder="选择项目..." style="width:280px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnImport">+ 导入Excel</button>
    <input type="file" id="fileInput" accept=".xlsx" style="display:none;">
    <button class="btn" id="btnFinal">终版设置</button>
</div>

<!-- 导入月份选择弹窗 -->
<div class="modal-mask" id="modalImport">
    <div class="modal" style="width: 600px;">
        <div class="modal-header">导入流向<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalImport')">×</span></div>
        <div class="modal-body">
            <div class="form-item">
                <label>选择要导入的月份（<span id="projectPeriod"></span>）</label>
                <div id="monthList" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 8px;"></div>
            </div>
            <div id="importWarning" style="color: #e6a23c; margin-top: 10px; display: none;"></div>
            <p style="color: #909399; margin-top: 10px;">说明：选中月份的流向将被新导入数据替换（终版月份除外）</p>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalImport')">取消</button>
            <button class="btn btn-primary" id="btnSelectFile">下一步</button>
        </div>
    </div>
</div>

<!-- 导入等待遮罩 -->
<div class="modal-mask" id="modalLoading" style="background: rgba(0,0,0,0.5); z-index: 2000;">
    <div style="background: #fff; border-radius: 8px; padding: 32px 48px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.2);">
        <div style="font-size: 32px; margin-bottom: 16px;">⏳</div>
        <div id="loadingText" style="font-size: 16px; color: #333; margin-bottom: 8px;">正在导入数据...</div>
        <div style="font-size: 13px; color: #909399;">请勿关闭页面或操作其他内容</div>
    </div>
</div>

<div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="overview">达成情况</div>
    <div class="tab" data-tab="batches">导入批次</div>
    <div class="tab" data-tab="records">明细数据</div>
    <div class="tab" data-tab="month">月份汇总</div>
</div>

<div id="tabOverview" class="tab-pane">
    <div class="summary-row">
        <div class="summary-item">
            <div class="label">总体指标</div>
            <div class="value" id="totalTarget">-</div>
        </div>
        <div class="summary-item">
            <div class="label">总体达成</div>
            <div class="value" id="totalActual">-</div>
        </div>
        <div class="summary-item">
            <div class="label">达成率</div>
            <div class="value" id="totalRate">-</div>
        </div>
        <div class="summary-item">
            <div class="label">计算依据</div>
            <div class="value" id="calcBasis">-</div>
        </div>
    </div>

    <div class="stage-card">
        <h4>阶段达成情况</h4>
        <div class="stage-row" id="stageDetails"></div>
    </div>
</div>

<div id="tabBatches" class="tab-pane" style="display:none;">
    <div class="table-wrap">
        <table>
            <thead><tr><th>批次号</th><th>文件名</th><th>覆盖月份</th><th>导入人</th><th>导入时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="batchesBody"></tbody>
        </table>
    </div>
</div>
<div id="tabRecords" class="tab-pane" style="display:none;">
    <div class="toolbar">
        <input id="filterMonth" placeholder="筛选月份 yyyyMM">
        <label><input type="checkbox" id="showInvalid"> 显示失效</label>
        <button class="btn btn-primary" id="btnLoad">查询</button>
        <button class="btn" id="btnExportRecords">导出Excel</button>
    </div>
    <div class="table-wrap" id="recordsTableWrap">
        <table class="table-nowrap">
            <thead><tr>
                <th>月份</th><th>业务日期</th><th>产品名称</th><th>规格</th><th>销售方</th><th>销售城市</th>
                <th>核算价格</th><th>数量</th><th>核算金额</th><th>采购方</th><th>采购方城市</th><th>客户等级</th>
                <th>销售数量</th><th>无税金额</th><th>中标价金额</th><th>考核组</th><th>状态</th>
            </tr></thead>
            <tbody id="recordsBody"></tbody>
        </table>
    </div>
    <div class="pagination" id="recordsPagination" style="display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;">
        <button class="page-btn" id="btnRecordsPrev" onclick="prevRecordsPage()" style="display:inline-block;">上一页</button>
        <div id="recordsPageNumbers" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;"></div>
        <button class="page-btn" id="btnRecordsNext" onclick="nextRecordsPage()" style="display:inline-block;">下一页</button>
        <div class="page-jump" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;">
            <input type="text" id="jumpRecordsPage" placeholder="页码" onkeydown="if(event.keyCode===13) jumpToRecordsPage()" style="display:inline-block;">
            <button class="jump-btn" onclick="jumpToRecordsPage()" style="display:inline-block;">跳转</button>
        </div>
        <span class="page-info" id="recordsPageInfo" style="display:inline-block;"></span>
    </div>
</div>
<div id="tabMonth" class="tab-pane" style="display:none;">
    <div class="toolbar">
        <button class="btn" id="btnExportMonthSummary">导出Excel</button>
    </div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>月份</th><th>数量</th><th>金额</th><th>记录数</th><th>状态</th></tr></thead>
            <tbody id="monthBody"></tbody>
        </table>
    </div>
</div>

<div class="modal-mask" id="modalFinal">
    <div class="modal" style="width: 480px;">
        <div class="modal-header">终版月份设置<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalFinal')">×</span></div>
        <div class="modal-body">
            <div class="form-item"><label>选择月份</label>
                <select id="monthSelect" style="width:100%;"></select>
            </div>
            <p style="color:#888;">设置为终版后，该月流向不能再更新。</p>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalFinal')">取消</button>
            <button class="btn btn-primary" id="btnSetFinal">设为终版</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/project-selector.js"></script>
<script>
    var curProject = null;

    // 明细分页相关变量
    var recordsPage = 1, recordsPageSize = 10, recordsTotal = 0;
    var currentBatchId = null; // 当前选中的批次ID

    $(function () {
        RB.checkLogin(function () { 
            loadYears();
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#projectId',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { load(); }
            });
        });

        $('#btnSearch').on('click', function() { currentBatchId = null; load(); });
        $('#btnImport').on('click', showImportModal);
        $('#fileInput').on('change', importFile);
        $('#btnLoad').on('click', function() { recordsPage = 1; recalculateRecordsPageSize(); loadRecords(); });
        $('#btnFinal').on('click', showFinal);
        $('#btnSetFinal').on('click', doSetFinal);
        $('#btnSelectFile').on('click', proceedToFileSelect);
        $('#btnExportRecords').on('click', exportRecords);
        $('#btnExportMonthSummary').on('click', exportMonthSummary);

        $('#mainTabs .tab').on('click', function () {
            $('#mainTabs .tab').removeClass('active');
            $(this).addClass('active');
            var t = $(this).data('tab');
            $('#tabOverview').toggle(t === 'overview');
            $('#tabBatches').toggle(t === 'batches');
            $('#tabRecords').toggle(t === 'records');
            $('#tabMonth').toggle(t === 'month');
            if (t === 'overview') loadStageSummary();
            if (t === 'batches') { loadBatches(); currentBatchId = null; } // 切换到批次页签时清除批次选择
            if (t === 'records') { recalculateRecordsPageSize(); loadRecords(); }
            if (t === 'month') loadMonthSummary();
        });
        
        $(window).on('resize', function() {
            if ($('#tabRecords').is(':visible')) {
                recalculateRecordsPageSize();
                loadRecords();
            }
        });
    });

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    function recalculateRecordsPageSize() {
        var tableWrap = $('#recordsTableWrap');
        if (tableWrap.length === 0) {
            recordsPageSize = 10;
            return;
        }
        var windowHeight = $(window).height();
        var toolbarHeight = 50;
        var paginationHeight = 60;
        var tabHeight = 40;
        var filterToolbarHeight = 50;
        var topMargin = 20;
        var bottomMargin = 10;
        
        var availableHeight = windowHeight - toolbarHeight - paginationHeight - tabHeight - filterToolbarHeight - topMargin - bottomMargin;
        
        var headerHeight = 36;
        var rowHeight = 36;
        var tableAvailableHeight = availableHeight - headerHeight - 16;
        
        recordsPageSize = Math.max(5, Math.floor(tableAvailableHeight / rowHeight));
    }

    var selectedImportMonths = [];
    var projectStartDate = null;
    var projectEndDate = null;

    function showImportModal() {
        RB.withPerm('flow:import', function() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        
        // 获取项目信息以确定可选月份范围
        RB.post('/api/project?op=get', { id: curProject.id }).done(function(r) {
            if (r.code === 0 && r.data) {
                projectStartDate = r.data.periodStartDate;
                projectEndDate = r.data.periodEndDate;
                $('#projectPeriod').text(formatProjectPeriod(projectStartDate, projectEndDate));
                checkExistingMonthsAndShowModal();
            }
        });
        }, '权限不足，无法导入流向');
    }

    function formatProjectPeriod(startDate, endDate) {
        if (!startDate || !endDate) return '';
        var start = startDate.substring(0, 7);
        var end = endDate.substring(0, 7);
        return start + ' 至 ' + end;
    }

    function checkExistingMonthsAndShowModal() {
        RB.post('/api/upstream-flow?op=checkExistingMonths', { projectId: curProject.id }).done(function(r) {
            if (r.code === 0) {
                var existingMonths = r.data.existingMonths || [];
                var finalMonths = r.data.finalMonths || [];
                renderMonthSelection(existingMonths, finalMonths);
                RB.openModal('modalImport');
            }
        });
    }

    function renderMonthSelection(existingMonths, finalMonths) {
        var html = '<div style="margin-bottom: 10px;"><label><input type="checkbox"  style="width:20px;margin-right:4px;" id="selectAllMonths" onchange="toggleAllMonths()"> 全选</label></div>';
        html += '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">';
        
        // 生成项目周期内的所有月份
        var months = getMonthsInPeriod();
        var finalSet = new Set(finalMonths);
        var existingSet = new Set(existingMonths);
        
        for (var i = 0; i < months.length; i++) {
            var m = months[i];
            var isFinal = finalSet.has(m);
            var isExisting = existingSet.has(m);
            var displayName = m.substring(0, 4) + '-' + m.substring(4, 6);
            var disabled = isFinal ? 'disabled' : '';
            var checked = isExisting && !isFinal ? 'checked' : '';
            var className = isFinal ? 'color: #909399;' : (isExisting ? 'color: #67c23a;' : '');
            var label = displayName;
            if (isFinal) label += ' [终版]';
            else if (isExisting) label += ' [已导入]';
            
            html += '<label style="cursor: ' + (isFinal ? 'not-allowed' : 'pointer') + '; ' + className + '">' +
                '<input type="checkbox" value="' + m + '" ' + checked + ' ' + disabled + ' style="width:20px;margin-right:4px;" onchange="updateSelectedMonths()"> ' + label +
                '</label>';
        }
        html += '</div>';
        $('#monthList').html(html);
        updateSelectedMonths();
    }

    function getMonthsInPeriod() {
        var months = [];
        if (!projectStartDate || !projectEndDate) return months;
        
        var start = projectStartDate.substring(0, 7).replace('-', '');
        var end = projectEndDate.substring(0, 7).replace('-', '');
        
        var startYear = parseInt(start.substring(0, 4));
        var startMonth = parseInt(start.substring(4, 6));
        var endYear = parseInt(end.substring(0, 4));
        var endMonth = parseInt(end.substring(4, 6));
        
        for (var y = startYear; y <= endYear; y++) {
            for (var m = (y === startYear ? startMonth : 1); m <= (y === endYear ? endMonth : 12); m++) {
                var monthStr = y + '' + (m < 10 ? '0' + m : m);
                months.push(monthStr);
            }
        }
        return months;
    }

    function toggleAllMonths() {
        var checked = $('#selectAllMonths').is(':checked');
        $('#monthList input[type="checkbox"]:not(:disabled)').prop('checked', checked);
        updateSelectedMonths();
    }

    function updateSelectedMonths() {
        selectedImportMonths = [];
        $('#monthList input[type="checkbox"]:not(:disabled):checked').each(function() {
            selectedImportMonths.push($(this).val());
        });
        
        var warning = '';
        if (selectedImportMonths.length === 0) {
            warning = '请至少选择一个月份';
        }
        $('#importWarning').text(warning).toggle(warning !== '');
        $('#btnSelectFile').prop('disabled', selectedImportMonths.length === 0);
    }

    function proceedToFileSelect() {
        RB.withPerm('flow:import', function() {
        if (selectedImportMonths.length === 0) {
            RB.toast('请至少选择一个月份', 'error');
            return;
        }
        RB.closeModal('modalImport');
        $('#fileInput').click();
        }, '权限不足，无法导入流向');
    }

    function load() {
        var pid = $('#projectId').val();
        if (!pid) { 
            $('#batchesBody').html('<tr><td colspan="6" style="text-align:center;color:#999;padding:24px;">请选择项目</td></tr>');
            return; 
        }
        curProject = { id: pid };
        
        $('#loadingOverlay').show();
        
        var loadCount = 0;
        var totalLoads = 3;
        
        var checkLoadComplete = function() {
            loadCount++;
            if (loadCount >= totalLoads) {
                $('#loadingOverlay').hide();
            }
        };
        
        loadStageSummary(checkLoadComplete);
        
        RB.post('/api/upstream-flow?op=listAssessGroups', { projectId: pid }).done(function(r) {
            if (r.code === 0) assessGroups = r.data;
            checkLoadComplete();
        }).fail(function() {
            checkLoadComplete();
        });
        
        loadBatches(checkLoadComplete);
    }

    function loadBatches(cb) {
        if (!curProject) { if (cb) cb(); return; }
        RB.post('/api/upstream-flow?op=listBatches', { projectId: curProject.id }).done(function (r) {
            if (r.code === 0) renderBatches(r.data);
            if (cb) cb();
        }).fail(function() {
            if (cb) cb();
        });
    }

    function loadStageSummary(cb) {
        if (!curProject) { if (cb) cb(); return; }
        RB.post('/api/overview?op=overview', { projectId: curProject.id }).done(function (r) {
            if (r.code !== 0 || !r.data) { if (cb) cb(); return; }
            var d = r.data;
            $('#totalTarget').text(RB.formatMoney(d.totalTarget));
            $('#totalActual').text(RB.formatMoney(d.totalActual));
            $('#totalRate').text((d.totalRate || '0') + '%');
            $('#calcBasis').text(d.upstream && d.upstream.calcBasis === 'QTY' ? '数量' : '金额');
            curProject.calcBasis = d.upstream && d.upstream.calcBasis ? d.upstream.calcBasis : 'AMT';
            
            var stageHtml = '';
            var stages = [
                { key: 'stage1', name: '第一阶段', months: 'M1-M3' },
                { key: 'stage2', name: '第二阶段', months: 'M4-M6' },
                { key: 'stage3', name: '第三阶段', months: 'M7-M9' },
                { key: 'stage4', name: '第四阶段', months: 'M10-M12' }
            ];
            for (var i = 0; i < stages.length; i++) {
                var s = stages[i];
                var target = d[s.key + 'Target'];
                var actual = d[s.key + 'Actual'];
                var rate = d[s.key + 'Rate'];
                if (!target && !actual) continue;
                
                var rateNum = Number(rate) || 0;
                stageHtml += '<div class="stage-item">' +
                    '<div class="label">' + s.name + ' <span style="color:#ccc;">(' + s.months + ')</span></div>' +
                    '<div><span class="value target">指标: ' + RB.formatMoney(target) + '</span></div>' +
                    '<div><span class="value actual">达成: ' + RB.formatMoney(actual) + '</span></div>' +
                    '<div><span class="value rate">达成率: ' + rate + '%</span></div>' +
                    '<div class="progress-bar"><div class="progress-fill" style="width:' + Math.min(rateNum, 100) + '%"></div></div>' +
                    '</div>';
            }
            $('#stageDetails').html(stageHtml || '<div style="color:#999;">暂未设置阶段指标</div>');
            if (cb) cb();
        }).fail(function() {
            if (cb) cb();
        });
    }

    function renderBatches(rows) {
        var statusMap = {0: '生效', 1: '失效', 2: '部分失效', 3: '最终稿'};
        var statusColorMap = {0: '#67c23a', 1: '#f56c6c', 2: '#e6a23c', 3: '#409eff'};
        var html = '';
        for (var i = 0; i < rows.length; i++) {
            var b = rows[i];
            var statusText = statusMap[b.status] || '未知';
            var statusColor = statusColorMap[b.status] || '#999';
            html += '<tr><td>' + (b.batchCode || '') + '</td>' +
                '<td>' + (b.fileName || '') + '</td>' +
                '<td>' + (b.monthSummary || '') + '</td>' +
                '<td>' + (b.importUserName || '') + '</td>' +
                '<td>' + (b.importTime || '') + '</td>' +
                '<td><span style="color:' + statusColor + ';font-weight:600;">' + statusText + '</span></td>' +
                '<td><a href="javascript:;" onclick="viewBatch(' + b.id + ')">查看明细</a></td></tr>';
        }
        $('#batchesBody').html(html || '<tr><td colspan="7" style="text-align:center;color:#999;padding:24px;">暂无导入记录</td></tr>');
    }

    function viewBatch(id) {
        currentBatchId = id; // 保存当前选中的批次ID
        $('#mainTabs .tab').removeClass('active');
        $('#mainTabs .tab[data-tab=records]').addClass('active');
        $('#tabOverview').hide(); $('#tabBatches').hide(); $('#tabRecords').show(); $('#tabMonth').hide();
        recordsPage = 1;
        loadRecords(); // 直接调用loadRecords，它会根据currentBatchId加载数据
    }

    function importFile() {
        RB.withPerm('flow:import', function() {
        var f = $('#fileInput')[0].files[0];
        if (!f) return;
        
        // 检查是否选择了月份
        if (!selectedImportMonths || selectedImportMonths.length === 0) {
            RB.toast('请先选择要导入的月份', 'error');
            return;
        }
        
        // 显示等待遮罩
        $('#loadingOverlay').show();
        
        var fd = new FormData();
        fd.append('file', f);
        fd.append('projectId', curProject.id);
        fd.append('selectedMonths', selectedImportMonths.join(','));
        
        // 使用 RB.api 发送请求，自动带上 X-Token
        RB.api('/api/upstream-flow?op=importExcel', 'POST', fd).done(function (r) {
            $('#loadingOverlay').hide();
            if (r.code === 0) { 
                RB.toast('导入成功 ' + r.data.totalCount + ' 条, 月份: ' + r.data.monthSummary, 'success'); 
                selectedImportMonths = []; // 清空选择
                load(); 
            }
            else { RB.toast(r.msg, 'error'); }
        }).fail(function (xhr) {
            $('#loadingOverlay').hide();
            if (xhr.status === 401) {
                top.location.href = 'index.html';
            } else {
                RB.toast('导入失败', 'error');
            }
        });
        $('#fileInput').val('');
        }, '权限不足，无法导入流向');
    }

    function loadRecords() {
        if (!curProject) return;
        $('#loadingOverlay').show();
        var showInvalid = $('#showInvalid').is(':checked');
        var isValid = showInvalid ? '' : '1'; // 不勾选时只显示有效数据(isValid=1)
        
        var params = {
            projectId: curProject.id,
            month: $('#filterMonth').val(),
            isValid: isValid,
            page: recordsPage,
            pageSize: recordsPageSize
        };
        
        // 如果有选中的批次ID，则传递批次ID参数
        if (currentBatchId) {
            params.batchId = currentBatchId;
        }
        
        RB.post('/api/upstream-flow?op=listRecords', params).done(function (r) {
            $('#loadingOverlay').hide();
            if (r.code === 0) {
                recordsTotal = r.data.total || 0;
                renderRecords(r.data.list, recordsTotal, recordsPage, recordsPageSize);
            }
        }).fail(function() {
            $('#loadingOverlay').hide();
        });
    }

    var assessGroups = [];
    function renderRecords(rows, total, page, pageSize) {
        var showInvalid = $('#showInvalid').is(':checked');
        var html = '';
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var isInvalid = r.isValid !== 1;
            var rowStyle = isInvalid ? 'style="background-color:#fef0f0;color:#f56c6c;"' : '';
            var state = r.isFinal === 1 ? '<span style="color:#388e3c;">终版</span>' : (r.isValid === 1 ? '有效' : '<span>失效</span>');
            var groupHtml = r.assessGroupName || '';
            html += '<tr' + (rowStyle ? ' ' + rowStyle : '') + '><td>' + r.monthYyyymm + '</td>' +
                '<td>' + (r.businessDate || '') + '</td>' +
                '<td>' + (r.productName || '') + '</td>' +
                '<td>' + (r.spec || '') + '</td>' +
                '<td>' + (r.sellerName || '') + '</td>' +
                '<td>' + (r.sellerCity || '') + '</td>' +
                '<td>' + (r.calcPrice ?? '') + '</td>' +
                '<td>' + (r.quantity ?? '') + '</td>' +
                '<td>' + (r.calcAmount ?? '') + '</td>' +
                '<td>' + (r.buyerName || '') + '</td>' +
                '<td>' + (r.buyerCity || '') + '</td>' +
                '<td>' + (r.customerLevel || '') + '</td>' +
                '<td>' + (r.saleQty ?? '') + '</td>' +
                '<td>' + (r.noTaxAmount ?? '') + '</td>' +
                '<td>' + (r.bidAmount ?? '') + '</td>' +
                '<td>' + groupHtml + '</td>' +
                '<td>' + state + '</td></tr>';
        }
        $('#recordsBody').html(html || '<tr><td colspan="17" style="text-align:center;color:#999;padding:24px;">暂无明细</td></tr>');
        updateRecordsPagination();
    }
    
    function updateRecordsPagination() {
        var totalPages = Math.max(1, Math.ceil(recordsTotal / recordsPageSize));
        $('#recordsPageInfo').text('共 ' + recordsTotal + ' 条，每页 ' + recordsPageSize + ' 条，第 ' + recordsPage + '/' + totalPages + ' 页');
        
        $('#btnRecordsPrev').toggleClass('disabled', recordsPage <= 1);
        $('#btnRecordsNext').toggleClass('disabled', recordsPage >= totalPages);
        
        renderRecordsPageNumbers(totalPages);
    }

    function renderRecordsPageNumbers(totalPages) {
        var html = '';
        var showPages = 5;
        var startPage = Math.max(1, recordsPage - Math.floor(showPages / 2));
        var endPage = Math.min(totalPages, startPage + showPages - 1);
        
        if (startPage > 1) {
            html += '<button class="page-btn" onclick="goToRecordsPage(1)" style="display:inline-block;">1</button>';
            if (startPage > 2) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
        }
        
        for (var i = startPage; i <= endPage; i++) {
            html += '<button class="page-btn' + (i === recordsPage ? ' active' : '') + '" onclick="goToRecordsPage(' + i + ')" style="display:inline-block;">' + i + '</button>';
        }
        
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
            html += '<button class="page-btn" onclick="goToRecordsPage(' + totalPages + ')" style="display:inline-block;">' + totalPages + '</button>';
        }
        
        $('#recordsPageNumbers').html(html);
    }

    function prevRecordsPage() {
        if (recordsPage > 1) { recordsPage--; loadRecords(); }
    }

    function nextRecordsPage() {
        var totalPages = Math.max(1, Math.ceil(recordsTotal / recordsPageSize));
        if (recordsPage < totalPages) { recordsPage++; loadRecords(); }
    }

    function goToRecordsPage(p) {
        var totalPages = Math.max(1, Math.ceil(recordsTotal / recordsPageSize));
        if (p >= 1 && p <= totalPages && p !== recordsPage) {
            recordsPage = p;
            loadRecords();
        }
    }

    function jumpToRecordsPage() {
        var targetPage = parseInt($('#jumpRecordsPage').val());
        if (!isNaN(targetPage)) {
            goToRecordsPage(targetPage);
            $('#jumpRecordsPage').val('');
        }
    }

    function updateAssessGroup(recordId, groupId) {
        RB.withPerm('flow:view', function() {
        RB.post('/api/upstream-flow?op=updateRecordAssessGroup', { id: recordId, assessGroupId: groupId }).done(function(r) {
            if (r.code === 0) {
                RB.toast('考核组已更新', 'success');
                loadRecords();
            }
        });
        }, '权限不足，无法编辑流向');
    }

    function loadMonthSummary() {
        if (!curProject) return;
        RB.post('/api/upstream-flow?op=monthSummary', { projectId: curProject.id, basis: curProject.calcBasis || 'AMT' }).done(function (r) {
            var html = '';
            if (r.code === 0) for (var i = 0; i < r.data.length; i++) {
                var m = r.data[i];
                var status = m.isFinal === 1 ? '<span style="color:#388e3c;">终版</span>' : '可修改';
                html += '<tr><td>' + m.month + '</td><td>' + m.qtyCount + '</td><td>' + RB.formatMoney(m.totalAmt) + '</td><td>' + m.count + '</td><td>' + status + '</td></tr>';
            }
            $('#monthBody').html(html || '<tr><td colspan="5" style="text-align:center;color:#999;padding:24px;">暂无数据</td></tr>');
        });
    }

    function showFinal() {
        RB.withPerm('flow:final', function() {
        if (!curProject) return;
        RB.post('/api/upstream-flow?op=monthSummary', { projectId: curProject.id, basis: curProject.calcBasis || 'AMT' }).done(function (r) {
            var html = '';
            if (r.code === 0) for (var i = 0; i < r.data.length; i++) {
                if (r.data[i].isFinal !== 1) {
                    html += '<option value="' + r.data[i].month + '">' + r.data[i].month + '</option>';
                }
            }
            $('#monthSelect').html(html || '<option value="">无可设置月份</option>');
            RB.openModal('modalFinal');
        });
        }, '权限不足，无法设置终版');
    }

    function doSetFinal() {
        RB.withPerm('flow:final', function() {
        var m = $('#monthSelect').val();
        if (!m) { RB.toast('请选择月份', 'error'); return; }
        RB.post('/api/upstream-flow?op=setFinal', { projectId: curProject.id, month: m }).done(function (r) {
            if (r.code === 0) { RB.toast('已设置为终版', 'success'); RB.closeModal('modalFinal'); load(); }
            else { RB.toast(r.msg, 'error'); }
        });
        }, '权限不足，无法设置终版');
    }

    function exportRecords() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        $('#loadingOverlay').show();
        var month = $('#filterMonth').val();
        var showInvalid = $('#showInvalid').is(':checked');
        var url = './api/upstream-flow?op=exportRecords&projectId=' + curProject.id;
        if (month) url += '&month=' + month;
        if (showInvalid) url += '&showInvalid=true';
        
        downloadWithXhr(url, '上游流向明细.xlsx');
    }

    function exportMonthSummary() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        $('#loadingOverlay').show();
        var url = './api/upstream-flow?op=exportMonthSummary&projectId=' + curProject.id + '&basis=AMT';
        
        downloadWithXhr(url, '上游流向月份汇总.xlsx');
    }

    function downloadWithXhr(url, defaultFileName) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Token', RB.getToken());
        xhr.responseType = 'blob';
        
        xhr.onload = function() {
            $('#loadingOverlay').hide();
            if (xhr.status === 200) {
                var blob = xhr.response;
                var contentDisposition = xhr.getResponseHeader('Content-Disposition');
                var fileName = defaultFileName;
                if (contentDisposition && contentDisposition.indexOf('attachment') !== -1) {
                    var match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        fileName = decodeURIComponent(match[1].replace(/['"]/g, ''));
                    }
                }
                
                var downloadUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            } else {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var response = JSON.parse(e.target.result);
                        RB.toast(response.msg || '导出失败', 'error');
                    } catch (err) {
                        RB.toast('导出失败', 'error');
                    }
                };
                reader.readAsText(xhr.response);
            }
        };
        
        xhr.onerror = function() {
            $('#loadingOverlay').hide();
            RB.toast('网络错误', 'error');
        };
        
        xhr.send();
    }
</script>
