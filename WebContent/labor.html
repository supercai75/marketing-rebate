<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人工投入</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .summary-row { background:#fafafa; font-weight:600; color:#409eff;}
        .alloc-good { color:#67c23a; font-weight:600;}
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div class="loading-spinner" style="margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在导入数据，请稍候...</div>
    </div>
</div>
<div class="toolbar">
    <select id="selYear" style="width:120px;">
    </select>
    <select id="projectId" style="width: 280px;"></select>
    <input id="monthFilter" type="month" placeholder="月份筛选">
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">+ 新增人工</button>
    <button class="btn" id="btnImport">导入Excel</button>
    <button class="btn" id="btnExport">导出Excel</button>
    <span style="flex:1;"></span>
    <span style="color:#909399; font-size:12px;">兼职人员的本项目分摊金额 = 费用合计 × 投入比例 / ∑所有项目投入比例</span>
</div>
<div class="table-wrap">
    <table>
        <thead><tr>
            <th>月度</th>
            <th>人员工号</th>
            <th>姓名</th>
            <th>投入类型</th>
            <th>应发工资</th>
            <th>福利等其它人工费用</th>
            <th>费用合计</th>
            <th>本项目分摊比例</th>
            <th>本项目分摊金额</th>
            <th>备注</th>
            <th>操作</th>
        </tr></thead>
        <tbody id="body"></tbody>
        <tfoot><tr id="footRow" style="display:none;" class="summary-row">
            <td colspan="4" style="text-align:right;">合计：</td>
            <td id="t1"></td>
            <td id="t2"></td>
            <td id="t3"></td>
            <td>-</td>
            <td id="t4"></td>
            <td colspan="2">-</td>
        </tr></tfoot>
    </table>
</div>

<div class="pagination" id="pagination" style="display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;">
    <button class="page-btn" id="btnPrev" onclick="prevPage()" style="display:inline-block;">上一页</button>
    <div id="pageNumbers" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;"></div>
    <button class="page-btn" id="btnNext" onclick="nextPage()" style="display:inline-block;">下一页</button>
    <div class="page-jump" style="display:inline-flex;flex-direction:row;flex-wrap:nowrap;align-items:center;">
        <input type="text" id="jumpPage" placeholder="页码" onkeydown="if(event.keyCode===13) jumpToPage()" style="display:inline-block;">
        <button class="jump-btn" onclick="jumpToPage()" style="display:inline-block;">跳转</button>
    </div>
    <span class="page-info" id="pageInfo" style="display:inline-block;"></span>
</div>

<div class="modal-mask" id="modal">
    <div class="modal" style="width: 500px;">
        <div class="modal-header" id="modalTitle">新增人工投入<span class="spacer"></span><span class="close" onclick="RB.closeModal('modal')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="id">
            <div class="form-item"><label>月度 *</label><input id="month" type="month" style="width:100%;"></div>
            <div class="form-item"><label>作业人员 *</label>
                <select id="staffSelect" style="width:100%;">
                    <option value="">请选择作业人员</option>
                </select>
            </div>
            <div class="form-item"><label>应发工资 *</label><input type="number" step="0.01" id="salary" style="width:100%;"></div>
            <div class="form-item"><label>福利等其它人工费用</label><input type="number" step="0.01" id="welfare" style="width:100%;" placeholder="社保、公积金、福利等"></div>
            <div class="form-item"><label>费用合计</label><input type="number" step="0.01" id="totalAmount" style="width:100%; background:#f5f7fa;" readonly></div>
            <div class="form-item"><label>备注</label><textarea id="description" rows="3" style="width:100%;"></textarea></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modal')">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="importModal">
    <div class="modal" style="width: 480px;">
        <div class="modal-header">导入人工Excel<span class="spacer"></span><span class="close" onclick="RB.closeModal('importModal')">×</span></div>
        <div class="modal-body">
            <p style="font-size:12px; color:#909399; margin-bottom:12px;">
                Excel列：月度、人员工号、姓名、应发工资、福利等其它人工费用、费用合计（可选）
            </p>
            <div class="form-item"><label>选择文件</label><input type="file" id="importFile" accept=".xlsx,.xls"></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('importModal')">取消</button>
            <button class="btn btn-primary" id="btnImportSave">导入</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script>
    var curProject = null;
    var page = 1, pageSize = 10, total = 0;
    var staffList = [];
    var curMonth = '';

    $(function () {
        RB.checkLogin(function () { loadYears(); });
        $('#selYear').on('change', function() { loadProjects(); });
        $('#btnSearch').on('click', function () { page = 1; load(); });
        $('#btnAdd').on('click', function() { RB.withPerm('labor:edit', showAddModal, '权限不足，无法新增人力投入'); });
        $('#btnSave').on('click', function() { RB.withPerm('labor:edit', save, '权限不足，无法编辑人力投入'); });
        $('#btnImport').on('click', function() { RB.withPerm('labor:import', function() { RB.openModal('importModal'); }, '权限不足，无法导入人力数据'); });
        $('#btnImportSave').on('click', function() { RB.withPerm('labor:import', importExcel, '权限不足，无法导入人力数据'); });
        $('#btnExport').on('click', exportLabor);
        $('#salary, #welfare').on('change keyup', calcAmount);
        $('#staffSelect').on('change', onStaffChange);
        $(window).on('resize', function () { recalculatePageSize(); load(); });
    });

    function recalculatePageSize() {
        var tableWrap = $('.table-wrap');
        var pagination = $('#pagination');
        var toolbar = $('.toolbar');
        
        if (tableWrap.length === 0) {
            pageSize = 10;
            return;
        }
        
        var windowHeight = $(window).height();
        var toolbarHeight = toolbar.length > 0 ? toolbar.outerHeight(true) : 50;
        var paginationHeight = pagination.length > 0 ? pagination.outerHeight(true) : 60;
        var topMargin = 20;
        var bottomMargin = 20;
        
        var availableHeight = windowHeight - toolbarHeight - paginationHeight - topMargin - bottomMargin;
        
        var headerHeight = tableWrap.find('thead tr').height() || 36;
        var rowHeight = 36;
        var tableAvailableHeight = availableHeight - headerHeight - 16;
        
        var calculatedSize = Math.max(5, Math.floor(tableAvailableHeight / rowHeight));
        pageSize = calculatedSize;
    }

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
            loadProjects();
        });
    }

    function loadProjects() {
        var coYear = $('#selYear').val();
        var param = coYear ? { coYear: coYear } : {};
        RB.post('/api/project?op=listByYear', param).done(function (r) {
            var html = '<option value="">选择项目...</option>';
            if (r.code === 0) for (var i = 0; i < r.data.length; i++) {
                html += '<option value="' + r.data[i].id + '">' + r.data[i].projectName + '</option>';
            }
            $('#projectId').html(html);
            $('#f_projectId').html(html);
        });
    }

    function loadStaff() {
        var pid = $('#projectId').val();
        if (!pid) return;
        RB.post('/api/project-staff?op=list', { projectId: pid, page: 1, pageSize: 1000 }).done(function (r) {
            if (r.code === 0) {
                staffList = r.data.list || [];
                var html = '<option value="">请选择作业人员</option>';
                for (var i = 0; i < staffList.length; i++) {
                    var s = staffList[i];
                    html += '<option value="' + s.userCode + '" data-name="' + s.userName + '" data-type="' + s.workType + '">' + 
                        s.userName + ' (' + s.userCode + ')</option>';
                }
                $('#staffSelect').html(html);
            }
        });
    }

    function calcAmount() {
        var s = parseFloat($('#salary').val()) || 0;
        var w = parseFloat($('#welfare').val()) || 0;
        $('#totalAmount').val((s + w).toFixed(2));
    }

    function onStaffChange() {
        var selected = $('#staffSelect option:selected');
        if (selected.val()) {
            $('#salary').focus();
        }
    }

    function load() {
        var pid = $('#projectId').val();
        if (!pid) { 
            $('#body').html('<tr><td colspan="11" style="text-align:center;color:#999;padding:24px;">请先选择项目</td></tr>'); 
            $('#footRow').hide(); 
            updatePagination(); 
            return; 
        }
        curProject = { id: pid };
        curMonth = $('#monthFilter').val();
        
        loadStaff();
        
        RB.post('/api/cost?op=list', { projectId: pid, costType: 'LABOR', month: curMonth, page: page, pageSize: pageSize }).done(function (r) {
            if (r.code === 0) {
                total = r.data.total || 0;
                render(r.data.list);
                updatePagination();
            }
        });
    }

    function updatePagination() {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        $('#pageInfo').text('共 ' + total + ' 条，每页 ' + pageSize + ' 条，第 ' + page + '/' + totalPages + ' 页');
        
        $('#btnPrev').toggleClass('disabled', page <= 1);
        $('#btnNext').toggleClass('disabled', page >= totalPages);
        
        renderPageNumbers(totalPages);
    }

    function renderPageNumbers(totalPages) {
        var html = '';
        var showPages = 5;
        var startPage = Math.max(1, page - Math.floor(showPages / 2));
        var endPage = Math.min(totalPages, startPage + showPages - 1);
        
        if (startPage > 1) {
            html += '<button class="page-btn" onclick="goToPage(1)" style="display:inline-block;">1</button>';
            if (startPage > 2) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
        }
        
        for (var i = startPage; i <= endPage; i++) {
            html += '<button class="page-btn' + (i === page ? ' active' : '') + '" onclick="goToPage(' + i + ')" style="display:inline-block;">' + i + '</button>';
        }
        
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += '<span class="page-dots" style="display:inline-block;">...</span>';
            }
            html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" style="display:inline-block;">' + totalPages + '</button>';
        }
        
        $('#pageNumbers').html(html);
    }

    function prevPage() {
        if (page > 1) { page--; load(); }
    }

    function nextPage() {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page < totalPages) { page++; load(); }
    }

    function goToPage(p) {
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (p >= 1 && p <= totalPages && p !== page) {
            page = p;
            load();
        }
    }

    function jumpToPage() {
        var targetPage = parseInt($('#jumpPage').val());
        if (!isNaN(targetPage)) {
            goToPage(targetPage);
            $('#jumpPage').val('');
        }
    }

    function render(rows) {
        var html = '';
        var sum = { salary: 0, welfare: 0, total: 0, alloc: 0 };
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var typeName = { 'FULL': '全职', 'PART': '兼职', 'OUTSOURCE': '外包' }[r.workType] || r.workType;
            var totalAmt = Number(r.totalAmount || 0);
            var alloc = Number(r.allocatedAmount || 0);
            // 计算分摊比例：如果是兼职人员，显示计算后的比例；否则显示100%
            var allocRatio = r.allocRatio ? (parseFloat(r.allocRatio) * 100).toFixed(0) + '%' : '100%';
            sum.salary += Number(r.salary || 0);
            sum.welfare += Number(r.welfare || 0);
            sum.total += totalAmt;
            sum.alloc += alloc;
            html += '<tr>' +
                '<td>' + (r.month || '') + '</td>' +
                '<td>' + (r.userCode || '') + '</td>' +
                '<td>' + (r.userName || '') + '</td>' +
                '<td>' + typeName + '</td>' +
                '<td style="text-align:right;">' + RB.formatMoney(r.salary) + '</td>' +
                '<td style="text-align:right;">' + RB.formatMoney(r.welfare) + '</td>' +
                '<td style="text-align:right;">' + RB.formatMoney(totalAmt) + '</td>' +
                '<td style="text-align:right;">' + allocRatio + '</td>' +
                '<td style="text-align:right;" class="alloc-good">' + RB.formatMoney(alloc) + '</td>' +
                '<td>' + (r.description || '') + '</td>' +
                '<td>' +
                '<a href="javascript:;" onclick="showEditModal(' + r.id + ')">编辑</a> | ' +
                '<a href="javascript:;" onclick="del(' + r.id + ')">删除</a>' +
                '</td></tr>';
        }
        $('#body').html(html || '<tr><td colspan="11" style="text-align:center;color:#999;padding:24px;">暂无人工记录</td></tr>');
        if (rows.length > 0) {
            $('#footRow').show();
            $('#t1').text(RB.formatMoney(sum.salary));
            $('#t2').text(RB.formatMoney(sum.welfare));
            $('#t3').text(RB.formatMoney(sum.total));
            $('#t4').text(RB.formatMoney(sum.alloc));
        } else { $('#footRow').hide(); }
    }

    function showAddModal() {
        var pid = $('#projectId').val();
        if (!pid) { RB.toast('请先选择项目', 'error'); return; }
        curProject = { id: pid };
        
        $('#modalTitle').text('新增人工投入');
        $('#id').val('');
        // 使用查询时的月度作为默认值
        $('#month').val(curMonth || new Date().toISOString().substr(0, 7));
        loadStaff();
        $('#staffSelect').val('');
        $('#salary').val('');
        $('#welfare').val('');
        $('#totalAmount').val('');
        $('#description').val('');
        RB.openModal('modal');
    }

    function showEditModal(id) {
        RB.withPerm('labor:edit', function() {
            RB.post('/api/cost?op=get', { id: id }).done(function (r) {
                if (r.code === 0) {
                    var d = r.data;
                    $('#modalTitle').text('编辑人工投入');
                    $('#id').val(d.id);
                    $('#month').val(d.month);
                    loadStaff();
                    $('#staffSelect').val(d.userCode || '');
                    $('#salary').val(d.salary);
                    $('#welfare').val(d.welfare || 0);
                    $('#totalAmount').val(d.totalAmount);
                    $('#description').val(d.description || '');
                    RB.openModal('modal');
                }
            });
        }, '权限不足，无法编辑人力投入');
    }

    function save() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        if (!$('#month').val()) { RB.toast('请选择月度', 'error'); return; }
        if (!$('#staffSelect').val()) { RB.toast('请选择作业人员', 'error'); return; }
        if (!$('#salary').val()) { RB.toast('请输入应发工资', 'error'); return; }

        var selectedOption = $('#staffSelect option:selected');
        var userCode = selectedOption.val();
        var userName = selectedOption.data('name') || '';
        var workType = selectedOption.data('type') || '';

        RB.post('/api/cost?op=add', {
            costType: 'LABOR',
            month: $('#month').val(),
            userCode: userCode,
            userName: userName,
            workType: workType,
            salary: $('#salary').val(),
            welfare: $('#welfare').val() || 0,
            totalAmount: $('#totalAmount').val(),
            description: $('#description').val()
        }).done(function (r) {
            if (r.code === 0) {
                RB.toast('保存成功', 'success');
                RB.closeModal('modal');
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        });
    }

    function del(id) {
        RB.withPerm('labor:edit', function() {
            if (!confirm('确定删除该人工记录吗？')) return;
            RB.post('/api/cost?op=delete', { id: id, costType: 'LABOR' }).done(function (r) {
                if (r.code === 0) { RB.toast('删除成功', 'success'); load(); }
            });
        }, '权限不足，无法删除人力投入');
    }

    function importExcel() {
        var file = $('#importFile')[0].files[0];
        if (!file) { RB.toast('请选择文件', 'error'); return; }
        
        var formData = new FormData();
        formData.append('file', file);
        if (curProject) formData.append('projectId', curProject.id);
        formData.append('op', 'importLaborExcel');
        
        $('#loadingOverlay').show();
        RB.api('/api/cost', 'POST', formData).done(function(r) {
            $('#loadingOverlay').hide();
            if (r.code === 0) {
                var msg = '导入成功：成功 ' + r.data.ok + ' 条';
                if (r.data.fail > 0) {
                    msg += '，失败 ' + r.data.fail + ' 条';
                    if (r.data.errors && r.data.errors.length > 0) {
                        msg += '\n' + r.data.errors.join('\n');
                    }
                }
                RB.toast(msg, r.data.fail > 0 ? 'warning' : 'success');
                RB.closeModal('importModal');
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        }).fail(function() {
            $('#loadingOverlay').hide();
            RB.toast('导入失败', 'error');
        });
    }

    function exportLabor() {
        if (!curProject) { RB.toast('请先选择项目', 'error'); return; }
        var token = RB.getToken();
        var month = $('#monthFilter').val();
        var url = './api/cost?op=exportLabor&projectId=' + curProject.id;
        if (month) url += '&workNo=' + encodeURIComponent(month);
        if (token) url += '&token=' + encodeURIComponent(token);
        window.location.href = url;
    }
</script>
</body>
</html>
