<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="toolbar">
    <input id="kw" placeholder="搜索项目名称/厂牌" style="width: 220px;">
    <select id="projectGroupFilter"><option value="">全部分组</option></select>
    <select id="status">
        <option value="">全部状态</option>
        <option value="NEW">新建</option>
        <option value="RUNNING">进行中</option>
        <option value="CLOSED">已关闭</option>
    </select>
    <select id="coYear">
        <option value="">全部年度</option>
    </select>
    <select id="undertakingDeptFilter"><option value="">全部部门</option></select>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn btn-success" id="btnAdd">+ 新建项目</button>
    <button class="btn" id="btnImportBpm">从BPM引入立项</button>
</div>
<div class="table-wrap">
    <table>
        <thead>
        <tr>
            <th style="width:60px;">序号</th>
            <th>项目编号</th>
            <th>项目名称</th>
            <th>签约厂牌</th>
            <th>合作年度</th>
            <th>项目分组</th>
            <th>承接部门</th>
            <th>项目目标规模</th>
            <th>预计收益</th>
            <th>状态</th>
            <th>负责人</th>
            <th style="width:200px;">操作</th>
        </tr>
        </thead>
        <tbody id="dataBody"></tbody>
    </table>
</div>
<div class="pager">
    <span class="info" id="pagerInfo"></span>
    <button class="pg-btn" id="pgPrev">上一页</button>
    <span id="pgNums"></span>
    <button class="pg-btn" id="pgNext">下一页</button>
</div>

<!-- 新建/编辑项目 -->
<div class="modal-mask" id="modalForm">
    <div class="modal" style="width: 720px;">
        <div class="modal-header"><span id="modalTitle">新建项目</span><span class="spacer"></span><span class="close" onclick="RB.closeModal('modalForm')">×</span></div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-item col-4"><label>项目编号</label><input id="f_projectCode"></div>
                <div class="form-item col-4"><label>项目名称 *</label><input id="f_projectName"></div>
                <div class="form-item col-4"><label>签约厂牌</label><input id="f_brand"></div>
                <div class="form-item col-4"><label>合作品种(<=200字)</label><input id="f_coProduct" maxlength="200"></div>
                <div class="form-item col-4"><label>合作模式</label><input id="f_coMode"></div>
                <div class="form-item col-4"><label>合作年度</label><input id="f_coYear" type="number" min="2000" max="2100" placeholder="如2024" maxlength="4"></div>
                <div class="form-item col-4"><label>项目分组（下拉选已有）</label>
                    <select id="f_projectGroupId"><option value="">（不分组）</option></select></div>
                <div class="form-item col-4"><label>或输入新分组名</label>
                    <input id="f_projectGroupName" placeholder="输入后自动创建分组"></div>
                <div class="form-item col-4"><label>承接部门</label><input id="f_undertakingDept" maxlength="100"></div>
                <div class="form-item col-4"><label>起始日期</label><input id="f_periodStartDate" type="date"></div>
                <div class="form-item col-4"><label>终止日期</label><input id="f_periodEndDate" type="date"></div>
                <div class="form-item col-4"><label>覆盖地区(<=200字)</label><input id="f_region" maxlength="200"></div>
                <div class="form-item col-4"><label>项目目标规模(元)</label><input id="f_targetScale" type="number" step="0.01"></div>
                <div class="form-item col-4"><label>预计收益返利金额(元)</label><input id="f_expectedRebate" type="number" step="0.01"></div>
                <div class="form-item col-4"><label>预计费用(元)</label><input id="f_expectedCost" type="number" step="0.01"></div>
                <div class="form-item col-12"><label>项目信息简述</label><textarea id="f_description"></textarea></div>
                <div class="form-item col-4"><label>状态</label>
                    <select id="f_status"><option value="NEW">新建</option><option value="RUNNING">进行中</option><option value="CLOSED">已关闭</option></select></div>
            </div>
            <div id="stageConfigSection" style="display:none; margin-top:12px; padding:12px; background:#f5f7fa; border:1px solid #dcdfe6; border-radius:4px;">
                <div style="font-weight:bold; margin-bottom:8px; color:#e6a23c;">
                    项目周期非12个月（共 <span id="stageMonthCount">0</span> 个月），请定义每个阶段对应的月份区间
                </div>
                <table style="width:100%; font-size:13px;">
                    <thead><tr>
                        <th style="text-align:left; padding:4px;">阶段</th>
                        <th style="text-align:left; padding:4px;">起始月份</th>
                        <th style="text-align:left; padding:4px;">截止月份</th>
                        <th style="text-align:left; padding:4px;">说明</th>
                    </tr></thead>
                    <tbody id="stageConfigBody"></tbody>
                </table>
                <div style="margin-top:6px; color:#909399; font-size:12px;">
                    提示：默认按等分预填，可按需调整；四阶段需连续且覆盖整个项目周期。
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalForm')">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<!-- 从BPM引入立项 - 弹出窗口 -->
<div class="modal-mask" id="modalBpmList">
    <div class="modal" style="width:1000px;max-height:85vh;">
        <div class="modal-header">从BPM引入立项 - 选择项目<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalBpmList')">×</span></div>
        <div class="modal-body" style="max-height:68vh;overflow-y:auto;">
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px; padding:10px; background:#f5f7fa; border-radius:4px;">
                <label>项目名称筛选：</label>
                <input type="text" id="bpmProjNameFilter" placeholder="输入项目名称关键词" style="width:300px; padding:4px 8px; border:1px solid #dcdfe6; border-radius:4px;">
                <button class="btn btn-primary" id="btnBpmProjFilter">筛选</button>
                <span id="bpmProjTip" style="color:#909399; font-size:12px; margin-left:8px;"></span>
            </div>
            <div class="table-wrap" style="margin:0;">
                <table style="font-size:13px; table-layout:fixed;">
                    <colgroup>
                        <col style="width:50px;">
                        <col style="width:30%;">
                        <col style="width:18%;">
                        <col style="width:12%;">
                        <col style="width:10%;">
                        <col style="width:20%;">
                    </colgroup>
                    <thead><tr>
                        <th>选择</th>
                        <th>项目名称</th>
                        <th>签约厂牌</th>
                        <th>合作品种</th>
                        <th>合作年度</th>
                        <th>覆盖地区</th>
                    </tr></thead>
                    <tbody id="bpmBody"></tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalBpmList')">关闭</button>
            <button class="btn btn-primary" id="btnBpmImport" disabled>确定引入</button>
        </div>
    </div>
</div>
<div class="modal-mask" id="modalPerson">
    <div class="modal" style="width: 800px;">
        <div class="modal-header">项目作业人员 - <span id="mp_projectName"></span>
            <span class="spacer"></span>
            <span class="close" onclick="RB.closeModal('modalPerson')">×</span></div>
        <div class="modal-body">
            <div class="toolbar">
                <button class="btn btn-primary btn-sm" id="btnAddPerson">+ 添加人员</button>
            </div>
            <table>
                <thead><tr><th>是否正式</th><th>工号</th><th>姓名</th><th>工作岗位</th><th>费用分配占比(%)</th><th>备注</th><th>操作</th></tr></thead>
                <tbody id="personBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalPerson')">关闭</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="modalPersonForm">
    <div class="modal" style="width: 480px;">
        <div class="modal-header">人员信息<span class="spacer"></span><span class="close" onclick="RB.closeModal('modalPersonForm')">×</span></div>
        <div class="modal-body">
            <input type="hidden" id="pf_id">
            <input type="hidden" id="pf_projectId">
            <div class="form-item"><label>是否正式员工</label><select id="pf_isFormal"><option value="1">正式</option><option value="0">临时</option></select></div>
            <div class="form-item"><label>人员(临时)工号</label><input id="pf_workNo"></div>
            <div class="form-item"><label>姓名 *</label><input id="pf_name"></div>
            <div class="form-item"><label>工作岗位</label><input id="pf_position"></div>
            <div class="form-item"><label>费用分配占比(%)</label><input id="pf_costRatio" type="number" value="100" step="0.01"></div>
            <div class="form-item"><label>备注</label><input id="pf_remark"></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="RB.closeModal('modalPersonForm')">取消</button>
            <button class="btn btn-primary" id="btnSavePerson">保存</button>
        </div>
    </div>
</div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script>
    var state = { page: 1, size: 20, total: 0 };
    var curProject = null;

    $(function () {
        RB.checkLogin(function () {
            loadYears();
            loadUndertakingDepts();
            loadProjectGroups();
            load();
        });

        $('#btnSearch').on('click', function () { state.page = 1; load(); });
        $('#pgPrev').on('click', function () { if (state.page > 1) { state.page--; load(); } });
        $('#pgNext').on('click', function () { if (state.page * state.size < state.total) { state.page++; load(); } });

        $('#btnAdd').on('click', function () { RB.withPerm('project:edit', function() { curProject = null; $('#modalTitle').text('新建项目'); clearForm(); RB.openModal('modalForm'); }, '权限不足，无法新增项目'); });
        $('#btnImportBpm').on('click', function () {
            RB.withPerm('project:edit', function() { loadBpmProjectList(); }, '权限不足，无法引入立项');
        });
        $('#btnBpmProjFilter').on('click', function () { queryBpmProjects($('#bpmProjNameFilter').val().trim()); });
        $('#bpmProjNameFilter').on('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); queryBpmProjects($(this).val().trim()); } });
        $('#btnBpmImport').on('click', function () { RB.withPerm('project:edit', confirmBpmProjectImport, '权限不足'); });

        $('#btnSave').on('click', saveForm);
        $('#btnSavePerson').on('click', savePerson);
        $('#btnAddPerson').on('click', function () { RB.withPerm('project:edit', function() { clearPersonForm(); $('#pf_projectId').val(curProject.id); RB.openModal('modalPersonForm'); }, '权限不足，无法新增项目'); });

        // 项目周期变化时，判断是否非12个月 → 显示阶段-月份配置
        $('#f_periodStartDate, #f_periodEndDate').on('change', updateStageConfigVisibility);
    });

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '<option value="">全部年度</option>';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#coYear').html(html);
            }
        });
    }

    function loadUndertakingDepts() {
        RB.post('/api/project?op=listUndertakingDepts', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '<option value="">全部部门</option>';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#undertakingDeptFilter').html(html);
            }
        });
    }

    function loadProjectGroups() {
        RB.post('/api/project?op=groups', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var filterOpt = '<option value="">全部分组</option>';
                var formOpt   = '<option value="">（不分组）</option>';
                for (var i = 0; i < r.data.length; i++) {
                    filterOpt += '<option value="' + r.data[i].id + '">' + esc(r.data[i].name) + '</option>';
                    formOpt   += '<option value="' + r.data[i].id + '">' + esc(r.data[i].name) + '</option>';
                }
                $('#projectGroupFilter').html(filterOpt);
                $('#f_projectGroupId').html(formOpt);
            }
        });
    }

    function load() {
        var gid = $('#projectGroupFilter').val();
        RB.post('/api/project?op=page', {
            keyword: $('#kw').val(),
            status: $('#status').val(),
            coYear: $('#coYear').val(),
            projectGroupId: (gid && gid !== '') ? gid : null,
            undertakingDept: $('#undertakingDeptFilter').val(),
            page: state.page,
            size: state.size
        }).done(function (r) {
            if (r.code === 0) {
                state.total = r.data.total;
                renderRows(r.data.rows);
                renderPager();
            }
        });
    }
    
    function formatStatus(status) {
        var map = { 'NEW': '新建', 'RUNNING': '进行中', 'CLOSED': '已关闭' };
        return map[status] || status || '';
    }
    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderRows(rows) {
        var html = '';
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            html += '<tr>' +
                '<td>' + ((state.page - 1) * state.size + i + 1) + '</td>' +
                '<td>' + (r.projectCode || '') + '</td>' +
                '<td><a href="overview.html?projectId=' + r.id + '" target="_blank">' + (r.projectName || '') + '</a></td>' +
                '<td>' + (r.brand || '') + '</td>' +
                '<td>' + (r.coYear || '') + '</td>' +
                '<td>' + (r.projectGroupName || '') + '</td>' +
                '<td>' + (r.undertakingDept || '') + '</td>' +
                '<td>' + RB.formatMoney(r.targetScale) + '</td>' +
                '<td>' + RB.formatMoney(r.expectedRebate) + '</td>' +
                '<td>' + formatStatus(r.status) + '</td>' +
                '<td>' + (r.ownerName || '') + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm" onclick="edit(' + r.id + ')">编辑</button> ' +
                    '<button class="btn btn-sm btn-danger" onclick="del(' + r.id + ')">删除</button>' +
                '</td>' +
                '</tr>';
        }
        $('#dataBody').html(html || '<tr><td colspan="11" style="text-align:center;color:#999;padding:24px;">暂无数据</td></tr>');
    }

    function renderPager() {
        var totalPg = Math.max(1, Math.ceil(state.total / state.size));
        $('#pagerInfo').text('共 ' + state.total + ' 条 / ' + totalPg + ' 页');
        $('#pgPrev').toggleClass('disabled', state.page <= 1);
        $('#pgNext').toggleClass('disabled', state.page >= totalPg);
        var n = '';
        for (var i = 1; i <= totalPg; i++) {
            n += '<button class="pg-btn ' + (i === state.page ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
        }
        $('#pgNums').html(n);
    }
    function goPage(p) { state.page = p; load(); }

    function edit(id) {
        RB.withPerm('project:edit', function() {
            RB.post('/api/project?op=get', { id: id }).done(function (r) {
                if (r.code === 0) { curProject = r.data; fillForm(r.data); RB.openModal('modalForm'); }
            });
        }, '权限不足，无法编辑项目');
    }

    function del(id) {
        RB.confirm('确认删除该项目？', function () {
            RB.post('/api/project?op=delete', { id: id }).done(function (r) {
                if (r.code === 0) { RB.toast('已删除', 'success'); load(); }
                else { RB.toast(r.msg, 'error'); }
            });
        });
    }

    function clearForm() {
        ['f_projectCode', 'f_projectName', 'f_brand', 'f_coProduct', 'f_coMode', 'f_coYear',
         'f_region', 'f_targetScale', 'f_expectedRebate', 'f_expectedCost', 'f_description',
         'f_projectGroupName', 'f_undertakingDept']
        .forEach(function (id) { $('#' + id).val(''); });
        $('#f_periodStartDate').val(''); $('#f_periodEndDate').val('');
        $('#f_status').val('NEW');
        $('#f_projectGroupId').val('');
        $('#stageConfigSection').hide();
        $('#stageConfigBody').empty();
    }
    function fillForm(p) {
        $('#f_projectCode').val(p.projectCode || '');
        $('#f_projectName').val(p.projectName || '');
        $('#f_brand').val(p.brand || '');
        $('#f_coProduct').val(p.coProduct || '');
        $('#f_coMode').val(p.coMode || '');
        $('#f_coYear').val(p.coYear || '');
        $('#f_periodStartDate').val(p.periodStartDate || '');
        $('#f_periodEndDate').val(p.periodEndDate || '');
        $('#f_region').val(p.region || '');
        $('#f_targetScale').val(p.targetScale || 0);
        $('#f_expectedRebate').val(p.expectedRebate || 0);
        $('#f_expectedCost').val(p.expectedCost || 0);
        $('#f_description').val(p.description || '');
        $('#f_status').val(p.status || 'NEW');
        $('#f_projectGroupId').val(p.projectGroupId || '');
        $('#f_projectGroupName').val('');
        $('#f_undertakingDept').val(p.undertakingDept || '');
        // 加载已有阶段-月份配置(非12个月周期项目)
        loadStageConfig(p.id);
    }

    // ==================== 阶段-月份配置 ====================
    var STAGE_DEFS = [
        { code: 'S1', name: '阶段一' },
        { code: 'S2', name: '阶段二' },
        { code: 'S3', name: '阶段三' },
        { code: 'S4', name: '阶段四' }
    ];

    function loadStageConfig(projectId) {
        if (!projectId) { updateStageConfigVisibility(); return; }
        RB.post('/api/project?op=getStageConfig', { id: projectId }).done(function (r) {
            if (r.code !== 0 || !r.data) { updateStageConfigVisibility(); return; }
            var d = r.data;
            if (d.isFullYear) {
                $('#stageConfigSection').hide();
                return;
            }
            // 非整12个月：显示配置区
            $('#stageMonthCount').text(d.monthCount);
            var existing = {};
            (d.configs || []).forEach(function (c) { existing[c.stageCode] = c; });
            renderStageRows(existing, d.defaultRanges);
            $('#stageConfigSection').show();
        }).fail(function () { updateStageConfigVisibility(); });
    }

    function updateStageConfigVisibility() {
        var ps = $('#f_periodStartDate').val();
        var pe = $('#f_periodEndDate').val();
        if (!ps || !pe) { $('#stageConfigSection').hide(); return; }
        var cnt = monthDiff(ps, pe);
        if (cnt === 12) {
            $('#stageConfigSection').hide();
        } else {
            $('#stageMonthCount').text(cnt);
            // 周期变化时丢弃旧配置，按等分预填供用户调整
            renderStageRows({}, suggestStageSplit(ps, pe));
            $('#stageConfigSection').show();
        }
    }

    /**
     * 将项目周期等分为4段，返回 { S1:[start,end], ... } (YYYYMM 数组)。
     * 多余月份优先分配给靠前的阶段。
     */
    function suggestStageSplit(startStr, endStr) {
        var start = new Date(startStr), end = new Date(endStr);
        var total = monthDiff(startStr, endStr);
        if (total < 4) total = 4;
        var base = Math.floor(total / 4);
        var extra = total % 4;
        var r = {};
        var cursor = new Date(start.getFullYear(), start.getMonth(), 1);
        for (var i = 0; i < 4; i++) {
            var len = base + (i < extra ? 1 : 0);
            var from = new Date(cursor);
            var to = new Date(cursor.getFullYear(), cursor.getMonth() + len - 1, 1);
            r[STAGE_DEFS[i].code] = [dateToYyyymm(from), dateToYyyymm(to)];
            cursor = new Date(cursor.getFullYear(), cursor.getMonth() + len, 1);
        }
        return r;
    }

    function dateToYyyymm(d) {
        return d.getFullYear() * 100 + (d.getMonth() + 1);
    }

    function renderStageRows(existing, defaultRanges) {
        var html = '';
        for (var i = 0; i < STAGE_DEFS.length; i++) {
            var s = STAGE_DEFS[i];
            var ex = existing[s.code] || {};
            var defR = defaultRanges && defaultRanges[s.code] ? defaultRanges[s.code] : null;
            var startVal = ex.startYyyymm ? yyyymmToMonth(ex.startYyyymm) : (defR ? yyyymmToMonth(defR[0]) : '');
            var endVal = ex.endYyyymm ? yyyymmToMonth(ex.endYyyymm) : (defR ? yyyymmToMonth(defR[1]) : '');
            html += '<tr>' +
                '<td style="padding:4px;">' + s.name + ' (' + s.code + ')</td>' +
                '<td style="padding:4px;"><input type="month" class="sc-start" data-code="' + s.code + '" value="' + (startVal || '') + '" style="width:140px;"></td>' +
                '<td style="padding:4px;"><input type="month" class="sc-end" data-code="' + s.code + '" value="' + (endVal || '') + '" style="width:140px;"></td>' +
                '<td style="padding:4px; color:#909399; font-size:12px;">月度数据将按此区间汇总到该阶段</td>' +
                '</tr>';
        }
        $('#stageConfigBody').html(html);
    }

    function collectStageConfigs() {
        var arr = [];
        $('#stageConfigBody tr').each(function () {
            var code = $(this).find('.sc-start').data('code');
            var sVal = $(this).find('.sc-start').val();
            var eVal = $(this).find('.sc-end').val();
            arr.push({
                stageCode: code,
                startYyyymm: sVal ? monthToYyyymm(sVal) : null,
                endYyyymm: eVal ? monthToYyyymm(eVal) : null
            });
        });
        return arr;
    }

    function validateStageConfigs(arr) {
        if (arr.length !== 4) return '阶段配置必须包含 S1-S4 共4个阶段';
        var prevEnd = 0;
        var ps = $('#f_periodStartDate').val();
        var pe = $('#f_periodEndDate').val();
        var periodStartYm = ps ? monthToYyyymm(ps) : 0;
        var periodEndYm = pe ? monthToYyyymm(pe) : 999999;
        for (var i = 0; i < arr.length; i++) {
            var c = arr[i];
            if (!c.startYyyymm || !c.endYyyymm) return '阶段 ' + c.stageCode + ' 的起始/截止月份不能为空';
            if (c.endYyyymm < c.startYyyymm) return '阶段 ' + c.stageCode + ' 的截止月份不能早于起始月份';
            if (c.startYyyymm <= prevEnd) return '阶段 ' + c.stageCode + ' 的起始月份必须晚于前一阶段的截止月份';
            prevEnd = c.endYyyymm;
        }
        if (arr[0].startYyyymm > periodStartYm) return '阶段S1起始月份必须不晚于项目起始月份(' + periodStartYm + ')';
        if (arr[3].endYyyymm < periodEndYm) return '阶段S4截止月份必须不早于项目终止月份(' + periodEndYm + ')';
        return null;
    }

    // "2026-01" -> 202601 ; "2026-01-15" -> 202601
    function monthToYyyymm(s) {
        if (!s) return 0;
        var parts = String(s).split('-');
        if (parts.length < 2) return 0;
        return parseInt(parts[0], 10) * 100 + parseInt(parts[1], 10);
    }
    // 202601 -> "2026-01"
    function yyyymmToMonth(n) {
        if (!n) return '';
        var y = Math.floor(n / 100), m = n % 100;
        return y + '-' + (m < 10 ? '0' + m : m);
    }
    // 起止日期之间的整月数(含起止月)
    function monthDiff(start, end) {
        var s = new Date(start), e = new Date(end);
        if (isNaN(s.getTime()) || isNaN(e.getTime())) return 0;
        return (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
    }

    function saveForm() {
        var p = {
            id: curProject ? curProject.id : null,
            projectCode: $('#f_projectCode').val(),
            projectName: $('#f_projectName').val(),
            brand: $('#f_brand').val(),
            coProduct: $('#f_coProduct').val(),
            coMode: $('#f_coMode').val(),
            coYear: $('#f_coYear').val(),
            periodStartDate: $('#f_periodStartDate').val(),
            periodEndDate: $('#f_periodEndDate').val(),
            region: $('#f_region').val(),
            targetScale: $('#f_targetScale').val(),
            expectedRebate: $('#f_expectedRebate').val(),
            expectedCost: $('#f_expectedCost').val(),
            description: $('#f_description').val(),
            status: $('#f_status').val(),
            undertakingDept: $('#f_undertakingDept').val()
        };
        // 分组：文本优先（用户希望新建分组）；否则取下拉中的 id
        var gName = $.trim($('#f_projectGroupName').val());
        if (gName) {
            p.projectGroupName = gName;
        } else {
            var gid = $('#f_projectGroupId').val();
            if (gid) p.projectGroupId = gid;
        }
        if (!p.projectName) { RB.toast('请填写项目名称', 'error'); return; }
        // 非12个月周期：收集并校验阶段-月份配置
        if ($('#stageConfigSection').is(':visible')) {
            var stageArr = collectStageConfigs();
            var err = validateStageConfigs(stageArr);
            if (err) { RB.toast(err, 'error'); return; }
            p.stageConfigs = JSON.stringify(stageArr);
        }
        var op = curProject ? 'update' : 'add';
        RB.post('/api/project?op=' + op, p).done(function (r) {
            if (r.code === 0) {
                RB.toast('保存成功', 'success');
                RB.closeModal('modalForm');
                loadProjectGroups(); // 新分组已创建，刷新下拉
                load();
            } else {
                RB.toast(r.msg, 'error');
            }
        });
    }

    function managePerson(id, name) {
        curProject = { id: id, projectName: name };
        $('#mp_projectName').text(name);
        loadPersons();
        RB.openModal('modalPerson');
    }

    function loadPersons() {
        RB.post('/api/project-person?op=list', { projectId: curProject.id }).done(function (r) {
            if (r.code === 0) {
                var html = '';
                for ( var i = 0; i < r.data.length; i++) {
                    var p = r.data[i];
                    html += '<tr>' +
                        '<td>' + (p.isFormal === 1 ? '正式' : '临时') + '</td>' +
                        '<td>' + (p.workNo || '') + '</td>' +
                        '<td>' + (p.name || '') + '</td>' +
                        '<td>' + (p.position || '') + '</td>' +
                        '<td>' + (p.costRatio || 0) + '</td>' +
                        '<td>' + (p.remark || '') + '</td>' +
                        '<td><button class="btn btn-sm" onclick="editPerson(' + p.id + ')">编辑</button> ' +
                        '<button class="btn btn-sm btn-danger" onclick="delPerson(' + p.id + ')">删除</button></td>' +
                        '</tr>';
                }
                $('#personBody').html(html || '<tr><td colspan="7" style="text-align:center;color:#999;padding:24px;">暂无人员</td></tr>');
            }
        });
    }

    function editPerson(id) {
        RB.withPerm('project:edit', function() {
            RB.post('/api/project-person?op=list', { projectId: curProject.id }).done(function (r) {
                var p = r.data.find(function (x) { return x.id === id; });
                if (p) {
                    $('#pf_id').val(p.id);
                    $('#pf_projectId').val(p.projectId);
                    $('#pf_isFormal').val(p.isFormal);
                    $('#pf_workNo').val(p.workNo);
                    $('#pf_name').val(p.name);
                    $('#pf_position').val(p.position);
                    $('#pf_costRatio').val(p.costRatio);
                    $('#pf_remark').val(p.remark);
                    RB.openModal('modalPersonForm');
                }
            });
        }, '权限不足，无法编辑项目');
    }

    function delPerson(id) {
        RB.confirm('确认删除？', function () {
            RB.post('/api/project-person?op=delete', { id: id }).done(function (r) {
                if (r.code === 0) { RB.toast('已删除', 'success'); loadPersons(); }
            });
        });
    }

    function clearPersonForm() {
        ['pf_id', 'pf_workNo', 'pf_name', 'pf_position', 'pf_remark'].forEach(function (id) { $('#' + id).val(''); });
        $('#pf_isFormal').val('1'); $('#pf_costRatio').val('100');
    }

    function savePerson() {
        var id = $('#pf_id').val();
        var p = {
            id: id || null,
            projectId: $('#pf_projectId').val(),
            isFormal: $('#pf_isFormal').val(),
            workNo: $('#pf_workNo').val(),
            name: $('#pf_name').val(),
            position: $('#pf_position').val(),
            costRatio: $('#pf_costRatio').val(),
            remark: $('#pf_remark').val()
        };
        if (!p.name) { RB.toast('请填写姓名', 'error'); return; }
        var op = id ? 'update' : 'add';
        RB.post('/api/project-person?op=' + op, p).done(function (r) {
            if (r.code === 0) { RB.toast('保存成功', 'success'); RB.closeModal('modalPersonForm'); loadPersons(); }
            else { RB.toast(r.msg, 'error'); }
        });
    }

    // ==================== BPM引入立项 ====================
    var bpmRows = [];
    var bpmSelectedIdx = -1;

    function loadBpmProjectList() {
        $('#bpmProjNameFilter').val('');
        bpmSelectedIdx = -1;
        $('#btnBpmImport').prop('disabled', true);
        $('#bpmProjTip').text('');
        queryBpmProjects('');
        RB.openModal('modalBpmList');
    }

    function queryBpmProjects(nameFilter) {
        RB.post('/api/project?op=listBpmProjects', { projectName: nameFilter || '' }).done(function (r) {
            if (r.code !== 0) { RB.toast(r.msg || '获取BPM数据失败', 'error'); return; }
            bpmRows = r.data || [];
            bpmSelectedIdx = -1;
            $('#btnBpmImport').prop('disabled', true);
            renderBpmList(bpmRows);
            $('#bpmProjTip').text('共 ' + bpmRows.length + ' 条可引入项目');
        }).fail(function () { RB.toast('网络错误', 'error'); });
    }

    function renderBpmList(rows) {
        var html = '';
        if (!rows || rows.length === 0) {
            html = '<tr><td colspan="6" style="text-align:center;color:#999;padding:30px;">无符合条件的BPM立项数据</td></tr>';
        } else {
            for (var i = 0; i < rows.length; i++) {
                var x = rows[i];
                html += '<tr data-idx="' + i + '" style="cursor:pointer;">' +
                    '<td style="text-align:center;"><input type="radio" name="bpmRow" value="' + i + '"></td>' +
                    '<td style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escAttr(x.projectName) + '">' + escAttr(x.projectName) + '</td>' +
                    '<td style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escAttr(x.brand) + '">' + escAttr(x.brand) + '</td>' +
                    '<td style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escAttr(x.coProduct) + '">' + escAttr(x.coProduct) + '</td>' +
                    '<td style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escAttr(x.coYear) + '">' + escAttr(x.coYear) + '</td>' +
                    '<td style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escAttr(x.region) + '">' + escAttr(x.region) + '</td>' +
                    '</tr>';
            }
        }
        $('#bpmBody').html(html);
        // 绑定行点击=单选
        $('#bpmBody > tr').off('click').on('click', function () {
            var idx = $(this).data('idx');
            if (idx == null) return;
            bpmSelectedIdx = idx;
            $('#bpmBody input[name="bpmRow"]').prop('checked', false);
            $(this).find('input[name="bpmRow"]').prop('checked', true);
            $('#bpmBody > tr').css('background', '');
            $(this).css('background', '#ecf5ff');
            $('#btnBpmImport').prop('disabled', false);
        });
    }

    function escAttr(v) {
        if (v == null) return '';
        return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function esc(v) { return v == null ? '' : String(v); }

    function confirmBpmProjectImport() {
        if (bpmSelectedIdx < 0 || !bpmRows[bpmSelectedIdx]) { RB.toast('请选择一个项目', 'error'); return; }
        var row = bpmRows[bpmSelectedIdx];
        RB.confirm(
            '将引入项目：<strong>' + esc(row.projectName) + '</strong>（编号：' + esc(row.projectCode) + '）<br>引入后可自由编辑，确认？',
            function () {
                var payload = {
                    bpmProcessId: row.bpmProcessId,
                    projectCode: row.projectCode,
                    projectName: row.projectName,
                    brand: row.brand,
                    coProduct: row.coProduct,
                    coMode: row.coMode,
                    coYear: row.coYear,
                    periodStartDate: row.periodStartDate,
                    periodEndDate: row.periodEndDate,
                    region: row.region,
                    targetScale: row.targetScale || 0,
                    expectedRebate: row.expectedRebate || 0,
                    expectedCost: row.expectedCost || 0,
                    description: row.description
                };
                RB.post('/api/project?op=importFromBpm', payload).done(function (r) {
                    if (r.code === 0) {
                        RB.toast('项目已引入', 'success');
                        RB.closeModal('modalBpmList');
                        state.page = 1;
                        load();
                    } else {
                        RB.toast(r.msg || '引入失败', 'error');
                    }
                }).fail(function () { RB.toast('网络错误', 'error'); });
            }
        );
    }
</script>
