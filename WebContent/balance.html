<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>项目平衡表</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .balance-table { font-size:12px;}
        .balance-table th { background:#f5f7fa; color:#606266; font-weight:600;}
        .balance-table td { white-space:nowrap;}
        .balance-table .name { color:#409eff; cursor:pointer; text-decoration:underline;}
        .balance-table .num { text-align:right; font-family:Consolas,monospace;}
        .balance-table .rate-good { color:#67c23a; font-weight:600;}
        .balance-table .rate-bad { color:#f56c6c; font-weight:600;}
        .balance-table .rate-zero { color:#909399;}
        .balance-table .profit { color:#e6a23c; font-weight:600;}
        .balance-table .profit-loss { color:#f56c6c; font-weight:600;}
        .summary-row { background:#fafafa; font-weight:600;}

        .toolbar { position: sticky; top: 0; z-index: 100; }
        .table-wrap { max-height: calc(100vh - 60px); overflow: auto; }
        .balance-table thead tr:first-child th { position: sticky; top: 0; z-index: 3; background:#f5f7fa; }
        .balance-table thead tr:nth-child(2) th { position: sticky; z-index: 2; background:#f5f7fa; }
        .balance-table tfoot td { position: sticky; bottom: 0; z-index: 2; background:#fafafa; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #409eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:8px; padding:32px 48px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
        <div class="loading-spinner" style="margin:0 auto 16px;"></div>
        <div style="font-size:16px; color:#333;">正在加载数据，请稍候...</div>
    </div>
</div>
<div class="toolbar">
    <select id="selYear" style="width:120px;"></select>
    <select id="selUndertakingDept" style="width:140px;"><option value="">全部部门</option></select>
    <select id="selProjectGroup" style="width:140px;"><option value="">全部分组</option></select>
    <input type="hidden" id="selProject">
    <input id="txtProject" readonly placeholder="全部项目（点击选择单个项目筛选）" style="width:280px; background:#fff; cursor:pointer; padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;">
    <button class="btn" id="btnSelProj">选择项目</button>
    <button class="btn" id="btnClearProj" title="清除已选项目">×</button>
    <button class="btn btn-primary" id="btnSearch">查询</button>
    <button class="btn" id="btnExport">导出Excel</button>
    <button class="btn" id="btnRecalcRebateUp">重新估算返利(上游)</button>
    <button class="btn" id="btnRecalcRebateDown">重新估算返利(下游)</button>
    <span style="flex:1;"></span>
    <span style="color:#909399; font-size:12px;">点击项目名称可进入项目概览</span>
</div>

<div class="table-wrap">
    <table class="balance-table">
        <thead>
            <tr>
                <th rowspan="2">序号</th>
                <th rowspan="2">项目名称</th>
                <th rowspan="2">合作周期</th>
                <th colspan="4">规模</th>
                <th colspan="6">金额(元)</th>
                <th colspan="3">收益(元)</th>
                <th colspan="3">达成率</th>
            </tr>
            <tr>
                <th>指标</th><th>达成数量</th><th>达成金额</th><th>达成率</th>
                <th>应收</th><th>实收</th><th>实际投入</th><th>外部应付</th><th>外部实付</th><th>合计支出</th>
                <th>应收收益</th><th>实收收益</th><th>预计收益</th>
                <th>应收达成</th><th>实收达成</th><th>应收兑现</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
        <tfoot><tr id="footRow" style="display:none;" class="summary-row">
            <td colspan="3" style="text-align:right;"><strong>合计：</strong></td>
            <td class="num" id="t1"></td>
            <td class="num" id="t2"></td>
            <td class="num" id="t2b"></td>
            <td class="num" id="t2c"></td>
            <td class="num" id="t3"></td>
            <td class="num" id="t4"></td>
            <td class="num" id="t5"></td>
            <td class="num" id="t6"></td>
            <td class="num" id="t7"></td>
            <td class="num" id="t12"></td>
            <td class="num" id="t8"></td>
            <td class="num" id="t9"></td>
            <td class="num" id="t10"></td>
            <td class="num" id="t11a"></td>
            <td class="num" id="t11b"></td>
            <td class="num" id="t11c"></td>
        </tr></tfoot>
    </table>
</div>

<div id="rebateResult" style="display:none; background:#fff; padding:16px 20px; border-radius:6px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);"></div>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/project-selector.js"></script>
<script>
    $(function () {
        // 动态调整表格区域高度，使表头和工具栏始终可见
        function adjustTableHeight() {
            var h = $('.toolbar').outerHeight(true) || 60;
            $('.table-wrap').css('max-height', 'calc(100vh - ' + h + 'px)');
            // 第二行表头的 top = 第一行表头高度（取 colspan 的 th，非 rowspan）
            var firstRowH = $('.balance-table thead tr:first-child th[colspan]').first().outerHeight() || 0;
            $('.balance-table thead tr:nth-child(2) th').css('top', firstRowH + 'px');
        }
        $(window).on('resize', adjustTableHeight);
        adjustTableHeight();

        RB.checkLogin(function () {
            loadYears();
            loadFilters();
            RB.bindProjectSelector({
                trigger: '#btnSelProj, #txtProject',
                display: '#txtProject',
                hidden: '#selProject',
                coYear: function() { return $('#selYear').val(); },
                onChange: function() { load(); }
            });
        });
        $('#btnSearch').on('click', load);
        $('#btnExport').on('click', exportXlsx);
        $('#btnClearProj').on('click', function() {
            $('#selProject').val('');
            $('#txtProject').val('');
            load();
        });
        $('#btnRecalcRebateUp').on('click', function () { recalcRebate('upstream'); });
        $('#btnRecalcRebateDown').on('click', function () { recalcRebate('downstream'); });
    });

    function recalcRebate(type) {
        var pid = $('#selProject').val();
        if (!pid) { RB.toast('请先选择单个项目', 'error'); return; }
        $('#loadingOverlay').show();
        RB.post('/api/overview?op=recalcRebate', { projectId: pid, type: type }).done(function (r) {
            $('#loadingOverlay').hide();
            if (r.code !== 0) { RB.toast(r.msg || '估算失败', 'error'); return; }
            var d = r.data || {};
            var html = '<div style="margin:10px 0;">';
            html += '<h4 style="margin:0 0 10px 0;font-size:14px;color:#303133;">估算返利明细（' + (type === 'upstream' ? '上游' : '下游') + '）</h4>';
            html += '<table class="balance-table"><thead><tr><th>阶段</th><th>目标</th><th>实际达成</th><th>估算返利</th></tr></thead><tbody>';
            (d.stageRebates || []).forEach(function (s) {
                html += '<tr><td>' + (s.stageName || s.stageCode || '') + '</td>' +
                    '<td class="num">' + RB.formatMoney(s.target) + '</td>' +
                    '<td class="num">' + RB.formatMoney(s.actual) + '</td>' +
                    '<td class="num">' + RB.formatMoney(s.rebateAmount) + '</td></tr>';
            });
            html += '<tr class="summary-row"><td>全年合计</td><td></td><td></td><td class="num">' + RB.formatMoney(d.totalRebate) + '</td></tr>';
            if (d.fullYearRebate && d.fullYearRebate > 0) {
                html += '<tr><td>按全年规则</td><td></td><td></td><td class="num">' + RB.formatMoney(d.fullYearRebate) + '</td></tr>';
            }
            html += '</tbody></table></div>';
            $('#rebateResult').html(html).show();
            RB.toast('估算完成', 'success');
        }).fail(function () {
            $('#loadingOverlay').hide();
            RB.toast('估算失败', 'error');
        });
    }

    function loadYears() {
        RB.post('/api/project?op=listYears', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selYear').html(html);
            }
        });
    }

    function loadFilters() {
        RB.post('/api/project?op=listUndertakingDepts', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '<option value="">全部部门</option>';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i] + '">' + r.data[i] + '</option>';
                }
                $('#selUndertakingDept').html(html);
            }
        });
        RB.post('/api/project?op=groups', {}).done(function (r) {
            if (r.code === 0 && r.data) {
                var html = '<option value="">全部分组</option>';
                for (var i = 0; i < r.data.length; i++) {
                    html += '<option value="' + r.data[i].id + '">' + r.data[i].name + '</option>';
                }
                $('#selProjectGroup').html(html);
            }
        });
    }

    function load() {
        $('#loadingOverlay').show();
        RB.post('/api/overview?op=balanceTable', { coYear: $('#selYear').val() }).done(function (r) {
            if (r.code !== 0) { RB.toast(r.msg, 'error'); $('#loadingOverlay').hide(); return; }
            var projectId = $('#selProject').val();
            var dept = $('#selUndertakingDept').val();
            var groupId = $('#selProjectGroup').val();
            var filteredData = r.data || [];
            if (projectId) {
                filteredData = filteredData.filter(function(item) {
                    return String(item.projectId) === String(projectId);
                });
            }
            if (dept) {
                filteredData = filteredData.filter(function(item) {
                    return String(item.undertakingDept || '') === String(dept);
                });
            }
            if (groupId) {
                filteredData = filteredData.filter(function(item) {
                    return String(item.projectGroupId || '') === String(groupId);
                });
            }
            render(filteredData);
            $('#loadingOverlay').hide();
        }).fail(function() {
            $('#loadingOverlay').hide();
        });
    }

    function pctCls(v) {
        var n = Number(v);
        if (!isFinite(n) || n === 0) return 'rate-zero';
        if (n >= 100) return 'rate-good';
        if (n < 60) return 'rate-bad';
        return '';
    }

    function profitCls(v) {
        var n = Number(v);
        if (!isFinite(n)) return '';
        if (n >= 0) return 'profit';
        return 'profit-loss';
    }

    function render(rows) {
        var html = '';
        var sum = {
            target: 0, actual: 0, actualQty: 0, actualAmt: 0,
            recv: 0, received: 0, invest: 0, extPayable: 0, extPaid: 0, totalExpense: 0,
            recvProfit: 0, actualProfit: 0, expectedProfit: 0
        };
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var receivable = Number(r.receivableTotal || 0);
            var received = Number(r.receivedTotal || 0);
            var invest = Number(r.investTotal || 0);
            var extPayable = Number(r.externalPayable || 0);
            var extPaid = Number(r.externalPaid || 0);
            var recvProfit = Number(r.recvProfit || 0);
            var actualProfit = Number(r.actualProfit || 0);
            var expectedProfit = Number(r.expectedRebate || 0);
            var totalExpense = invest + extPayable;
            
            var recvRate = r.recvProfitRate || '0.00';
            var actualRate = r.profitRate || '0.00';
            var cashRate = r.cashRate || '0.00';
            sum.target += Number(r.totalTarget || 0);
            sum.actual += Number(r.totalActual || 0);
            sum.actualQty += Number(r.totalActualQty || 0);
            sum.actualAmt += Number(r.totalActualAmt || 0);
            sum.recv += receivable;
            sum.received += received;
            sum.invest += invest;
            sum.extPayable += extPayable;
            sum.extPaid += extPaid;
            sum.totalExpense += totalExpense;
            sum.recvProfit += recvProfit;
            sum.actualProfit += actualProfit;
            sum.expectedProfit += expectedProfit;
            
            html += '<tr>' +
                '<td>' + (i + 1) + '</td>' +
                '<td><a class="name" data-pid="' + r.projectId + '">' + (r.projectName || '') + '</a></td>' +
                '<td>' + (r.coYear || '') + '</td>' +
                '<td class="num">' + RB.formatMoney(r.totalTarget) + '</td>' +
                '<td class="num">' + RB.formatMoney(r.totalActualQty) + '</td>' +
                '<td class="num">' + RB.formatMoney(r.totalActualAmt) + '</td>' +
                '<td class="num">' + (r.totalRate || '0.00') + '%</td>' +
                '<td class="num">' + RB.formatMoney(receivable) + '</td>' +
                '<td class="num">' + RB.formatMoney(received) + '</td>' +
                '<td class="num">' + RB.formatMoney(invest) + '</td>' +
                '<td class="num">' + RB.formatMoney(extPayable) + '</td>' +
                '<td class="num">' + RB.formatMoney(extPaid) + '</td>' +
                '<td class="num">' + RB.formatMoney(totalExpense) + '</td>' +
                '<td class="num ' + profitCls(recvProfit) + '">' + RB.formatMoney(recvProfit) + '</td>' +
                '<td class="num ' + profitCls(actualProfit) + '">' + RB.formatMoney(actualProfit) + '</td>' +
                '<td class="num">' + RB.formatMoney(expectedProfit) + '</td>' +
                '<td class="num ' + pctCls(recvRate) + '">' + recvRate + '%</td>' +
                '<td class="num ' + pctCls(actualRate) + '">' + actualRate + '%</td>' +
                '<td class="num ' + pctCls(cashRate) + '">' + cashRate + '%</td>' +
                '</tr>';
        }
        if (rows.length === 0) html = '<tr><td colspan="18" style="text-align:center;color:#999;padding:30px;">暂无项目</td></tr>';
        $('#body').html(html);
        if (rows.length > 0) {
            $('#footRow').show();
            $('#t1').text(RB.formatMoney(sum.target));
            $('#t2').text(RB.formatMoney(sum.actualQty));
            $('#t2b').text(RB.formatMoney(sum.actualAmt));
            $('#t2c').text(sum.target > 0 ? (sum.actual / sum.target * 100).toFixed(2) : '0.00');
            $('#t3').text(RB.formatMoney(sum.recv));
            $('#t4').text(RB.formatMoney(sum.received));
            $('#t5').text(RB.formatMoney(sum.invest));
            $('#t6').text(RB.formatMoney(sum.extPayable));
            $('#t7').text(RB.formatMoney(sum.extPaid));
            $('#t12').text(RB.formatMoney(sum.totalExpense));
            $('#t8').text(RB.formatMoney(sum.recvProfit));
            $('#t9').text(RB.formatMoney(sum.actualProfit));
            $('#t10').text(RB.formatMoney(sum.expectedProfit));
            $('#t11a').text('-');
            $('#t11b').text('-');
            $('#t11c').text('-');
        } else { $('#footRow').hide(); }

        $('.name').on('click', function () {
            var pid = $(this).data('pid');
            window.open('overview.html?projectId=' + pid, '_blank');
        });
    }

    function exportXlsx() {
        $('#loadingOverlay').show();
        var url = './api/overview?op=exportBalance&coYear=' + $('#selYear').val() + '&projectId=' + $('#selProject').val();
        
        downloadWithXhr(url, '项目平衡表.xlsx');
    }

    function downloadWithXhr(url, defaultFileName) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.setRequestHeader('X-Token', RB.getToken());
        xhr.responseType = 'blob';
        
        xhr.onload = function() {
            $('#loadingOverlay').hide();
            if (xhr.status === 200) {
                var contentType = xhr.getResponseHeader('Content-Type');
                
                if (contentType && contentType.indexOf('json') !== -1) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            var response = JSON.parse(e.target.result);
                            RB.toast(response.msg || '导出失败', 'error');
                        } catch (err) {
                            RB.toast('导出失败', 'error');
                        }
                    };
                    reader.readAsText(xhr.response);
                    return;
                }
                
                var blob = xhr.response;
                var contentDisposition = xhr.getResponseHeader('Content-Disposition');
                var fileName = defaultFileName;
                if (contentDisposition && contentDisposition.indexOf('attachment') !== -1) {
                    var match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                    if (match && match[1]) {
                        fileName = decodeURIComponent(match[1].replace(/['"]/g, ''));
                    }
                }
                
                var downloadUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            } else {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var response = JSON.parse(e.target.result);
                        RB.toast(response.msg || '导出失败', 'error');
                    } catch (err) {
                        RB.toast('导出失败', 'error');
                    }
                };
                reader.readAsText(xhr.response);
            }
        };
        
        xhr.onerror = function() {
            $('#loadingOverlay').hide();
            RB.toast('网络错误', 'error');
        };
        
        xhr.send();
    }
</script>
</body>
</html>
